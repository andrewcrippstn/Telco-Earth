                    }
                    count++;
                }
                multiSelection.clear();
                closeEditorPanel();
                renderTree();
                await persistTree();
                showToast(`Updated ${count} item(s)`, 'fa-check');
            }

            // ============ PROPERTIES ============
            function renderPropertiesTab() {
                const node = editorState.node;
                const rows = [['Type', node.type], ['Visible', node.visible === false ? 'No' : 'Yes']];
                if (node.type === 'placemark' && node.meta.lat != null) {
                    rows.push(['Latitude', node.meta.lat.toFixed(6)]);
                    rows.push(['Longitude', node.meta.lng.toFixed(6)]);
                    const el = getElevation(node.meta.lat, node.meta.lng);
                    rows.push(['Altitude', el !== null ? `${Math.round(el)} m` : '—']);
                } else if (node.type === 'los' && node.meta.lat != null) {
                    rows.push(['Center lat', node.meta.lat.toFixed(6)]);
                    rows.push(['Center lng', node.meta.lng.toFixed(6)]);
                    const el = getElevation(node.meta.lat, node.meta.lng);
                    rows.push(['Centre altitude', el !== null ? `${Math.round(el)} m` : '—']);
                } else if (editorState.isShape && node.meta.points) {
                    rows.push(['Vertices', node.meta.points.length]);
                    if (node.meta.distance != null) rows.push(['Length', formatDistance(node.meta.distance)]);
                    if (node.meta.area != null) rows.push(['Area', formatArea(node.meta.area)]);
                }
                if (node.children) rows.push(['Children', node.children.length]);
                if (node.type === 'terrain' && node.meta.key) rows.push(['Tile', node.meta.key]);

                let coordHTML = '';
                if ((node.type === 'placemark' || node.type === 'los') && node.meta.lat != null) {
                    coordHTML = `
                        <div class="editor-section-label">Position</div>
                        <div class="editor-field-row">
                            <div class="editor-field"><label>Latitude</label><input type="text" id="ed-lat" value="${node.meta.lat.toFixed(6)}"></div>
                            <div class="editor-field"><label>Longitude</label><input type="text" id="ed-lng" value="${node.meta.lng.toFixed(6)}"></div>
                        </div>
                        <div class="editor-hint">Drag the object on the map to reposition it — the panel updates live.</div>
                    `;
                }
                let vertAltHTML = '';
                if (editorState.isShape && node.meta.points) {
                    vertAltHTML = `<div class="editor-section-label">Vertex altitudes</div>` + node.meta.points.map((p, i) => {
                        const el = getElevation(p[0], p[1]);
                        return `<div style="display:grid;grid-template-columns:26px 1fr 1fr 1fr;gap:6px;padding:4px 6px;border-bottom:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:0.66rem;color:var(--ink-2);">
                            <span style="color:var(--sage);font-weight:700;">${i+1}</span>
                            <span>${p[0].toFixed(5)}</span>
                            <span>${p[1].toFixed(5)}</span>
                            <span style="text-align:right;color:var(--ink);">${el !== null ? Math.round(el) + ' m' : '—'}</span>
                        </div>`;
                    }).join('');
                }

                editorBody.innerHTML = `
                    <div class="editor-field"><label>Name</label><input type="text" id="ed-name" value="${escapeHtml(node.name)}"></div>
                    <div class="editor-field"><label>Description</label><textarea id="ed-desc" rows="3" placeholder="Optional description…">${escapeHtml(node.meta.desc || '')}</textarea></div>
                    ${coordHTML}
                    ${editorState.isLOS ? `
                        <div class="editor-section-label">LOS parameters</div>
                        <div class="editor-field-row">
                            <div class="editor-field"><label>Radius (m)</label><input type="number" id="los-radius" value="${node.meta.radius || 10000}" min="100" step="100"></div>
                            <div class="editor-field"><label>Lines</label><input type="number" id="los-lines" value="${node.meta.numLines || 36}" min="4" max="180" step="2"></div>
                        </div>
                        <div class="editor-field-row">
                            <div class="editor-field"><label>Antenna height (m)</label><input type="number" id="los-ch" value="${node.meta.centerHeight || 30}" min="0" step="1"></div>
                            <div class="editor-field"><label>Target height (m)</label><input type="number" id="los-th" value="${node.meta.targetHeight || 2}" min="0" step="1"></div>
                        </div>
                        <div class="editor-field"><label>Contour interval (m)</label><input type="number" id="los-contour" value="${node.meta.contourInterval || 500}" min="0" step="50"></div>
                    ` : ''}
                    <div class="editor-section-label">Attributes</div>
                    <table class="props-table">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
                    ${vertAltHTML}
                `;

                const nameInp = editorBody.querySelector('#ed-name');
                const descInp = editorBody.querySelector('#ed-desc');
                if (nameInp) {
                    nameInp.addEventListener('input', () => {
                        if (editorState) editorPanelTitle.childNodes[0].nodeValue = (nameInp.value || 'Untitled') + ' ';
                        scheduleLivePropertiesApply();
                    });
                }
                if (descInp) descInp.addEventListener('input', scheduleLivePropertiesApply);
                const latEl = editorBody.querySelector('#ed-lat');
                const lngEl = editorBody.querySelector('#ed-lng');
                if (latEl) latEl.addEventListener('change', scheduleLivePropertiesApply);
                if (lngEl) lngEl.addEventListener('change', scheduleLivePropertiesApply);
                if (editorState.isLOS) {
                    ['#los-radius', '#los-lines', '#los-ch', '#los-th', '#los-contour'].forEach(sel => {
                        const inp = editorBody.querySelector(sel);
                        if (inp) inp.addEventListener('input', scheduleLivePropertiesApply);
                    });
                }
            }
            async function saveEditorProperties(opts) {
                if (!editorState) return;
                const node = editorState.node;
                const nameEl = editorBody.querySelector('#ed-name');
                const descEl = editorBody.querySelector('#ed-desc');
                if (!nameEl || !descEl) return;
                node.name = nameEl.value.trim() || 'Untitled';
                node.meta.desc = descEl.value.trim();

                const latEl = editorBody.querySelector('#ed-lat');
                const lngEl = editorBody.querySelector('#ed-lng');
                if (latEl && lngEl) {
                    const lat = parseFloat(latEl.value);
                    const lng = parseFloat(lngEl.value);
                    if (isFinite(lat) && isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                        node.meta.lat = lat;
                        node.meta.lng = lng;
                        if (node.type === 'placemark' && node.layer && node.layer.setLatLng) {
                            node.layer.setLatLng([lat, lng]);
                        } else if (node.type === 'los') {
                            rebuildLOSLayer(node);
                        }
                    }
                }
                if (editorState.isLOS) {
                    const radiusEl = editorBody.querySelector('#los-radius');
                    const linesEl = editorBody.querySelector('#los-lines');
                    const chEl = editorBody.querySelector('#los-ch');
                    const thEl = editorBody.querySelector('#los-th');
                    const ciEl = editorBody.querySelector('#los-contour');
                    if (radiusEl) node.meta.radius = parseFloat(radiusEl.value) || 10000;
                    if (linesEl) node.meta.numLines = parseInt(linesEl.value, 10) || 36;
                    if (chEl) node.meta.centerHeight = parseFloat(chEl.value) || 0;
                    if (thEl) node.meta.targetHeight = parseFloat(thEl.value) || 0;
                    if (ciEl) node.meta.contourInterval = parseFloat(ciEl.value) || 0;
                    rebuildLOSLayer(node);
                } else if (node.type === 'placemark' && node.layer && node.layer.getPopup && node.layer.getPopup()) {
                    const d = node.meta.desc ? '<br>' + escapeHtml(node.meta.desc) : '';
                    try { node.layer.setPopupContent(`<b>${escapeHtml(node.name)}</b>${d}`); } catch(e){}
                }
                editorPanelTitle.childNodes[0].nodeValue = node.name + ' ';
                renderTree();
                if (!opts || !opts.silent) {
                    await persistTree();
                    showToast('Saved', 'fa-check');
                } else {
                    clearTimeout(editorState._persistTimer);
                    editorState._persistTimer = setTimeout(() => persistTree(), 500);
                }
            }

            // ============ STYLE ============
            function renderStyleTab() {
                const node = editorState.node;
                const color = node.meta.color || (editorState.isLOS ? '#ea580c' : '#4d7c0f');
                const ringRadius = node.meta.ringRadius || 0;
                const ringThickness = node.meta.ringThickness || 0;
                const lineThickness = node.meta.lineThickness || (editorState.isShape ? 2 : 3);
                const swatches = COLOR_PRESETS.map(c => `<div class="swatch" data-color="${c}" style="background:${c};" title="${c}"></div>`).join('');

                const isMarkerType = editorState.isPlacemark;
                const isLineType = ['path','measure','polygon','measure-area'].includes(node.type);
                const isLOS = editorState.isLOS;
                const isFolder = editorState.isFolder;

                const subTabs = [];
                if (isMarkerType) subTabs.push({ key: 'marker', label: 'Marker', icon: 'fa-map-pin' });
                if (isLineType) subTabs.push({ key: 'path', label: 'Path / Polygon', icon: 'fa-route' });
                if (isLOS) subTabs.push({ key: 'los', label: 'LOS', icon: 'fa-satellite-dish' });
                if (isFolder) subTabs.push({ key: 'folder', label: 'Folder', icon: 'fa-folder' });
                if (subTabs.length === 0) subTabs.push({ key: 'generic', label: 'Colour', icon: 'fa-palette' });
                if (!editorState._styleSubTab || !subTabs.find(t => t.key === editorState._styleSubTab)) {
                    editorState._styleSubTab = subTabs[0].key;
                }
                const tab = editorState._styleSubTab;

                const colorSection = `
                    <div class="editor-section-label">Colour</div>
                    <div class="editor-field">
                        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
                            <input type="color" id="ed-color" value="${color}">
                            <input type="text" id="ed-hex" value="${color}" maxlength="7" style="font-family:'IBM Plex Mono',monospace;">
                        </div>
                        <div class="swatch-grid" id="ed-swatch-grid">${swatches}</div>
                    </div>
                `;
                const iconSection = isMarkerType && tab === 'marker' ? `
                    <div class="editor-section-label">Icon</div>
                    <div class="icon-grid" id="ed-icon-grid" style="max-height:180px;">
                        ${Object.keys(ICON_LIBRARY).map(cat => {
                            let out = `<div class="icon-cat-title">${cat}</div>`;
                            ICON_LIBRARY[cat].forEach(icon => {
                                const sel = icon.fa === (node.meta.icon || DEFAULT_ICON) ? 'selected' : '';
                                out += `<div class="icon-choice ${sel}" data-fa="${icon.fa}" title="${icon.label}"><i class="fas ${icon.fa}"></i></div>`;
                            });
                            return out;
                        }).join('')}
                    </div>
                ` : '';
                const ringSection = isMarkerType && tab === 'marker' ? `
                    <div class="editor-section-label">Ring (bounding circle)</div>
                    <div class="editor-field-row">
                        <div class="editor-field"><label>Radius (px)</label><input type="number" id="ed-ring-radius" value="${ringRadius}" min="0" step="1"></div>
                        <div class="editor-field"><label>Thickness (px)</label><input type="number" id="ed-ring-thickness" value="${ringThickness}" min="0" step="1"></div>
                    </div>
                    <div class="editor-hint">Set radius to 0 to hide the ring.</div>
                ` : '';
                const lineSection = isLineType && tab === 'path' ? `
                    <div class="editor-section-label">Line thickness</div>
                    <div class="editor-value-row">
                        <input type="range" id="ed-line-thickness" value="${lineThickness}" min="1" max="12" step="1">
                        <span class="val" id="ed-line-val">${lineThickness}px</span>
                    </div>
                ` : '';
                const folderSection = isFolder && tab === 'folder' ? buildFolderBulkSectionHTML(node, color, swatches) : '';

                editorBody.innerHTML = `
                    ${subTabs.length > 1 ? `
                        <div class="style-subtabs">
                            ${subTabs.map(t => `<button class="style-subtab ${tab === t.key ? 'active' : ''}" data-stylesub="${t.key}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('')}
                        </div>
                    ` : ''}
                    ${colorSection}
                    ${iconSection}
                    ${ringSection}
                    ${lineSection}
                    ${tab === 'los' ? `<div class="editor-hint">Colour affects radial lines and rings.</div>` : ''}
                    ${folderSection}
                `;

                editorBody.querySelectorAll('[data-stylesub]').forEach(b => {
                    b.addEventListener('click', () => {
                        editorState._styleSubTab = b.dataset.stylesub;
                        renderEditorBody();
                    });
                });

                const colorInp = editorBody.querySelector('#ed-color');
                const hexInp = editorBody.querySelector('#ed-hex');
                const swatchGrid = editorBody.querySelector('#ed-swatch-grid');
                function setColor(c, fromInput) {
                    if (!/^#[0-9a-fA-F]{6}$/.test(c)) return;
                    if (!fromInput) colorInp.value = c;
                    hexInp.value = c.toLowerCase();
                    swatchGrid.querySelectorAll('.swatch').forEach(sw => {
                        sw.style.borderColor = (sw.dataset.color.toLowerCase() === c.toLowerCase()) ? 'var(--ink)' : 'transparent';
                    });
                    const iconGrid = editorBody.querySelector('#ed-icon-grid');
                    if (iconGrid) iconGrid.querySelectorAll('.icon-choice i').forEach(i => { i.style.color = c; });
                    scheduleLiveStyleApply();
                }
                colorInp.addEventListener('input', () => setColor(colorInp.value, true));
                hexInp.addEventListener('input', () => setColor(hexInp.value));
                swatchGrid.querySelectorAll('.swatch').forEach(sw => sw.addEventListener('click', () => setColor(sw.dataset.color)));
                setColor(color);

                const iconGrid = editorBody.querySelector('#ed-icon-grid');
                if (iconGrid) {
                    iconGrid.querySelectorAll('.icon-choice').forEach(el => {
                        el.querySelector('i').style.color = color;
                        el.addEventListener('click', () => {
                            iconGrid.querySelectorAll('.icon-choice').forEach(x => x.classList.remove('selected'));
                            el.classList.add('selected');
                            editorState._newIcon = el.dataset.fa;
                            scheduleLiveStyleApply();
                        });
                    });
                }
                const ringRadiusInp = editorBody.querySelector('#ed-ring-radius');
                const ringThickInp = editorBody.querySelector('#ed-ring-thickness');
                if (ringRadiusInp) {
                    editorState._ringRadius = parseFloat(ringRadiusInp.value) || 0;
                    ringRadiusInp.addEventListener('input', () => {
                        editorState._ringRadius = parseFloat(ringRadiusInp.value) || 0;
                        scheduleLiveStyleApply();
                    });
                }
                if (ringThickInp) {
                    editorState._ringThickness = parseFloat(ringThickInp.value) || 0;
                    ringThickInp.addEventListener('input', () => {
                        editorState._ringThickness = parseFloat(ringThickInp.value) || 0;
                        scheduleLiveStyleApply();
                    });
                }
                const lineRange = editorBody.querySelector('#ed-line-thickness');
                const lineVal = editorBody.querySelector('#ed-line-val');
                if (lineRange) {
                    editorState._lineThickness = parseInt(lineRange.value, 10) || 3;
                    lineRange.addEventListener('input', () => {
                        editorState._lineThickness = parseInt(lineRange.value, 10) || 3;
                        lineVal.textContent = editorState._lineThickness + 'px';
                        scheduleLiveStyleApply();
                    });
                }
                if (isFolder && tab === 'folder') wireFolderBulkPanel(node);
            }

            function buildFolderBulkSectionHTML(node, color, swatches) {
                return `
                    <div class="editor-section-label">Bulk edit contents</div>
                    <div class="bulk-edit-section">
                        <div class="bulk-filter-row">
                            <button class="bulk-filter active" data-filter="all">All</button>
                            <button class="bulk-filter" data-filter="placemark">Markers</button>
                            <button class="bulk-filter" data-filter="line">Lines / polygons</button>
                        </div>
                        <div style="font-size:0.72rem; color:var(--sage); margin-bottom:10px;" id="bulk-count">—</div>
                        <div class="swatch-grid" id="bulk-swatch-grid" style="margin-bottom:10px;">${swatches}</div>
                        <label class="editor-icon-bulk-toggle" id="bulk-icon-toggle-wrap">
                            <input type="checkbox" id="bulk-update-icon">Also update marker icons
                        </label>
                        <div id="bulk-icon-section" style="display:none;">
                            <div class="icon-grid" id="bulk-icon-grid" style="max-height:150px;">
                                ${Object.keys(ICON_LIBRARY).map(cat => {
                                    let out = `<div class="icon-cat-title">${cat}</div>`;
                                    ICON_LIBRARY[cat].forEach(icon => {
                                        out += `<div class="icon-choice" data-fa="${icon.fa}" title="${icon.label}"><i class="fas ${icon.fa}"></i></div>`;
                                    });
                                    return out;
                                }).join('')}
                            </div>
                        </div>
                        <label class="editor-icon-bulk-toggle"><input type="checkbox" id="bulk-update-ring">Apply ring to markers</label>
                        <div id="bulk-ring-section" style="display:none;">
                            <div class="editor-field-row">
                                <div class="editor-field"><label>Ring radius (px)</label><input type="number" id="bulk-ring-radius" value="24" min="0" step="1"></div>
                                <div class="editor-field"><label>Ring thickness (px)</label><input type="number" id="bulk-ring-thickness" value="3" min="0" step="1"></div>
                            </div>
                        </div>
                        <label class="editor-icon-bulk-toggle"><input type="checkbox" id="bulk-update-line">Apply line thickness to lines / polygons</label>
                        <div id="bulk-line-section" style="display:none;">
                            <div class="editor-value-row">
                                <input type="range" id="bulk-line-thickness" value="3" min="1" max="12" step="1">
                                <span class="val" id="bulk-line-val">3px</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" id="bulk-apply" style="width:100%; margin-top:8px;"><i class="fas fa-check"></i> Apply to <span id="bulk-count-inline">0</span> item(s)</button>
                    </div>
                `;
            }
            function wireFolderBulkPanel(node) {
                let bulkFilter = 'all';
                let bulkColor = node.meta.color || '#4d7c0f';
                let bulkIcon = null;
                let bulkRingRadius = 24;
                let bulkRingThickness = 3;
                let bulkLineThickness = 3;
                const countEl = editorBody.querySelector('#bulk-count');
                const countInline = editorBody.querySelector('#bulk-count-inline');
                const updateIconChk = editorBody.querySelector('#bulk-update-icon');
                const iconToggleWrap = editorBody.querySelector('#bulk-icon-toggle-wrap');
                const iconSection = editorBody.querySelector('#bulk-icon-section');
                const updateRingChk = editorBody.querySelector('#bulk-update-ring');
                const ringSection = editorBody.querySelector('#bulk-ring-section');
                const updateLineChk = editorBody.querySelector('#bulk-update-line');
                const lineSection = editorBody.querySelector('#bulk-line-section');
                const bulkIconGrid = editorBody.querySelector('#bulk-icon-grid');
                const bulkRingRadiusInp = editorBody.querySelector('#bulk-ring-radius');
                const bulkRingThicknessInp = editorBody.querySelector('#bulk-ring-thickness');
                const bulkLineRange = editorBody.querySelector('#bulk-line-thickness');
                const bulkLineVal = editorBody.querySelector('#bulk-line-val');

                function updateIconToggleVisibility() {
                    const relevant = (bulkFilter === 'all' || bulkFilter === 'placemark');
                    iconToggleWrap.style.display = relevant ? '' : 'none';
                    if (!relevant) { updateIconChk.checked = false; iconSection.style.display = 'none'; }
                }
                function countChildren() {
                    let n = 0;
                    (function walk(node) {
                        if (node.children) node.children.forEach(c => {
                            if (bulkFilter === 'all') n++;
                            else if (bulkFilter === 'placemark' && c.type === 'placemark') n++;
                            else if (bulkFilter === 'line' && ['path','polygon','measure','measure-area'].includes(c.type)) n++;
                            walk(c);
                        });
                    })(editorState.node);
                    return n;
                }
                function refreshCount() {
                    const c = countChildren();
                    countEl.textContent = `${c} item(s) will be updated`;
                    countInline.textContent = c;
                }
                editorBody.querySelectorAll('.bulk-filter').forEach(btn => {
                    btn.addEventListener('click', () => {
                        editorBody.querySelectorAll('.bulk-filter').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        bulkFilter = btn.dataset.filter;
                        updateIconToggleVisibility();
                        refreshCount();
                    });
                });
                editorBody.querySelector('#bulk-swatch-grid').querySelectorAll('.swatch').forEach(sw => {
                    sw.addEventListener('click', () => {
                        bulkColor = sw.dataset.color;
                        const colorInp = editorBody.querySelector('#ed-color');
                        const hexInp = editorBody.querySelector('#ed-hex');
                        if (colorInp) colorInp.value = bulkColor;
                        if (hexInp) hexInp.value = bulkColor;
                    });
                });
                updateIconChk.addEventListener('change', () => { iconSection.style.display = updateIconChk.checked ? '' : 'none'; });
                updateRingChk.addEventListener('change', () => { ringSection.style.display = updateRingChk.checked ? '' : 'none'; });
                updateLineChk.addEventListener('change', () => { lineSection.style.display = updateLineChk.checked ? '' : 'none'; });
                if (bulkIconGrid) {
                    bulkIconGrid.querySelectorAll('.icon-choice').forEach(el => {
                        el.querySelector('i').style.color = bulkColor;
                        el.addEventListener('click', () => {
                            bulkIconGrid.querySelectorAll('.icon-choice').forEach(x => x.classList.remove('selected'));
                            el.classList.add('selected');
                            bulkIcon = el.dataset.fa;
                        });
                    });
                }
                if (bulkRingRadiusInp) bulkRingRadiusInp.addEventListener('input', () => { bulkRingRadius = parseFloat(bulkRingRadiusInp.value) || 0; });
                if (bulkRingThicknessInp) bulkRingThicknessInp.addEventListener('input', () => { bulkRingThickness = parseFloat(bulkRingThicknessInp.value) || 0; });
                if (bulkLineRange) bulkLineRange.addEventListener('input', () => {
                    bulkLineThickness = parseInt(bulkLineRange.value, 10) || 3;
                    bulkLineVal.textContent = bulkLineThickness + 'px';
                });
                editorBody.querySelector('#bulk-apply').addEventListener('click', async () => {
                    const newColor = bulkColor;
                    const updateIcons = updateIconChk.checked && bulkIcon && (bulkFilter === 'all' || bulkFilter === 'placemark');
                    const applyRing = updateRingChk.checked && (bulkFilter === 'all' || bulkFilter === 'placemark');
                    const applyLine = updateLineChk.checked && (bulkFilter === 'all' || bulkFilter === 'line');
                    let count = 0;
                    (function walk(node) {
                        if (node.children) node.children.forEach(c => {
                            if (bulkFilter === 'all' || (bulkFilter === 'placemark' && c.type === 'placemark') || (bulkFilter === 'line' && ['path','polygon','measure','measure-area'].includes(c.type))) {
                                c.meta.color = newColor;
                                if (c.type === 'placemark') {
                                    if (updateIcons) c.meta.icon = bulkIcon;
                                    if (applyRing) { c.meta.ringRadius = bulkRingRadius; c.meta.ringThickness = bulkRingThickness; }
                                    if (c.layer && c.layer.setIcon) c.layer.setIcon(makeIconFromNode(c));
                                } else if (c.type === 'los') {
                                    rebuildLOSLayer(c);
                                } else if (['path','measure','polygon','measure-area'].includes(c.type)) {
                                    if (applyLine) c.meta.lineThickness = bulkLineThickness;
                                    if (c.layer && c.layer.setStyle) c.layer.setStyle({ color: newColor, weight: c.meta.lineThickness || 3 });
                                }
                                count++;
                            }
                            walk(c);
                        });
                    })(editorState.node);
                    renderTree();
                    await persistTree();
                    showToast(`Updated ${count} item(s)`, 'fa-check');
                });
                updateIconToggleVisibility();
                refreshCount();
            }

            async function saveEditorStyle(opts) {
                if (!editorState || !editorState.node) return;
                const node = editorState.node;
                const hexEl = editorBody.querySelector('#ed-hex');
                const colorEl = editorBody.querySelector('#ed-color');
                const color = (hexEl && hexEl.value) || (colorEl && colorEl.value) || node.meta.color || '#4d7c0f';
                node.meta.color = color;
                if (node.type === 'placemark') {
                    if (editorState._newIcon) node.meta.icon = editorState._newIcon;
                    if (typeof editorState._ringRadius === 'number') node.meta.ringRadius = editorState._ringRadius;
                    if (typeof editorState._ringThickness === 'number') node.meta.ringThickness = editorState._ringThickness;
                    if (node.layer && node.layer.setIcon) node.layer.setIcon(makeIconFromNode(node));
                } else if (node.type === 'los') {
                    rebuildLOSLayer(node);
                } else if (['path','measure','polygon','measure-area'].includes(node.type)) {
                    if (typeof editorState._lineThickness === 'number') node.meta.lineThickness = editorState._lineThickness;
                    if (node.layer && node.layer.setStyle) node.layer.setStyle({ color, weight: node.meta.lineThickness || 3 });
                }
                if (!opts || !opts.silent) {
                    editorState._newIcon = null;
                    editorState._ringRadius = undefined;
                    editorState._ringThickness = undefined;
                    editorState._lineThickness = undefined;
                    renderTree();
                    await persistTree();
                    showToast('Style saved', 'fa-check');
                } else {
                    renderTree();
                    clearTimeout(editorState._persistTimer);
                    editorState._persistTimer = setTimeout(() => persistTree(), 400);
                }
            }

            // ============ VERTICES ============
            function renderVerticesTab() {
                const node = editorState.node;
                const isPolygon = (node.type === 'polygon' || node.type === 'measure-area');
                const minVerts = isPolygon ? 3 : 2;
                const color = node.meta.color || '#4d7c0f';
                const thickness = node.meta.lineThickness || 2;
                let work = node.meta.points.map(p => ({ lat: p[0], lng: p[1] }));

                if (node.layer) {
                    if (map.hasLayer(node.layer)) map.removeLayer(node.layer);
                    if (drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                }
                const editorGroup = L.featureGroup().addTo(map);
                let previewShape = null;
                let vertexMarkers = [];
                let midpointMarkers = [];
                let pending = null;
                let pendingTempLine = null;

                function removePending() {
                    if (pending && pending.marker) { try { editorGroup.removeLayer(pending.marker); } catch(e){} }
                    if (pendingTempLine) { try { editorGroup.removeLayer(pendingTempLine); } catch(e){} }
                    pending = null;
                    pendingTempLine = null;
                }
                function renderPreview() {
                    if (previewShape) { try { editorGroup.removeLayer(previewShape); } catch(e){} }
                    const latlngs = work.map(v => [v.lat, v.lng]);
                    if (isPolygon && latlngs.length >= 3) {
                        previewShape = L.polygon(latlngs, { color, weight: thickness, fillOpacity: 0.18, dashArray: '4,3', interactive: true });
                    } else if (latlngs.length >= 2) {
                        previewShape = L.polyline(latlngs, { color, weight: thickness, dashArray: '4,3', interactive: true });
                    } else {
                        previewShape = null;
                    }
                    if (previewShape) {
                        editorGroup.addLayer(previewShape);
                        previewShape.on('click', onPreviewClick);
                    }
                }
                function onPreviewClick(e) {
                    L.DomEvent.stopPropagation(e);
                    const clickLL = e.latlng;
                    let bestIdx = 1, bestDist = Infinity;
                    for (let i = 0; i < work.length - 1; i++) {
                        const a = L.latLng(work[i].lat, work[i].lng);
                        const b = L.latLng(work[i + 1].lat, work[i + 1].lng);
                        const mid = L.latLng((a.lat + b.lat) / 2, (a.lng + b.lng) / 2);
                        const d = clickLL.distanceTo(mid);
                        if (d < bestDist) { bestDist = d; bestIdx = i + 1; }
                    }
                    removePending();
                    const pendingMarker = L.marker(clickLL, {
                        icon: L.divIcon({
                            className: '',
                            html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.35);cursor:crosshair;"></div>`,
                            iconSize: [16, 16], iconAnchor: [8, 8]
                        }),
                        draggable: true, zIndexOffset: 1500
                    });
                    editorGroup.addLayer(pendingMarker);
                    pending = { lat: clickLL.lat, lng: clickLL.lng, marker: pendingMarker, insertIndex: bestIdx };

                    const onMove = (ev) => {
                        if (!pending) return;
                        pending.lat = ev.latlng.lat;
                        pending.lng = ev.latlng.lng;
                        pending.marker.setLatLng([pending.lat, pending.lng]);
                        redrawPendingTempLine();
                    };
                    const onMapClick = (ev) => {
                        if (!pending) return;
                        L.DomEvent.stopPropagation(ev);
                        work.splice(pending.insertIndex, 0, { lat: pending.lat, lng: pending.lng });
                        map.off('mousemove', onMove);
                        map.off('click', onMapClick);
                        removePending();
                        renderRows();
                        renderMarkers();
                        renderPreview();
                        renderMidpoints();
                        commitVertices({ keepHidden: true });
                    };
                    map.on('mousemove', onMove);
                    map.once('click', onMapClick);
                    pendingMarker.on('drag', (ev) => {
                        const ll = ev.target.getLatLng();
                        pending.lat = ll.lat;
                        pending.lng = ll.lng;
                        redrawPendingTempLine();
                    });
                    pendingMarker.on('dragend', (ev) => {
                        const ll = ev.target.getLatLng();
                        pending.lat = ll.lat;
                        pending.lng = ll.lng;
                        redrawPendingTempLine();
                    });
                    redrawPendingTempLine();
                    showToast('Move to place the new vertex, then click to drop it', 'fa-mouse-pointer');
                }
                function redrawPendingTempLine() {
                    if (pendingTempLine) { try { editorGroup.removeLayer(pendingTempLine); } catch(e){} pendingTempLine = null; }
                    if (!pending) return;
                    const latlngs = work.map(v => [v.lat, v.lng]);
                    latlngs.splice(pending.insertIndex, 0, [pending.lat, pending.lng]);
                    const tmp = L.polyline(latlngs, { color, weight: thickness, opacity: 0.65, dashArray: '6,6', interactive: false });
                    editorGroup.addLayer(tmp);
                    pendingTempLine = tmp;
                }
                function renderMidpoints() {
                    midpointMarkers.forEach(m => { try { editorGroup.removeLayer(m); } catch(e){} });
                    midpointMarkers = [];
                    if (work.length < 2) return;
                    for (let i = 0; i < work.length - 1; i++) {
                        const a = work[i], b = work[i + 1];
                        const midLat = (a.lat + b.lat) / 2;
                        const midLng = (a.lng + b.lng) / 2;
                        const insertIndex = i + 1;
                        const midMarker = L.marker([midLat, midLng], {
                            icon: L.divIcon({
                                className: '',
                                html: `<div style="width:10px;height:10px;border-radius:50%;background:rgba(77,124,15,0.4);border:1.5px solid ${color};cursor:grab;"></div>`,
                                iconSize: [10, 10], iconAnchor: [5, 5]
                            }),
                            draggable: true, zIndexOffset: 900
                        });
                        midMarker.on('dragstart', () => {
                            work.splice(insertIndex, 0, { lat: midLat, lng: midLng });
                            renderRows();
                            renderMarkers();
                            renderPreview();
                        });
                        midMarker.on('drag', (ev) => {
                            const ll = ev.target.getLatLng();
                            if (work[insertIndex]) {
                                work[insertIndex].lat = ll.lat;
                                work[insertIndex].lng = ll.lng;
                                renderPreview();
                                updateMidpointsOnly();
                                updateRowInputs(insertIndex);
                            }
                        });
                        midMarker.on('dragend', async () => {
                            renderMidpoints();
                            await commitVertices({ keepHidden: true });
                        });
                        editorGroup.addLayer(midMarker);
                        midpointMarkers.push(midMarker);
                    }
                }
                function updateMidpointsOnly() {
                    let idx = 0;
                    for (let i = 0; i < work.length - 1; i++) {
                        const m = midpointMarkers[idx];
                        if (!m) break;
                        const a = work[i], b = work[i + 1];
                        m.setLatLng([(a.lat + b.lat) / 2, (a.lng + b.lng) / 2]);
                        idx++;
                    }
                    if (pendingTempLine) redrawPendingTempLine();
                }
                function renderMarkers() {
                    vertexMarkers.forEach(m => { try { editorGroup.removeLayer(m); } catch(e){} });
                    vertexMarkers = [];
                    work.forEach((v, i) => {
                        const marker = L.marker([v.lat, v.lng], {
                            icon: L.divIcon({
                                className: '',
                                html: `<div style="width:18px;height:18px;border-radius:50%;background:#fff;border:2.5px solid ${color};display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;color:${color};box-shadow:0 1px 4px rgba(0,0,0,0.3);">${i+1}</div>`,
                                iconSize: [18, 18], iconAnchor: [9, 9]
                            }),
                            draggable: true, zIndexOffset: 1000
                        });
                        marker.on('drag', (ev) => {
                            const ll = ev.target.getLatLng();
                            const cp = map.latLngToContainerPoint(ll);
                            updateSnapPreview(cp);
                            if (SETTINGS.snapToMarkers) {
                                const snap = findSnapTargetPixel(cp, new Set([node.id]));
                                if (snap) ev.target.setLatLng(snap.latlng);
                            }
                            const finalLL = ev.target.getLatLng();
                            work[i].lat = finalLL.lat;
                            work[i].lng = finalLL.lng;
                            renderPreview();
                            updateMidpointsOnly();
                            updateRowInputs(i);
                        });
                        marker.on('dragstart', () => {
                            if (!snapZoneActive && SETTINGS.snapToMarkers) setSnapZoneActive(true);
                        });
                        marker.on('dragend', async (ev) => {
                            hideSnapPreview();
                            const ll = ev.target.getLatLng();
                            const cp = map.latLngToContainerPoint(ll);
                            const snap = findSnapTargetPixel(cp, new Set([node.id]));
                            if (snap) {
                                work[i].lat = snap.latlng.lat;
                                work[i].lng = snap.latlng.lng;
                                ev.target.setLatLng(snap.latlng);
                                renderPreview();
                                updateMidpointsOnly();
                                updateRowInputs(i);
                                showToast(`Snapped to "${snap.node.name}"`, 'fa-magnet');
                            }
                            await commitVertices({ keepHidden: true });
                        });
                        marker.on('click', () => highlightRow(i));
                        editorGroup.addLayer(marker);
                        vertexMarkers.push(marker);
                    });
                    renderPreview();
                }
                function fitView() {
                    if (work.length === 0) return;
                    const ll = work.map(v => [v.lat, v.lng]);
                    const pad = availableMapPadding();
                    if (ll.length === 1) map.setView(ll[0], 14);
                    else map.fitBounds(L.latLngBounds(ll), { ...pad, maxZoom: 17 });
                }
                async function commitVertices(options) {
                    const keepHidden = options && options.keepHidden;
                    if (work.length < minVerts) return;
                    node.meta.points = work.map(v => [v.lat, v.lng]);
                    if (node.type === 'path' || node.type === 'measure') {
                        node.meta.distance = pathDistance(work.map(v => L.latLng(v.lat, v.lng)));
                    } else if (node.type === 'polygon' || node.type === 'measure-area') {
                        node.meta.area = polygonArea(work.map(v => L.latLng(v.lat, v.lng)));
                    }
                    const wasVisible = node.visible !== false;
                    if (node.layer) {
                        if (map.hasLayer(node.layer)) map.removeLayer(node.layer);
                        if (drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                    }
                    let newLayer;
                    if (node.type === 'path' || node.type === 'measure') {
                        newLayer = L.polyline(node.meta.points, { color: node.meta.color || '#4d7c0f', weight: node.meta.lineThickness || 3 });
                    } else {
                        newLayer = L.polygon(node.meta.points, { color: node.meta.color || '#4d7c0f', weight: node.meta.lineThickness || 2, fillOpacity: 0.2 });
                    }
                    node.layer = newLayer;
                    bindLayerFocus(node, newLayer);
                    if (!keepHidden && wasVisible) newLayer.addTo(drawnItems);
                    if (drawnItems.bringToFront) drawnItems.bringToFront();
                    renderTree();
                    await persistTree();
                }

                editorBody.innerHTML = `
                    <div class="editor-section-label">
                        Vertices <span id="ed-vert-count" style="color:var(--sage);">${work.length}</span>
                        <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);">min ${minVerts}</span>
                    </div>
                    <div class="editor-vertex-list" id="ed-vert-list"></div>
                    <div style="display:flex;gap:8px;margin-top:12px;">
                        <button class="btn btn-secondary" id="ed-vert-add" style="flex:1;"><i class="fas fa-plus"></i> Add at end</button>
                    </div>
                    <div class="editor-hint">
                        <div style="margin-bottom:4px;"><b>Click</b> on the line to start a new vertex — it follows the cursor, click again to drop it.</div>
                        <div><b>Drag</b> the small midpoint dots to insert a vertex between two existing ones. They follow their segment live.</div>
                        <div style="margin-top:4px;">Drag a numbered vertex to move it — midpoints update as you drag.</div>
                    </div>
                `;
                const listEl = editorBody.querySelector('#ed-vert-list');
                const countEl = editorBody.querySelector('#ed-vert-count');

                function renderRows() {
                    listEl.innerHTML = '';
                    work.forEach((v, i) => {
                        const row = document.createElement('div');
                        row.className = 've-row';
                        row.dataset.idx = i;
                        row.style.cssText = 'display:grid;grid-template-columns:26px 1fr 1fr 28px;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border);';
                        row.innerHTML = `
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:0.62rem;color:${color};font-weight:700;text-align:center;">${i+1}</div>
                            <input type="text" class="ve-lat" data-idx="${i}" value="${v.lat.toFixed(6)}" style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:4px 6px;border:1px solid var(--border);border-radius:5px;background:var(--paper-soft);color:var(--ink);outline:none;min-width:0;">
                            <input type="text" class="ve-lng" data-idx="${i}" value="${v.lng.toFixed(6)}" style="font-family:'IBM Plex Mono',monospace;font-size:0.7rem;padding:4px 6px;border:1px solid var(--border);border-radius:5px;background:var(--paper-soft);color:var(--ink);outline:none;min-width:0;">
                            <button class="ve-del" data-idx="${i}" title="Delete vertex" style="width:26px;height:26px;border-radius:5px;background:transparent;border:1px solid transparent;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.7rem;"><i class="fas fa-trash"></i></button>
                        `;
                        row.addEventListener('mouseenter', () => { row.style.background = 'var(--paper-soft)'; });
                        row.addEventListener('mouseleave', () => { row.style.background = ''; });
                        row.addEventListener('click', (e) => {
                            if (e.target.closest('input') || e.target.closest('button')) return;
                            highlightRow(i);
                            map.panTo([work[i].lat, work[i].lng]);
                        });
                        listEl.appendChild(row);
                    });
                    listEl.querySelectorAll('.ve-lat').forEach(inp => {
                        inp.addEventListener('change', async () => {
                            const i = parseInt(inp.dataset.idx, 10);
                            const val = parseFloat(inp.value);
                            if (isNaN(val) || val < -90 || val > 90) { inp.value = work[i].lat.toFixed(6); return; }
                            work[i].lat = val;
                            if (vertexMarkers[i]) vertexMarkers[i].setLatLng([work[i].lat, work[i].lng]);
                            renderPreview();
                            updateMidpointsOnly();
                            await commitVertices({ keepHidden: true });
                        });
                    });
                    listEl.querySelectorAll('.ve-lng').forEach(inp => {
                        inp.addEventListener('change', async () => {
                            const i = parseInt(inp.dataset.idx, 10);
                            const val = parseFloat(inp.value);
                            if (isNaN(val) || val < -180 || val > 180) { inp.value = work[i].lng.toFixed(6); return; }
                            work[i].lng = val;
                            if (vertexMarkers[i]) vertexMarkers[i].setLatLng([work[i].lat, work[i].lng]);
                            renderPreview();
                            updateMidpointsOnly();
                            await commitVertices({ keepHidden: true });
                        });
                    });
                    listEl.querySelectorAll('.ve-del').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            const i = parseInt(btn.dataset.idx, 10);
                            if (work.length <= minVerts) { showToast(`Needs at least ${minVerts} vertices`, 'fa-exclamation-circle'); return; }
                            work.splice(i, 1);
                            renderRows();
                            renderMarkers();
                            renderMidpoints();
                            await commitVertices({ keepHidden: true });
                        });
                    });
                    updateCount();
                }
                function updateCount() { countEl.textContent = work.length; }
                function updateRowInputs(i) {
                    const latInp = listEl.querySelector(`.ve-lat[data-idx="${i}"]`);
                    const lngInp = listEl.querySelector(`.ve-lng[data-idx="${i}"]`);
                    if (latInp) latInp.value = work[i].lat.toFixed(6);
                    if (lngInp) lngInp.value = work[i].lng.toFixed(6);
                }
                function highlightRow(i) {
                    listEl.querySelectorAll('.ve-row').forEach(r => {
                        r.style.background = (parseInt(r.dataset.idx, 10) === i) ? 'var(--sage-soft)' : '';
                    });
                }
                editorBody.querySelector('#ed-vert-add').addEventListener('click', async () => {
                    let lat, lng;
                    if (work.length > 0) {
                        const last = work[work.length - 1];
                        lat = last.lat + 0.001;
                        lng = last.lng + 0.001;
                    } else {
                        const c = map.getCenter();
                        lat = c.lat; lng = c.lng;
                    }
                    work.push({ lat, lng });
                    renderRows();
                    renderMarkers();
                    renderMidpoints();
                    map.panTo([lat, lng]);
                    await commitVertices({ keepHidden: true });
                });

                const prevTeardown = editorState.teardown;
                editorState.teardown = () => {
                    if (prevTeardown) prevTeardown();
                    removePending();
                    if (work.length >= minVerts) {
                        node.meta.points = work.map(v => [v.lat, v.lng]);
                        if (node.type === 'path' || node.type === 'measure') {
                            node.meta.distance = pathDistance(work.map(v => L.latLng(v.lat, v.lng)));
                        } else {
                            node.meta.area = polygonArea(work.map(v => L.latLng(v.lat, v.lng)));
                        }
                        if (node.layer) {
                            if (map.hasLayer(node.layer)) map.removeLayer(node.layer);
                            if (drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                        }
                        let newLayer;
                        if (node.type === 'path' || node.type === 'measure') {
                            newLayer = L.polyline(node.meta.points, { color: node.meta.color || '#4d7c0f', weight: node.meta.lineThickness || 3 });
                        } else {
                            newLayer = L.polygon(node.meta.points, { color: node.meta.color || '#4d7c0f', weight: node.meta.lineThickness || 2, fillOpacity: 0.2 });
                        }
                        node.layer = newLayer;
                        bindLayerFocus(node, newLayer);
                        if (node.visible !== false) newLayer.addTo(drawnItems);
                        if (drawnItems.bringToFront) drawnItems.bringToFront();
                    }
                    try { map.removeLayer(editorGroup); } catch(e){}
                    hideSnapPreview();
                    renderTree();
                    persistTree();
                };

                renderRows();
                renderMarkers();
                renderMidpoints();
                fitView();
                setSnapZoneActive(SETTINGS.snapToMarkers);
            }

            function rebuildLOSLayer(node) {
                const wasVisible = node.visible !== false;
                if (node.layer) {
                    try { node.layer.eachLayer(l => { if (map.hasLayer(l)) map.removeLayer(l); }); } catch(e){}
                    if (map.hasLayer(node.layer)) map.removeLayer(node.layer);
                    if (drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                    node.layer.clearLayers();
                }
                const layers = buildLOSLayers(node);
                node.layer = L.layerGroup(layers);
                if (wasVisible) node.layer.addTo(drawnItems);
                if (drawnItems.bringToFront) drawnItems.bringToFront();
            }

            // ==================== NEW NODE MODAL ====================
            function openNewNodeModal(node) {
                return new Promise(resolve => {
                    const modal = document.getElementById('modal-overlay');
                    const title = document.getElementById('modal-title');
                    const body = document.getElementById('modal-body');
                    const actions = document.getElementById('modal-actions');
                    title.innerHTML = `<i class="fas ${TYPE_ICONS[node.type] || 'fa-pen'}"></i> New ${node.type}`;
                    body.innerHTML = `
                        <label>Name</label><input type="text" id="nn-name" value="${escapeHtml(node.name)}" placeholder="Enter name…">
                        <label>Description</label><textarea id="nn-desc" rows="3" placeholder="Optional description…">${escapeHtml(node.meta.desc || '')}</textarea>
                    `;
                    actions.innerHTML = `
                        <button class="btn btn-secondary" id="nn-cancel">Cancel</button>
                        <button class="btn btn-primary" id="nn-ok">Create</button>
                    `;
                    body.querySelector('#nn-name').focus();
                    body.querySelector('#nn-name').select();
                    const cleanup = () => {
                        modal.classList.remove('open');
                        body.innerHTML = '';
                        actions.innerHTML = `<button class="btn btn-secondary" id="modal-cancel">Cancel</button><button class="btn btn-primary" id="modal-ok">Save</button>`;
                    };
                    const finish = () => {
                        const name = body.querySelector('#nn-name').value.trim() || 'Untitled';
                        const desc = body.querySelector('#nn-desc').value.trim();
                        cleanup();
                        resolve({ name, desc, color: node.meta.color || '#4d7c0f', icon: DEFAULT_ICON });
                    };
                    document.getElementById('nn-ok').addEventListener('click', finish);
                    document.getElementById('nn-cancel').addEventListener('click', () => { cleanup(); resolve(null); });
                    modal.classList.add('open');
                    const onKey = (e) => {
                        if (e.key === 'Escape') { document.removeEventListener('keydown', onKey); cleanup(); resolve(null); }
                        else if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { document.removeEventListener('keydown', onKey); finish(); }
                    };
                    document.addEventListener('keydown', onKey);
                });
            }

            // ==================== IMPORT SCREEN ====================
            function openImportScreen(targetFolderId) {
                const fsOverlay = document.getElementById('fs-modal-overlay');
                const fsContent = document.getElementById('fs-modal-content');
                let currentType = 'points';

                const typeOptions = [
                    { key: 'points', icon: 'fa-map-pin', label: 'Points', desc: 'One marker per row' },
                    { key: 'path', icon: 'fa-route', label: 'Path', desc: 'One vertex per row' },
                    { key: 'kml', icon: 'fa-file-code', label: 'KML / KMZ', desc: 'Points, lines, polygons' }
                ];
                const formatHints = {
                    points: {
                        columns: 'lat, lng, [name], [description]',
                        note: 'One row per placemark. A header row is required. Latitude and Longitude columns are mandatory.'
                    },
                    path: {
                        columns: 'lat, lng, [name], [description]',
                        note: 'One row per vertex. Rows sharing the same Name are grouped into a single path (in row order). The description is taken from the first row of each name group. Include a header row.'
                    },
                    kml: null
                };

                function render() {
                    const isKML = currentType === 'kml';
                    const isPath = currentType === 'path';
                    const hint = formatHints[currentType];

                    const pastePlaceholder = isPath
                        ? 'Paste cells from Excel — one row per vertex, ordered. Include a header row. Lat/Lon required; a Name column groups rows into separate paths (optional).'
                        : 'Paste cells from Excel (Ctrl+V / Cmd+V) — include header row.';

                    const mappingHTML = `
                        <div class="sheet-panel" id="sheet-mapping-panel" style="display:none;">
                            <div class="sheet-panel-title">02 — Map columns</div>
                            <div class="sheet-mapping-row">
                                <div><label>Latitude</label><select id="sheet-lat"></select></div>
                                <div><label>Longitude</label><select id="sheet-lon"></select></div>
                            </div>
                            <div class="sheet-mapping-row">
                                <div><label>Name</label><select id="sheet-name"></select></div>
                                <div><label>Description</label><select id="sheet-desc"></select></div>
                            </div>
                            <div style="font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ink-3);margin-top:4px;" id="sheet-count"></div>
                        </div>
                    `;

                    const commitLabel = isPath ? 'Import as path' : 'Import as placemarks';

                    fsContent.innerHTML = `
                        <div class="sheet-layout">
                            <div class="sheet-header">
                                <h2>Import</h2>
                                <button class="detail-close" id="import-close"><i class="fas fa-times"></i></button>
                            </div>
                            <div class="import-type-bar">
                                ${typeOptions.map(t => `
                                    <div class="import-type-opt ${currentType === t.key ? 'active' : ''}" data-type="${t.key}">
                                        <i class="fas ${t.icon}"></i>
                                        <div class="import-type-opt-label">${t.label}</div>
                                        <div class="import-type-opt-desc">${t.desc}</div>
                                    </div>
                                `).join('')}
                            </div>
                            ${hint ? `
                                <div class="import-format-hint">
                                    <div class="import-format-hint-title">Expected data format</div>
                                    <pre class="import-format-hint-columns">${hint.columns}</pre>
                                    <div class="import-format-hint-note">${hint.note}</div>
                                </div>
                            ` : ''}
                            ${isKML ? `
                                <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">
                                    <div style="text-align:center;">
                                        <div style="font-size:3rem;color:var(--sage);margin-bottom:20px;"><i class="fas fa-file-code"></i></div>
                                        <div style="font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;color:var(--ink);margin-bottom:8px;">Choose a KML or KMZ file</div>
                                        <div style="font-size:0.78rem;color:var(--ink-3);margin-bottom:20px;">Points, lines and polygons from the file will be imported.</div>
                                        <button class="btn btn-primary" id="import-kml-pick"><i class="fas fa-folder-open"></i> Select file…</button>
                                    </div>
                                </div>
                            ` : `
                                <div class="sheet-body">
                                    <div class="sheet-col">
                                        <div class="sheet-panel">
                                            <div class="sheet-panel-title">01 — Paste data</div>
                                            <textarea class="sheet-paste" id="sheet-paste" placeholder="${pastePlaceholder}"></textarea>
                                        </div>
                                        ${mappingHTML}
                                    </div>
                                    <div class="sheet-col">
                                        <div class="sheet-panel" style="flex:1;">
                                            <div class="sheet-panel-title">03 — Preview</div>
                                            <div class="sheet-preview" id="sheet-preview">
                                                <div style="padding:20px;text-align:center;color:var(--ink-3);font-size:0.78rem;">Paste data on the left</div>
                                            </div>
                                            <div style="display:flex;gap:8px;margin-top:14px;">
                                                <button class="btn btn-secondary" id="sheet-cancel" style="flex:1;">Cancel</button>
                                                <button class="btn btn-primary" id="sheet-commit" style="flex:2;" disabled>
                                                    <i class="fas fa-upload"></i> ${commitLabel}
                                                </button>
                                            </div>

                                    </div>
