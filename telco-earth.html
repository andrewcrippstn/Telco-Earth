                            `}
                        </div>
                    `;

                    fsContent.querySelector('#import-close').addEventListener('click', closeImport);
                    fsContent.querySelectorAll('.import-type-opt').forEach(el => {
                        el.addEventListener('click', () => {
                            currentType = el.dataset.type;
                            render();
                        });
                    });
                    if (isKML) {
                        fsContent.querySelector('#import-kml-pick').addEventListener('click', () => {
                            closeImport();
                            setTimeout(() => kmlInput.click(), 80);
                        });
                    } else {
                        initSpreadsheetUI(currentType, targetFolderId);
                    }
                }

                function closeImport() {
                    fsOverlay.classList.remove('open');
                    fsContent.innerHTML = '';
                    updateMapToolsVisibility();
                }

                fsOverlay.classList.add('open');
                updateMapToolsVisibility();
                render();
            }

            function initSpreadsheetUI(importType, targetFolderId) {
                const isPath = importType === 'path';
                const fsContent = document.getElementById('fs-modal-content');
                const pasteEl = fsContent.querySelector('#sheet-paste');
                const mappingPanel = fsContent.querySelector('#sheet-mapping-panel');
                const previewEl = fsContent.querySelector('#sheet-preview');
                const countEl = fsContent.querySelector('#sheet-count');
                const commitBtn = fsContent.querySelector('#sheet-commit');

                let headers = [];
                let rows = [];
                let mapping = { lat: 0, lon: 1, name: -1, desc: -1 };

                function parseDelimited(text, delim) {
                    const out = []; let row = [], cur = '', inQ = false;
                    for (let i = 0; i < text.length; i++) {
                        const ch = text[i];
                        if (inQ) {
                            if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
                            else cur += ch;
                        } else if (ch === '"' && cur === '') inQ = true;
                        else if (ch === delim) { row.push(cur.trim()); cur = ''; }
                        else if (ch === '\n' || ch === '\r') {
                            if (ch === '\r' && text[i+1] === '\n') i++;
                            row.push(cur.trim()); out.push(row); row = []; cur = '';
                        } else cur += ch;
                    }
                    row.push(cur.trim()); out.push(row);
                    return out.filter(r => r.some(c => c !== ''));
                }
                function findCol(keywords, exclude = []) {
                    for (const kw of keywords) {
                        const idx = headers.findIndex((h, i) => !exclude.includes(i) && h.toLowerCase().includes(kw));
                        if (idx !== -1) return idx;
                    }
                    return -1;
                }
                function buildSelectors() {
                    const sample = i => { const r = rows.find(r => (r[i] || '') !== ''); return r ? ' — ' + r[i].substring(0, 20) : ''; };
                    const options = (selected, withNone) =>
                        (withNone ? `<option value="-1" ${selected < 0 ? 'selected' : ''}>— None —</option>` : '') +
                        headers.map((h, i) => `<option value="${i}" ${i === selected ? 'selected' : ''}>${escapeHtml(h || 'Col ' + (i+1))}${escapeHtml(sample(i))}</option>`).join('');
                    fsContent.querySelector('#sheet-lat').innerHTML = options(mapping.lat, false);
                    fsContent.querySelector('#sheet-lon').innerHTML = options(mapping.lon, false);
                    fsContent.querySelector('#sheet-name').innerHTML = options(mapping.name, true);
                    fsContent.querySelector('#sheet-desc').innerHTML = options(mapping.desc, true);
                }
                function updatePreview() {
                    if (!headers.length) return;
                    previewEl.innerHTML = `<table>
                        <thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
                        <tbody>${rows.slice(0, 50).map(r => `<tr>${headers.map((_, i) => `<td title="${escapeHtml(r[i]||'')}">${escapeHtml(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody>
                    </table>`;
                    countEl.textContent = `${rows.length} data row(s)`;
                }
                function processPaste() {
                    const text = pasteEl.value.replace(/^\uFEFF/, '').trim();
                    if (!text) {
                        mappingPanel.style.display = 'none';
                        commitBtn.disabled = true;
                        previewEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--ink-3);font-size:0.78rem;">Paste data on the left</div>';
                        return;
                    }
                    const firstLine = text.split(/\r?\n/)[0];
                    const delim = firstLine.includes('\t') ? '\t' : ',';
                    const all = parseDelimited(text, delim);
                    if (all.length < 2) return;
                    headers = all[0];
                    rows = all.slice(1);

                    let lat = findCol(['latitude', 'lat']);
                    let lon = findCol(['longitude', 'long', 'lng', 'lon'], [lat]);
                    if (lat < 0) lat = 0;
                    if (lon < 0) lon = Math.min(1, headers.length - 1);
                    let name = findCol(['name', 'tag', 'title', 'label'], [lat, lon]);
                    if (name < 0) for (let i = 0; i < headers.length; i++) if (i !== lat && i !== lon) { name = i; break; }
                    let desc = findCol(['desc', 'detail', 'note', 'comment'], [lat, lon, name]);
                    if (desc < 0) for (let i = 0; i < headers.length; i++) if (i !== lat && i !== lon && i !== name) { desc = i; break; }
                    mapping = { lat, lon, name, desc };

                    mappingPanel.style.display = 'block';
                    buildSelectors();
                    updatePreview();
                    commitBtn.disabled = false;
                }

                fsContent.querySelector('#sheet-lat').addEventListener('change', (e) => { mapping.lat = parseInt(e.target.value, 10); });
                fsContent.querySelector('#sheet-lon').addEventListener('change', (e) => { mapping.lon = parseInt(e.target.value, 10); });
                fsContent.querySelector('#sheet-name').addEventListener('change', (e) => { mapping.name = parseInt(e.target.value, 10); });
                fsContent.querySelector('#sheet-desc').addEventListener('change', (e) => { mapping.desc = parseInt(e.target.value, 10); });

                pasteEl.addEventListener('input', processPaste);

                fsContent.querySelector('#sheet-cancel').addEventListener('click', () => {
                    document.getElementById('fs-modal-overlay').classList.remove('open');
                    fsContent.innerHTML = '';
                    updateMapToolsVisibility();
                });

                commitBtn.addEventListener('click', async () => {
                    if (!rows.length) return;
                    const num = v => parseFloat(String(v || '').replace(/[°,\s]/g, ''));
                    const parent = targetFolderId ? findNode(targetFolderId) : null;
                    const parentName = parent ? parent.name : 'Root';
                    const defaultFolderName = `Import ${new Date().toLocaleString()}`;
                    const folderName = prompt(`Name for new folder inside "${parentName}":`, defaultFolderName);
                    if (folderName === null) return;
                    const importFolder = createNode({
                        type: 'folder', name: (folderName || '').trim() || defaultFolderName,
                        expanded: true, children: [], meta: { color: '#4d7c0f', desc: 'Imported data' }
                    });
                    if (parent) addNodeToTree(importFolder, parent); else addNodeToTree(importFolder);

                    // ===== Path =====
                    if (isPath) {
                        const groups = new Map();
                        const order = [];
                        let skipped = 0;
                        rows.forEach((row) => {
                            const lat = num(row[mapping.lat]);
                            const lon = num(row[mapping.lon]);
                            if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) { skipped++; return; }
                            const key = (mapping.name >= 0 && row[mapping.name]) ? String(row[mapping.name]) : '__all__';
                            if (!groups.has(key)) { groups.set(key, []); order.push(key); }
                            groups.get(key).push({ lat, lng: lon, desc: (mapping.desc >= 0 ? (row[mapping.desc] || '') : '') });
                        });
                        if (order.length === 0) { showToast('No valid coordinates found', 'fa-exclamation-circle'); await deleteNodeWithChildren(importFolder); renderTree(); return; }
                        let pathCount = 0, dropped = 0;
                        order.forEach(key => {
                            const verts = groups.get(key);
                            if (verts.length < 2) { dropped++; return; }
                            const latlngs = verts.map(v => [v.lat, v.lng]);
                            const dist = pathDistance(latlngs.map(p => L.latLng(p[0], p[1])));
                            const name = (key === '__all__') ? `Path ${pathCount + 1}` : key;
                            // Description is taken from the first row of the group only.
                            const desc = verts[0].desc || '';
                            const line = L.polyline(latlngs, { color: '#4d7c0f', weight: 3 });
                            line.bindPopup(`<b>${escapeHtml(name)}</b><br>Length: ${formatDistance(dist)}${desc ? '<br>' + escapeHtml(desc) : ''}`);
                            drawnItems.addLayer(line);
                            const newNode = createNode({ type: 'path', name, layer: line, meta: { desc, distance: dist, points: latlngs, color: '#4d7c0f' } });
                            bindLayerFocus(newNode, line);
                            attachLayerDrag(newNode, line);
                            addNodeToTree(newNode, importFolder);
                            pathCount++;
                        });
                        if (pathCount > 0) {
                            await persistTree();
                            document.getElementById('fs-modal-overlay').classList.remove('open');
                            fsContent.innerHTML = '';
                            updateMapToolsVisibility();
                            const bounds = L.latLngBounds([]);
                            importFolder.children.forEach(c => { if (c.meta.points) c.meta.points.forEach(p => bounds.extend(p)); });
                            if (bounds.isValid()) setTimeout(() => map.fitBounds(bounds, { ...availableMapPadding(), maxZoom: 16 }), 100);
                            const bits = [`Imported ${pathCount} path(s) into "${importFolder.name}"`];
                            if (skipped) bits.push(`skipped ${skipped} bad coord(s)`);
                            if (dropped) bits.push(`dropped ${dropped} group(s) with <2 points`);
                            showToast(bits.join(', '), 'fa-check');
                        } else {
                            await deleteNodeWithChildren(importFolder);
                            renderTree();
                            showToast('No groups had at least 2 valid vertices', 'fa-exclamation-circle');
                        }
                        return;
                    }

                    // ===== Points =====
                    let added = 0, skipped = 0;
                    const bounds = L.latLngBounds([]);
                    rows.forEach((row, i) => {
                        const lat = num(row[mapping.lat]);
                        const lon = num(row[mapping.lon]);
                        if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) { skipped++; return; }
                        const name = mapping.name >= 0 && row[mapping.name] ? row[mapping.name] : `Point ${i + 1}`;
                        const desc = mapping.desc >= 0 ? row[mapping.desc] || '' : '';
                        const marker = L.marker([lat, lon], { icon: makeLeafletIcon(DEFAULT_ICON, '#4d7c0f') });
                        marker.bindPopup(`<b>${escapeHtml(name)}</b>${desc ? '<br>' + escapeHtml(desc) : ''}`);
                        drawnItems.addLayer(marker);
                        const newNode = createNode({ type: 'placemark', name, layer: marker, meta: { desc, lat, lng: lon, icon: DEFAULT_ICON, color: '#4d7c0f' } });
                        bindLayerFocus(newNode, marker);
                        attachLayerDrag(newNode, marker);
                        addNodeToTree(newNode, importFolder);
                        bounds.extend([lat, lon]);
                        added++;
                    });
                    if (added > 0) {
                        await persistTree();
                        document.getElementById('fs-modal-overlay').classList.remove('open');
                        fsContent.innerHTML = '';
                        updateMapToolsVisibility();
                        if (bounds.isValid()) setTimeout(() => map.fitBounds(bounds, { ...availableMapPadding(), maxZoom: 16 }), 100);
                        showToast(`Imported ${added} point(s) into "${importFolder.name}"${skipped ? `, skipped ${skipped}` : ''}`, 'fa-check');
                    } else {
                        await deleteNodeWithChildren(importFolder);
                        renderTree();
                        showToast('No valid coordinates found', 'fa-exclamation-circle');
                    }
                });
            }

            // ==================== DRAWING ====================
            let drawState = null;
            function clearDrawModeUI() { document.querySelectorAll('.map-tool').forEach(el => el.classList.remove('active')); }
            function cancelActiveDraw() {
                if (drawState) { if (drawState.tempLayer) map.removeLayer(drawState.tempLayer); drawState = null; }
                clearDrawModeUI();
                map.getContainer().style.cursor = '';
                hideSnapPreview();
                refreshSnapZoneMode();
            }
            function beginDraw(type) {
                cancelActiveDraw();
                if (repositionState) endReposition();
                drawState = { type, points: [], tempLayer: null, lastClickTime: 0 };
                clearDrawModeUI();
                const btn = document.getElementById(type === 'placemark' ? 'tool-placemark' : type === 'path' ? 'tool-path' : type === 'polygon' ? 'tool-polygon' : type === 'measure' ? 'tool-measure' : type === 'measure-area' ? 'tool-measure-area' : '');
                if (btn) btn.classList.add('active');
                map.getContainer().style.cursor = 'crosshair';
                if (type === 'placemark') showToast('Click on the map to place a marker', 'fa-map-pin');
                else if (type === 'path' || type === 'measure') showToast('Click points · double-click to finish', 'fa-route');
                else if (type === 'polygon' || type === 'measure-area') showToast('Click points · double-click to close', 'fa-draw-polygon');
                refreshSnapZoneMode();
            }
            function updateTempPreview(latlng) {
                if (!drawState) return;
                if (drawState.tempLayer) { map.removeLayer(drawState.tempLayer); drawState.tempLayer = null; }
                if (drawState.type === 'path' || drawState.type === 'measure') {
                    const pts = drawState.points.concat([latlng]);
                    if (pts.length >= 2) {
                        const color = drawState.type === 'measure' ? '#f59e0b' : '#4d7c0f';
                        const dash = drawState.type === 'measure' ? '6,4' : null;
                        drawState.tempLayer = L.polyline(pts, { color, weight: 3, dashArray: dash || undefined, opacity: 0.75 }).addTo(map);
                    }
                } else if (drawState.type === 'polygon' || drawState.type === 'measure-area') {
                    const pts = drawState.points.concat([latlng]);
                    const color = drawState.type === 'measure-area' ? '#f59e0b' : '#4d7c0f';
                    const dash = drawState.type === 'measure-area' ? '6,4' : null;
                    if (pts.length >= 3) {
                        drawState.tempLayer = L.polygon(pts, { color, weight: 2, fillOpacity: 0.12, dashArray: dash || undefined, opacity: 0.75 }).addTo(map);
                    } else if (pts.length >= 2) {
                        drawState.tempLayer = L.polyline(pts, { color, weight: 2, dashArray: '4,4', opacity: 0.75 }).addTo(map);
                    }
                }
            }
            async function finishPathOrPolygon() {
                if (!drawState) return;
                const pts = drawState.points;
                const type = drawState.type;
                if (drawState.tempLayer) { map.removeLayer(drawState.tempLayer); drawState.tempLayer = null; }
                if (pts.length < 2) {
                    showToast('Not enough points', 'fa-info-circle');
                    drawState = null; clearDrawModeUI();
                    map.getContainer().style.cursor = '';
                    hideSnapPreview();
                    refreshSnapZoneMode();
                    return;
                }
                const latlngs = pts.slice();
                drawState = null; clearDrawModeUI();
                map.getContainer().style.cursor = '';
                hideSnapPreview();
                refreshSnapZoneMode();

                if (type === 'path' || type === 'measure') {
                    const d = pathDistance(latlngs);
                    const isMeasure = (type === 'measure');
                    const color = isMeasure ? '#f59e0b' : '#4d7c0f';
                    const line = L.polyline(latlngs, { color, weight: 3 });
                    drawnItems.addLayer(line);
                    if (isMeasure) {
                        const distStr = formatDistance(d);
                        line.bindPopup(`Distance: <b>${distStr}</b>`).openPopup();
                        const n = createNode({ type: 'measure', name: `Distance: ${distStr}`, layer: line, meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]), color, lineThickness: 3 } });
                        bindLayerFocus(n, line);
                        attachLayerDrag(n, line);
                        if (currentFolderId) addNodeToTree(n, findNode(currentFolderId)); else addNodeToTree(n);
                        await persistTree();
                        showToast('Measured: ' + distStr, 'fa-ruler');
                    } else {
                        const result = await openNewNodeModal({ type: 'path', name: 'New path', meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]), color, desc: '', lineThickness: 3 } });
                        if (!result) { drawnItems.removeLayer(line); return; }
                        line.setStyle({ color: result.color });
                        line.bindPopup(`<b>${escapeHtml(result.name)}</b><br>Length: ${formatDistance(d)}`);
                        const n = createNode({ type: 'path', name: result.name, layer: line, meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]), color: result.color, desc: result.desc, lineThickness: 3 } });
                        bindLayerFocus(n, line);
                        attachLayerDrag(n, line);
                        if (currentFolderId) addNodeToTree(n, findNode(currentFolderId)); else addNodeToTree(n);
                        await persistTree();
                        showToast(`Path: ${result.name}`, 'fa-route');
                    }
                } else if (type === 'polygon' || type === 'measure-area') {
                    if (pts.length < 3) { showToast('Need 3+ points', 'fa-info-circle'); return; }
                    const isMeasure = (type === 'measure-area');
                    const color = isMeasure ? '#f59e0b' : '#4d7c0f';
                    const poly = L.polygon(latlngs, { color, weight: 2, fillOpacity: 0.2 });
                    drawnItems.addLayer(poly);
                    if (isMeasure) {
                        const a = polygonArea(latlngs);
                        const areaStr = formatArea(a);
                        poly.bindPopup(`Area: <b>${areaStr}</b>`).openPopup();
                        const n = createNode({ type: 'measure-area', name: `Area: ${areaStr}`, layer: poly, meta: { area: a, points: latlngs.map(p => [p.lat, p.lng]), color, lineThickness: 2 } });
                        bindLayerFocus(n, poly);
                        attachLayerDrag(n, poly);
                        if (currentFolderId) addNodeToTree(n, findNode(currentFolderId)); else addNodeToTree(n);
                        await persistTree();
                        showToast('Area: ' + areaStr, 'fa-vector-square');
                    } else {

            // ==================== LOS ====================
            function beginLOS() {
                cancelActiveDraw();
                if (repositionState) endReposition();
                clearDrawModeUI();
                const btn = document.getElementById('tool-los');
                if (btn) btn.classList.add('active');

                map.once('click', async (e) => {

                    const result = await openNewNodeModal({

                    });
                    if (!result) return;
                    const node = createNode({
                        type: 'los', name: result.name,
                        meta: { lat: latlng.lat, lng: latlng.lng, radius: 10000, numLines: 36, centerHeight: 30, targetHeight: 2, contourInterval: 500, color: result.color || '#ea580c', desc: result.desc }
                    });
                    const layers = buildLOSLayers(node);
                    node.layer = L.layerGroup(layers);
                    node.layer.addTo(drawnItems);
                    if (drawnItems.bringToFront) drawnItems.bringToFront();
