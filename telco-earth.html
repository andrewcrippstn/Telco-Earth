                    url: 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSTopo/MapServer/tile/{z}/{y}/{x}',
                    attribution: 'USGS', maxZoom: 19 },
                'light-gray': { name: 'Light Gray', group: 'Minimal / Clean', icon: 'fa-square',
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                    attribution: '© Esri', maxZoom: 19 },
                'dark-gray': { name: 'Dark Gray', group: 'Minimal / Clean', icon: 'fa-square-full',
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                    attribution: '© Esri', maxZoom: 19 },
                'natgeo': { name: 'National Geographic', group: 'Artistic', icon: 'fa-compass',
                    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/NatGeo_World_Map/MapServer/tile/{z}/{y}/{x}',
                    attribution: '© Esri, National Geographic', maxZoom: 19 }
            };

            let currentLayer = null;
            let currentProviderKey = 'satellite';
            function makeTileLayer(key) {
                const p = PROVIDERS[key];
                if (!p) return null;
                const opts = { attribution: p.attribution, maxZoom: p.maxZoom };
                if (p.maxNativeZoom) opts.maxNativeZoom = p.maxNativeZoom;
                if (p.subdomains) opts.subdomains = p.subdomains;
                return cachedTileLayer(p.url, opts);
            }
            function switchProvider(key) {
                if (!PROVIDERS[key]) return;
                if (currentLayer) map.removeLayer(currentLayer);
                currentLayer = makeTileLayer(key);
                currentLayer.addTo(map);
                currentProviderKey = key;
                const sel = document.getElementById('provider-select');
                if (sel) sel.value = key;
                showToast('Map: ' + PROVIDERS[key].name, 'fa-map');
            }
            currentLayer = makeTileLayer(currentProviderKey);
            currentLayer.addTo(map);
            document.getElementById('provider-select').addEventListener('change', (e) => switchProvider(e.target.value));

            // ==================== INDEXEDDB ====================
            const DB_NAME = 'telco-earth';
            const DB_VERSION = 1;
            let dbPromise = null;
            function openDB() {
                if (dbPromise) return dbPromise;
                dbPromise = new Promise((resolve, reject) => {
                    const req = indexedDB.open(DB_NAME, DB_VERSION);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('terrain')) db.createObjectStore('terrain', { keyPath: 'key' });
                        if (!db.objectStoreNames.contains('places')) db.createObjectStore('places', { keyPath: 'id' });
                        if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                return dbPromise;
            }
            async function dbPut(store, value) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    tx.objectStore(store).put(value);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async function dbGetAll(store) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = () => reject(req.error);
                });
            }
            async function dbGet(store, key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readonly');
                    const req = tx.objectStore(store).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
            async function dbDelete(store, key) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    tx.objectStore(store).delete(key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }
            async function dbClear(store) {
                const db = await openDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(store, 'readwrite');
                    tx.objectStore(store).clear();
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            // ==================== TREE DATA ====================
            let treeNodes = [];
            let selectedNodeId = null;
            let editingNodeId = null;
            let nextId = 1;
            function genId() { return 'node-' + Date.now() + '-' + (nextId++); }
            function findNode(id, nodes = treeNodes) {
                for (const n of nodes) {
                    if (n.id === id) return n;
                    if (n.children) { const f = findNode(id, n.children); if (f) return f; }
                }
                return null;
            }
            function findParent(id, nodes = treeNodes, parent = null) {
                for (const n of nodes) {
                    if (n.id === id) return { parent, list: nodes };
                    if (n.children) { const f = findParent(id, n.children, n); if (f) return f; }
                }
                return null;
            }
            function removeNode(id) {
                const loc = findParent(id);
                if (!loc) return null;
                const idx = loc.list.findIndex(n => n.id === id);
                if (idx >= 0) return loc.list.splice(idx, 1)[0];
                return null;
            }
            function findNodeByName(name, nodes = treeNodes) {
                for (const n of nodes) {
                    if (n.name === name) return n;
                    if (n.children) { const f = findNodeByName(name, n.children); if (f) return f; }
                }
                return null;
            }
            function createNode(props) {
                return Object.assign({
                    id: genId(), name: 'Untitled', type: 'folder',
                    visible: true, expanded: true, children: [],
                    layer: null, meta: {}
                }, props);
            }
            function addNodeToTree(node, parentFolder = null) {
                if (parentFolder) {
                    if (!parentFolder.children) parentFolder.children = [];
                    if (!parentFolder.expanded) parentFolder.expanded = true;
                    parentFolder.children.push(node);
                } else treeNodes.push(node);
                renderTree();
            }

            // ==================== PERSISTENCE ====================
            async function persistTree() {
                function toPlain(node) {
                    return {
                        id: node.id, name: node.name, type: node.type,
                        visible: node.visible !== false, expanded: node.expanded !== false,
                        meta: JSON.parse(JSON.stringify(node.meta || {})),
                        children: (node.children || []).map(toPlain)
                    };
                }
                try { await dbPut('places', { id: 'root', tree: treeNodes.map(toPlain) }); }
                catch (e) { console.warn('persistTree failed', e); }
            }
            async function loadPersistedTree() {
                try {
                    const rec = await dbGet('places', 'root');
                    if (!rec || !rec.tree) return false;
                    treeNodes = rec.tree.map(fromPlain);
                    rebuildLayers();
                    renderTree();
                    return true;
                } catch (e) { console.warn('loadPersistedTree failed', e); return false; }
            }
            function fromPlain(p) {
                return {
                    id: p.id, name: p.name, type: p.type,
                    visible: p.visible !== false, expanded: p.expanded !== false,
                    meta: p.meta || {}, layer: null,
                    children: (p.children || []).map(fromPlain)
                };
            }
            function rebuildLayers() {
                drawnItems.clearLayers();
                function walk(nodes) {
                    for (const n of nodes) {
                        if (n.type === 'placemark' && n.meta.lat != null && n.meta.lng != null) {
                            const marker = L.marker([n.meta.lat, n.meta.lng], {
                                icon: makeLeafletIcon(n.meta.icon || DEFAULT_ICON, n.meta.color || '#4d7c0f')
                            });
                            const desc = n.meta.desc ? '<br>' + escapeHtml(n.meta.desc) : '';
                            marker.bindPopup(`<b>${escapeHtml(n.name)}</b>${desc}`);
                            n.layer = marker;
                            if (n.visible !== false) marker.addTo(drawnItems);
                        } else if ((n.type === 'path' || n.type === 'measure') && n.meta.points) {
                            const line = L.polyline(n.meta.points, { color: n.meta.color || '#4d7c0f', weight: 3 });
                            n.layer = line;
                            if (n.visible !== false) line.addTo(drawnItems);
                        } else if ((n.type === 'polygon' || n.type === 'measure-area') && n.meta.points) {
                            const poly = L.polygon(n.meta.points, { color: n.meta.color || '#4d7c0f', weight: 2, fillOpacity: 0.2 });
                            n.layer = poly;
                            if (n.visible !== false) poly.addTo(drawnItems);
                        } else if (n.type === 'los') {
                            const layers = buildLOSLayers(n);
                            if (layers) {
                                n.layer = L.layerGroup(layers);
                                if (n.visible !== false) n.layer.addTo(drawnItems);
                            }
                        }
                        if (n.children) walk(n.children);
                    }
                }
                walk(treeNodes);
            }
            async function persistTile(key, arrayBuffer, width, height) {
                try { await dbPut('terrain', { key, buffer: arrayBuffer, width, height, ts: Date.now() }); }
                catch (e) { console.warn('persistTile failed', e); }
            }
            async function loadPersistedTiles() {
                try {
                    const all = await dbGetAll('terrain');
                    if (!all.length) return;
                    for (const rec of all) {
                        try {
                            const parsed = parseHgtArrayBuffer(rec.buffer);
                            terrainStore.set(rec.key, { data: parsed.data, width: parsed.width, height: parsed.height, key: rec.key });
                            visibleTiles.add(rec.key);
                        } catch (e) { console.warn('Bad stored tile', rec.key); }
                    }
                    if (terrainStore.size) {
                        recomputeGlobalScale();
                        syncShowAllState();
                        updateTerrainVisibility();
                        redrawTerrainOverlays();
                        if (activeSection === 'terrain') renderStaticSection('terrain');
                        showToast(`Restored ${terrainStore.size} HGT tile(s)`, 'fa-database');
                    }
                } catch (e) { console.warn('loadPersistedTiles failed', e); }
            }

            // ==================== GLOBAL HEATMAP SCALE ====================
            let globalMin = 0, globalMax = 0;
            function recomputeGlobalScale() {
                let minV = Infinity, maxV = -Infinity;
                for (const [, tile] of terrainStore) {
                    const stats = computeTileStats(tile);
                    if (stats.min < minV) minV = stats.min;
                    if (stats.max > maxV) maxV = stats.max;
                }
                if (!isFinite(minV)) { minV = 0; maxV = 0; }
                if (maxV <= minV) maxV = minV + 1;
                globalMin = minV; globalMax = maxV;
                heatmapCache.clear();
            }

            // ==================== RENDER ====================
            const subrailBody = document.getElementById('subrail-body');
            const subrailTitle = document.getElementById('subrail-title');
            const subrailCount = document.getElementById('subrail-count');
            const subrailActions = document.getElementById('subrail-actions');
            const subrailSearch = document.getElementById('subrail-search');
            const subrail = document.getElementById('subrail');
            const titleActions = document.getElementById('subrail-title-actions');

            const TYPE_ICONS = {
                folder: 'fa-folder', placemark: 'fa-map-pin',
                path: 'fa-route', polygon: 'fa-draw-polygon',
                measure: 'fa-ruler', 'measure-area': 'fa-vector-square',
                terrain: 'fa-mountain', kml: 'fa-file-code',
                los: 'fa-satellite-dish'
            };

            const SECTIONS = {
                places: { title: 'Places', showSearch: true, showActions: true, actions: ['folder', 'import', 'importKML'] },
                draw: { title: 'Draw tools', showSearch: false, showActions: false },
                terrain: { title: 'Terrain (HGT)', showSearch: false, showActions: false },
                layers: { title: 'Layers', showSearch: false, showActions: false },
                settings: { title: 'Settings', showSearch: false, showActions: false }
            };

            let activeSection = 'places';
            let placesViewMode = 'list';

            function renderTree() {
                updateSubrailChrome();
                if (activeSection === 'places') renderPlacesSection();
                else renderStaticSection(activeSection);
            }

            function updateSubrailChrome() {
                const cfg = SECTIONS[activeSection];
                subrailTitle.textContent = cfg.title;

                titleActions.innerHTML = '';
                if (activeSection === 'places') {
                    const modes = [
                        { key: 'list', icon: 'fa-list', title: 'Compact list' },
                        { key: 'columns', icon: 'fa-table-columns', title: 'Multi-column list' },
                        { key: 'details', icon: 'fa-table-list', title: 'Details list' }
                    ];
                    modes.forEach(m => {
                        const btn = document.createElement('button');
                        btn.title = m.title;
                        btn.innerHTML = `<i class="fas ${m.icon}"></i>`;
                        if (placesViewMode === m.key) btn.classList.add('active');
                        btn.addEventListener('click', () => {
                            placesViewMode = m.key;
                            if (placesViewMode === 'list') subrail.classList.remove('wide');
                            else subrail.classList.add('wide');
                            updateMapToolsVisibility();
                            renderTree();
                        });
                        titleActions.appendChild(btn);
                    });
                }

                if (activeSection === 'places') {
                    let count = 0;
                    (function countAll(nodes) {
                        for (const n of nodes) {
                            if (n.name === 'Terrain (HGT)' || n.type === 'terrain') continue;
                            count++;
                            if (n.children) countAll(n.children);
                        }
                    })(treeNodes);
                    subrailCount.textContent = count;
                } else subrailCount.textContent = '';

                subrailActions.innerHTML = '';
                if (cfg.showActions && cfg.actions) {
                    cfg.actions.forEach(a => {
                        const btn = document.createElement('button');
                        btn.className = 'subrail-hbtn';
                        if (a === 'folder') {
                            btn.innerHTML = '<i class="fas fa-folder-plus"></i> Folder';
                            btn.addEventListener('click', promptNewFolder);
                        } else if (a === 'importKML') {
                            btn.innerHTML = '<i class="fas fa-file-import"></i> KML';
                            btn.addEventListener('click', () => kmlInput.click());
                        } else if (a === 'import') {
                            btn.innerHTML = '<i class="fas fa-table"></i> Import';
                            btn.addEventListener('click', openSpreadsheetImport);
                        }
                        subrailActions.appendChild(btn);
                    });
                }

                subrailSearch.style.display = cfg.showSearch ? '' : 'none';

                subrailBody.classList.remove('columns-mode', 'details-mode');
                if (activeSection === 'places') {
                    if (placesViewMode === 'columns') subrailBody.classList.add('columns-mode');
                    else if (placesViewMode === 'details') subrailBody.classList.add('details-mode');
                }
            }

            function updateMapToolsVisibility() {
                const tools = document.getElementById('map-tools');
                const fsOpen = document.getElementById('fs-modal-overlay').classList.contains('open');
                const profileExpanded = document.getElementById('profile-panel').classList.contains('expanded');
                const subrailWide = subrail.classList.contains('wide');
                if (fsOpen || profileExpanded || subrailWide) tools.classList.add('hidden');
                else tools.classList.remove('hidden');
            }

            // Flatten a subtree into a linear list of { node, depth } rows,
            // honouring expanded/collapsed state. Used by columns and details
            // modes so the grid packs left-to-right, top-to-bottom.
            function flattenVisibleRows(nodes, depth = 0, out = []) {
                for (const n of nodes) {
                    out.push({ node: n, depth });
                    if (n.children && n.children.length > 0 && n.expanded) {
                        flattenVisibleRows(n.children, depth + 1, out);
                    }
                }
                return out;
            }

            function renderPlacesSection() {
                function filterPlaces(nodes) {
                    return nodes.filter(n => {
                        if (n.name === 'Terrain (HGT)' || n.type === 'terrain') return false;
                        if (n.children) n.children = filterPlaces(n.children);
                        return true;
                    });
                }
                const placesNodes = filterPlaces(treeNodes.slice());

                if (placesNodes.length === 0) {
                    const cspan = (placesViewMode === 'columns') ? 'grid-column: 1 / -1;' : '';
                    subrailBody.innerHTML = `
                        <div style="padding: 40px 20px; text-align: center; ${cspan}">
                            <div style="width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 14px; background: var(--sage-soft); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-map-location-dot" style="color: var(--sage); font-size: 1.3rem;"></i>
                            </div>
                            <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.95rem; color: var(--ink); margin-bottom: 6px;">Nothing here yet</div>
                            <div style="font-size: 0.76rem; color: var(--ink-3); line-height: 1.5;">Draw on the map, import a spreadsheet, or load a KML file.</div>
                        </div>`;
                    return;
                }

                subrailBody.innerHTML = '';

                if (placesViewMode === 'details') {
                    const header = document.createElement('div');
                    header.className = 'details-header-row';
                    header.innerHTML = `
                        <div></div>
                        <div>Name</div>
                        <div>Description</div>
                        <div>Info</div>
                    `;
                    subrailBody.appendChild(header);

                    // Flat list: one row per visible node.
                    const rows = flattenVisibleRows(placesNodes);
                    rows.forEach(({ node, depth }) => {
                        subrailBody.appendChild(buildFlatRow(node, depth, 'details'));
                    });
                    return;
                }

                // List + columns modes
                const rootZone = document.createElement('div');
                rootZone.className = 'root-drop-zone';
                rootZone.id = 'root-drop-zone';
                rootZone.innerHTML = '<div style="font-family: \'IBM Plex Mono\', monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; padding: 2px 4px;">Root</div>';
                setupRootDropTarget(rootZone);
                subrailBody.appendChild(rootZone);

                if (placesViewMode === 'columns') {
                    // Flatten so the grid packs left→right, then wraps.
                    const rows = flattenVisibleRows(placesNodes);
                    rows.forEach(({ node, depth }) => {
                        subrailBody.appendChild(buildFlatRow(node, depth, 'columns'));
                    });
                } else {
                    // Classic nested list
                    placesNodes.forEach(n => subrailBody.appendChild(buildTreeItem(n, 0, null)));
                }
            }

            function setupRootDropTarget(el) {
                el.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    el.classList.add('active');
                    hideDragLine();
                });
                el.addEventListener('dragleave', () => el.classList.remove('active'));
                el.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    el.classList.remove('active');
                    const draggedId = e.dataTransfer.getData('text/plain');
                    if (!draggedId) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    removeNode(draggedId);
                    treeNodes.push(dragged);
                    renderTree();
                    await persistTree();
                    showToast(`Moved "${dragged.name}" to root`, 'fa-arrows-up-down-left-right');
                });
            }

            let dragLineEl = null;
            let currentDropTarget = null;
            function ensureDragLine() {
                if (!dragLineEl) {
                    dragLineEl = document.createElement('div');
                    dragLineEl.className = 'drag-line';
                    document.body.appendChild(dragLineEl);
                }
                return dragLineEl;
            }
            function hideDragLine() {
                if (dragLineEl) dragLineEl.classList.remove('show', 'drop-inside');
                document.querySelectorAll('.tree-item.drop-target').forEach(el => el.classList.remove('drop-target'));
                const rz = document.getElementById('root-drop-zone');
                if (rz) rz.classList.remove('active');
                currentDropTarget = null;
            }
            function showDragLine(rect, position) {
                const line = ensureDragLine();
                if (position === 'inside') {
                    line.classList.add('show', 'drop-inside');
                    line.style.left = rect.left + 'px';
                    line.style.top = rect.top + 'px';
                    line.style.width = rect.width + 'px';
                    return;
                }
                line.classList.remove('drop-inside');
                const y = position === 'before' ? rect.top - 1 : rect.bottom - 1;
                line.classList.add('show');
                line.style.left = rect.left + 'px';
                line.style.top = y + 'px';
                line.style.width = rect.width + 'px';
            }

            // Build a single flat row for columns/details mode.
            // `depth` controls the left indent; folders toggle their expanded
            // state which re-renders the whole flat list.
            function buildFlatRow(node, depth, mode) {
                const wrap = document.createElement('div');
                wrap.className = 'tree-item-wrap';
                wrap.dataset.nodeId = node.id;

                const row = document.createElement('div');
                row.className = 'tree-item';
                if (selectedNodeId === node.id) row.classList.add('active');
                if (node.visible === false) row.classList.add('hidden-item');
                row.dataset.nodeId = node.id;
                row.draggable = true;

                const hasChildren = node.children && node.children.length > 0;

                // Chevron (folders / items with children) or spacer
                if (hasChildren) {
                    const toggle = document.createElement('i');
                    toggle.className = 'fas fa-chevron-' + (node.expanded ? 'down' : 'right') + ' tree-toggle';
                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        node.expanded = !node.expanded;
                        renderTree();
                    });
                    row.appendChild(toggle);
                } else {
                    const spacer = document.createElement('span');
                    spacer.style.cssText = 'width: 10px; display: inline-block; flex-shrink: 0;';
                    row.appendChild(spacer);
                }

                // Indentation based on depth (columns mode only; details stays flat)
                if (mode === 'columns' && depth > 0) {
                    const indent = document.createElement('span');
                    indent.className = 'col-indent';
                    indent.style.width = (depth * 14) + 'px';
                    row.appendChild(indent);
                }

                // Icon
                const icon = document.createElement('div');
                icon.className = 'tree-item-icon';
                let iconFa, iconColor;
                if (node.type === 'placemark') {
                    iconFa = node.meta.icon || DEFAULT_ICON;
                    iconColor = node.meta.color || '#4d7c0f';
                } else if (node.type === 'los') {
                    iconFa = 'fa-satellite-dish';
                    iconColor = node.meta.color || '#ea580c';
                } else {
                    iconFa = TYPE_ICONS[node.type] || 'fa-circle';
                    iconColor = node.meta && node.meta.color ? node.meta.color : '';
                }
                icon.innerHTML = `<i class="fas ${iconFa}"${iconColor ? ` style="color:${iconColor}"` : ''}></i>`;
                row.appendChild(icon);

                // Name
                const name = document.createElement('div');
                name.className = 'tree-item-label';
                name.textContent = node.name;
                row.appendChild(name);

                if (mode === 'details') {
                    const desc = document.createElement('div');
                    desc.className = 'details-desc';
                    desc.textContent = (node.meta && node.meta.desc) ? node.meta.desc : '—';
                    row.appendChild(desc);

                    const meta = document.createElement('div');
                    meta.className = 'details-meta';
                    if (node.type === 'placemark' && node.meta.lat != null) {
                        meta.textContent = `${node.meta.lat.toFixed(4)}, ${node.meta.lng.toFixed(4)}`;
                    } else if (node.type === 'los' && node.meta.lat != null) {
                        meta.textContent = `R ${node.meta.radius || 10000} m`;
                    } else if (node.type === 'terrain' && node.meta.key) {
                        meta.textContent = node.meta.key;
                    } else if (node.children) {
                        meta.textContent = `${node.children.length} item${node.children.length !== 1 ? 's' : ''}`;
                    } else meta.textContent = node.type;
                    row.appendChild(meta);
                } else {
                    // columns mode: small child-count badge on folders
                    if (hasChildren && (node.type === 'folder' || node.type === 'kml')) {
                        const badge = document.createElement('div');
                        badge.className = 'tree-badge';
                        badge.textContent = node.children.length;
                        row.appendChild(badge);
                    }
                }

                // Visibility toggle
                const vis = document.createElement('div');
                vis.className = 'tree-vis-toggle';
                vis.title = node.visible === false ? 'Show' : 'Hide';
                vis.innerHTML = `<i class="fas ${node.visible === false ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
                vis.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    setNodeVisible(node, node.visible === false);
                    renderTree();
                    await persistTree();
                });
                row.appendChild(vis);

                // Interactions
                row.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node); });
                row.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    if (mode === 'details') openDetailsView(node);
                    else if (hasChildren) { node.expanded = !node.expanded; renderTree(); }
                });

                row.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showContextMenu(e.clientX, e.clientY, node);
                });

                // Drag & drop
                row.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    e.dataTransfer.setData('text/plain', node.id);
                    e.dataTransfer.effectAllowed = 'move';
                    row.classList.add('dragging');
                    _draggingId = node.id;
                });
                row.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    _draggingId = null;
                    hideDragLine();
                });
                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const draggedId = e.dataTransfer.getData('text/plain') || getDraggingId();
                    if (!draggedId || draggedId === node.id) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    function isDescendant(anc, desc) {
                        if (!anc.children) return false;
                        for (const c of anc.children) {
                            if (c.id === desc.id) return true;
                            if (isDescendant(c, desc)) return true;
                        }
                        return false;
                    }
                    if (isDescendant(dragged, node)) { e.dataTransfer.dropEffect = 'none'; return; }

                    const rect = row.getBoundingClientRect();
                    const relY = (e.clientY - rect.top) / rect.height;
                    const canContain = (node.type === 'folder' || node.type === 'kml');
                    let zone;
                    if (canContain && relY > 0.25 && relY < 0.75) zone = 'inside';
                    else if (relY < 0.5) zone = 'before';
                    else zone = 'after';

                    document.querySelectorAll('.tree-item.drop-target').forEach(el => el.classList.remove('drop-target'));
                    if (zone === 'inside') {
                        row.classList.add('drop-target');
                        showDragLine(rect, 'inside');
                        currentDropTarget = { type: 'inside', node };
                    } else {
                        showDragLine(rect, zone);
                        currentDropTarget = { type: zone, node };
                    }
                    e.dataTransfer.dropEffect = 'move';
                });
                row.addEventListener('dragleave', (e) => {
                    if (e.relatedTarget && row.contains(e.relatedTarget)) return;
                    row.classList.remove('drop-target');
                });
                row.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    row.classList.remove('drop-target');
                    hideDragLine();
                    const draggedId = e.dataTransfer.getData('text/plain') || getDraggingId();
                    if (!draggedId || draggedId === node.id) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    function isDescendant(anc, desc) {
                        if (!anc.children) return false;
                        for (const c of anc.children) {
                            if (c.id === desc.id) return true;
                            if (isDescendant(c, desc)) return true;
                        }
                        return false;
                    }
                    if (isDescendant(dragged, node)) { showToast('Cannot drop folder into itself'); return; }
                    const target = currentDropTarget;
                    if (!target) return;

                    if (target.type === 'inside') {
                        removeNode(draggedId);
                        if (!node.children) node.children = [];
                        node.children.push(dragged);
                        node.expanded = true;
                        renderTree();
                        await persistTree();
                        showToast(`Moved "${dragged.name}" into ${node.name}`, 'fa-arrows-up-down-left-right');
                    } else {
                        const loc = findParent(node.id);
                        if (!loc) { showToast('Cannot move here'); return; }
                        removeNode(draggedId);
                        const idx = loc.list.findIndex(n => n.id === node.id);
                        const insertAt = target.type === 'before' ? idx : idx + 1;
                        loc.list.splice(insertAt, 0, dragged);
                        renderTree();
                        await persistTree();
                        showToast(`Moved "${dragged.name}"`, 'fa-arrows-up-down-left-right');
                    }
                });

                wrap.appendChild(row);
                return wrap;
            }

            function buildTreeItem(node, depth, parentNode) {
                const wrap = document.createElement('div');
                wrap.className = 'tree-item-wrap';
                wrap.dataset.nodeId = node.id;

                const row = document.createElement('div');
                row.className = 'tree-item';
                if (selectedNodeId === node.id) row.classList.add('active');
                if (node.visible === false) row.classList.add('hidden-item');
                row.dataset.nodeId = node.id;
                row.draggable = true;

                const hasChildren = node.children && node.children.length > 0;
                if (hasChildren) {
                    const toggle = document.createElement('i');
                    toggle.className = 'fas fa-chevron-' + (node.expanded ? 'down' : 'right') + ' tree-toggle';
                    toggle.addEventListener('click', (e) => {
                        e.stopPropagation();
                        node.expanded = !node.expanded;
                        renderTree();
                    });
                    row.appendChild(toggle);
                } else {
                    const spacer = document.createElement('span');
                    spacer.style.cssText = 'width: 10px; display: inline-block; flex-shrink: 0;';
                    row.appendChild(spacer);
                }

                const icon = document.createElement('div');
                icon.className = 'tree-item-icon';
                let iconFa, iconColor;
                if (node.type === 'placemark') {
                    iconFa = node.meta.icon || DEFAULT_ICON;
                    iconColor = node.meta.color || '#4d7c0f';
                } else if (node.type === 'los') {
                    iconFa = 'fa-satellite-dish';
                    iconColor = node.meta.color || '#ea580c';
                } else {
                    iconFa = TYPE_ICONS[node.type] || 'fa-circle';
                    iconColor = node.meta && node.meta.color ? node.meta.color : '';
                }
                icon.innerHTML = `<i class="fas ${iconFa}"${iconColor ? ` style="color:${iconColor}"` : ''}></i>`;
                row.appendChild(icon);

                const name = document.createElement('div');
                name.className = 'tree-item-label';
                name.textContent = node.name;
                row.appendChild(name);

                if (node.children && node.children.length > 0 && node.type === 'folder') {
                    const badge = document.createElement('div');
                    badge.className = 'tree-badge';
                    badge.textContent = node.children.length;
                    row.appendChild(badge);
                }

                const vis = document.createElement('div');
                vis.className = 'tree-vis-toggle';
                vis.title = node.visible === false ? 'Show' : 'Hide';
                vis.innerHTML = `<i class="fas ${node.visible === false ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
                vis.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    setNodeVisible(node, node.visible === false);
                    renderTree();
                    await persistTree();
                });
                row.appendChild(vis);

                row.addEventListener('click', (e) => { e.stopPropagation(); selectNode(node); });
                row.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    if (hasChildren) { node.expanded = !node.expanded; renderTree(); }
                });

                row.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    showContextMenu(e.clientX, e.clientY, node);
                });

                row.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    e.dataTransfer.setData('text/plain', node.id);
                    e.dataTransfer.effectAllowed = 'move';
                    row.classList.add('dragging');
                    _draggingId = node.id;
                });
                row.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    _draggingId = null;
                    hideDragLine();
                });
                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const draggedId = e.dataTransfer.getData('text/plain') || getDraggingId();
                    if (!draggedId || draggedId === node.id) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    function isDescendant(anc, desc) {
                        if (!anc.children) return false;
                        for (const c of anc.children) {
                            if (c.id === desc.id) return true;
                            if (isDescendant(c, desc)) return true;
                        }
                        return false;
                    }
                    if (isDescendant(dragged, node)) { e.dataTransfer.dropEffect = 'none'; return; }

                    const rect = row.getBoundingClientRect();
                    const relY = (e.clientY - rect.top) / rect.height;
                    const canContain = (node.type === 'folder' || node.type === 'kml');
                    let zone;
                    if (canContain && relY > 0.25 && relY < 0.75) zone = 'inside';
                    else if (relY < 0.5) zone = 'before';
                    else zone = 'after';

                    document.querySelectorAll('.tree-item.drop-target').forEach(el => el.classList.remove('drop-target'));
                    if (zone === 'inside') {
                        row.classList.add('drop-target');
                        showDragLine(rect, 'inside');
                        currentDropTarget = { type: 'inside', node };
                    } else {
                        showDragLine(rect, zone);
                        currentDropTarget = { type: zone, node };
                    }
                    e.dataTransfer.dropEffect = 'move';
                });
                row.addEventListener('dragleave', (e) => {
                    if (e.relatedTarget && row.contains(e.relatedTarget)) return;
                    row.classList.remove('drop-target');
                });
                row.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    row.classList.remove('drop-target');
                    hideDragLine();
                    const draggedId = e.dataTransfer.getData('text/plain') || getDraggingId();
                    if (!draggedId || draggedId === node.id) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    function isDescendant(anc, desc) {
                        if (!anc.children) return false;
                        for (const c of anc.children) {
                            if (c.id === desc.id) return true;
                            if (isDescendant(c, desc)) return true;
                        }
                        return false;
                    }
                    if (isDescendant(dragged, node)) { showToast('Cannot drop folder into itself'); return; }
                    const target = currentDropTarget;
                    if (!target) return;

                    if (target.type === 'inside') {
                        removeNode(draggedId);
                        if (!node.children) node.children = [];
                        node.children.push(dragged);
                        node.expanded = true;
                        renderTree();
                        await persistTree();
                        showToast(`Moved "${dragged.name}" into ${node.name}`, 'fa-arrows-up-down-left-right');
                    } else {
                        const loc = findParent(node.id);
                        if (!loc) { showToast('Cannot move here'); return; }
                        removeNode(draggedId);
                        const idx = loc.list.findIndex(n => n.id === node.id);
                        const insertAt = target.type === 'before' ? idx : idx + 1;
                        loc.list.splice(insertAt, 0, dragged);
                        renderTree();
                        await persistTree();
                        showToast(`Moved "${dragged.name}"`, 'fa-arrows-up-down-left-right');
                    }
                });

                wrap.appendChild(row);

                if (hasChildren && node.expanded) {
                    const kids = document.createElement('div');
                    kids.className = 'tree-children';
                    node.children.forEach(c => kids.appendChild(buildTreeItem(c, depth + 1, node)));
                    wrap.appendChild(kids);
                }
                return wrap;
            }

            let _draggingId = null;
            function getDraggingId() { return _draggingId; }

            // ==================== CONTEXT MENU ====================
            const ctxMenu = document.getElementById('context-menu');
            function showContextMenu(x, y, node) {
                const items = [];

                items.push({ label: 'Properties', icon: 'fa-circle-info', action: () => showProperties(node) });
                items.push({ label: 'Edit…', icon: 'fa-pen', action: () => openEditor(node) });
                items.push({ label: 'Reposition on map', icon: 'fa-arrows-up-down-left-right', action: () => startReposition(node) });
                items.push({ sep: true });

                if (node.visible === false) {
                    items.push({ label: 'Show', icon: 'fa-eye', action: async () => {
                        setNodeVisible(node, true); renderTree(); await persistTree();
                    }});
                } else {
                    items.push({ label: 'Hide', icon: 'fa-eye-slash', action: async () => {
                        setNodeVisible(node, false); renderTree(); await persistTree();
                    }});
                }

                if (node.type === 'folder' || node.type === 'kml') {
                    items.push({ label: 'Show all children', icon: 'fa-eye', action: async () => {
                        if (node.children) node.children.forEach(c => setNodeVisible(c, true));
                        renderTree(); await persistTree();
                    }});
                    items.push({ label: 'Hide all children', icon: 'fa-eye-slash', action: async () => {
                        if (node.children) node.children.forEach(c => setNodeVisible(c, false));
                        renderTree(); await persistTree();
                    }});
                }

                items.push({ sep: true });

                if (node.layer && (node.layer.getLatLng || node.layer.getBounds)) {
                    items.push({ label: 'Zoom to', icon: 'fa-crosshairs', action: () => zoomToNode(node) });
                }

                if (['path','measure','polygon','measure-area'].includes(node.type) && node.meta.points) {
                    items.push({ label: 'Path profile', icon: 'fa-chart-area', action: () => openProfilePanel(node) });
                }

                if (node.type === 'los') {
                    items.push({ label: 'LOS profile', icon: 'fa-chart-area', action: () => openLOSProfile(node) });
                    items.push({ label: 'Recalculate LOS', icon: 'fa-rotate', action: async () => {
                        const layers = buildLOSLayers(node);
                        const wasVisible = node.visible !== false;
                        if (node.layer) drawnItems.removeLayer(node.layer);
                        node.layer = L.layerGroup(layers);
                        if (wasVisible) node.layer.addTo(drawnItems);
                        showToast('LOS recalculated', 'fa-satellite-dish');
                    }});
                }

                if (['placemark','path','polygon','measure','measure-area','folder','kml','los'].includes(node.type)) {
                    items.push({ label: 'Export as KML…', icon: 'fa-file-code', action: () => exportKMLNode(node) });
                }
                if (['placemark','path','polygon','measure','measure-area'].includes(node.type)) {
                    items.push({ label: 'Export as GPX…', icon: 'fa-file-export', action: () => exportGPX(node) });
                }

                items.push({ sep: true });
                items.push({ label: 'Delete', icon: 'fa-trash', danger: true, action: async () => {
                    if (!confirm(`Delete "${node.name}"${node.children && node.children.length ? ' and all its children' : ''}?`)) return;
                    await deleteNodeWithChildren(node);
                    renderTree();
                    await persistTree();
                    showToast('Deleted ' + node.name, 'fa-trash');
                }});

                ctxMenu.innerHTML = `<div class="ctx-title">${escapeHtml(node.name)}</div>` +
                    items.map((it, i) => {
                        if (it.sep) return '<div class="ctx-sep"></div>';
                        return `<div class="ctx-item ${it.danger ? 'danger' : ''}" data-i="${i}"><i class="fas ${it.icon}"></i><span>${it.label}</span></div>`;
                    }).join('');

                ctxMenu.classList.add('open');
                const mw = 240;
                const mh = ctxMenu.offsetHeight || 300;
                ctxMenu.style.left = Math.min(x, window.innerWidth - mw - 8) + 'px';
                ctxMenu.style.top = Math.min(y, window.innerHeight - mh - 8) + 'px';

                ctxMenu.querySelectorAll('.ctx-item').forEach(el => {
                    const idx = parseInt(el.dataset.i, 10);
                    const item = items[idx];
                    el.addEventListener('click', () => {
                        hideContextMenu();
                        if (item.action) item.action();
                    });
                });
            }
            function hideContextMenu() { ctxMenu.classList.remove('open'); }
            document.addEventListener('click', hideContextMenu);
            document.addEventListener('contextmenu', (e) => {
                if (!ctxMenu.contains(e.target)) hideContextMenu();
            });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideContextMenu(); });

            // ==================== VISIBILITY / DELETE ====================
            function setNodeVisible(node, visible) {
                node.visible = visible;
                if (node.layer) {
                    if (visible) {
                        if (!map.hasLayer(node.layer)) node.layer.addTo(map);
                        if (!drawnItems.hasLayer(node.layer)) drawnItems.addLayer(node.layer);
                    } else {
                        if (map.hasLayer(node.layer)) map.removeLayer(node.layer);
                        if (drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                    }
                }
                if (node.children) node.children.forEach(c => setNodeVisible(c, visible));
            }

            async function deleteNodeWithChildren(node) {
                if (editingNodeId === node.id) stopEditing();
                if (node.children) {
                    for (const c of node.children.slice()) await deleteNodeWithChildren(c);
                }
                if (node.layer && map.hasLayer(node.layer)) map.removeLayer(node.layer);
                if (node.layer && drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                if (node.type === 'terrain' && node.meta && node.meta.key) {
                    visibleTiles.delete(node.meta.key);
                    terrainStore.delete(node.meta.key);
                    await dbDelete('terrain', node.meta.key);
                    recomputeGlobalScale();
                    redrawTerrainOverlays();
                    updateTerrainVisibility();
                }
                removeNode(node.id);
                if (selectedNodeId === node.id) selectedNodeId = null;
            }

            function zoomToNode(node) {
                if (!node.layer) {
                    if (node.type === 'folder' && node.children) {
                        const bounds = L.latLngBounds([]);
                        (function walk(n) {
                            if (n.layer) {
                                if (n.layer.getBounds) { try { bounds.extend(n.layer.getBounds()); } catch(e){} }
                                else if (n.layer.getLatLng) bounds.extend(n.layer.getLatLng());
                            }
                            if (n.children) n.children.forEach(walk);
                        })(node);
                        if (bounds.isValid()) map.flyToBounds(bounds, { padding: [60,60], duration: 1.2 });
                    }
                    return;
                }
                if (node.layer.getBounds) {
                    const b = node.layer.getBounds();
                    if (b.isValid()) map.flyToBounds(b, { padding: [60,60], duration: 1.2 });
                } else if (node.layer.getLatLng) {
                    map.flyTo(node.layer.getLatLng(), Math.max(map.getZoom(), 13), { duration: 1.2 });
                }
            }

            // ==================== STATIC SECTIONS ====================
            function renderStaticSection(section) {
                if (section === 'draw') {
                    const items = [
                        { icon: 'fa-map-pin', label: 'Add placemark', desc: 'Click map to place a marker', action: () => beginDraw('placemark') },
                        { icon: 'fa-route', label: 'Add path', desc: 'Multi-point line', action: () => beginDraw('path') },
                        { icon: 'fa-draw-polygon', label: 'Add polygon', desc: 'Closed area', action: () => beginDraw('polygon') },
                        { icon: 'fa-ruler', label: 'Measure distance', desc: 'Two-point measure', action: () => beginDraw('measure') },
                        { icon: 'fa-vector-square', label: 'Measure area', desc: 'Polygon area', action: () => beginDraw('measure-area') },
                        { icon: 'fa-satellite-dish', label: 'Add LOS radius', desc: 'Line-of-sight analysis from a point', action: () => beginLOS() },
                        { icon: 'fa-eraser', label: 'Clear all drawings', desc: 'Remove all objects', action: () => clearAllDrawings() }
                    ];
                    subrailBody.innerHTML = items.map((it, i) => `
                        <div class="static-item" data-action="${i}">
                            <div class="static-item-icon"><i class="fas ${it.icon}"></i></div>
                            <div class="static-item-body">
                                <div class="static-item-label">${it.label}</div>
                                <div class="static-item-desc">${it.desc}</div>
                            </div>
                        </div>
                    `).join('');
                    subrailBody.querySelectorAll('.static-item').forEach((el, i) => {
                        el.addEventListener('click', () => items[i].action());
                    });
                } else if (section === 'terrain') {
                    const topItems = [
                        { icon: 'fa-upload', label: 'Upload HGT files', desc: 'SRTM .hgt format', action: () => fileInput.click() },
                        { icon: 'fa-download', label: 'Download HGT', desc: 'Viewfinder Panoramas', action: () => window.open('https://viewfinderpanoramas.org/Coverage%20map%20viewfinderpanoramas_org3.htm', '_blank') }
                    ];
                    subrailBody.innerHTML = topItems.map((it, i) => `
                        <div class="static-item" data-action="${i}">
                            <div class="static-item-icon"><i class="fas ${it.icon}"></i></div>
                            <div class="static-item-body">
                                <div class="static-item-label">${it.label}</div>
                                <div class="static-item-desc">${it.desc}</div>
                            </div>
                        </div>
                    `).join('');
                    subrailBody.querySelectorAll('.static-item').forEach((el, i) => {
                        el.addEventListener('click', () => topItems[i].action());
                    });

                    const toggle = document.createElement('div');
                    toggle.className = 'toggle-row' + (showAllHeatmaps ? ' active' : '');
                    const subText = terrainStore.size === 0
                        ? 'No tiles loaded'
                        : (showAllHeatmaps
                            ? `All ${terrainStore.size} tile${terrainStore.size > 1 ? 's' : ''} visible`
                            : `${visibleTiles.size} of ${terrainStore.size} visible`);
                    toggle.innerHTML = `
                        <div class="toggle-switch"></div>
                        <div class="toggle-label">
                            <div class="toggle-label-main">Show all heatmaps</div>
                            <div class="toggle-label-sub">${subText}</div>
                        </div>
                    `;
                    toggle.addEventListener('click', () => {
                        if (terrainStore.size === 0) { showToast('No HGT tiles loaded yet', 'fa-info-circle'); return; }
                        if (showAllHeatmaps) { visibleTiles.clear(); showToast('Heatmaps hidden', 'fa-eye-slash'); }
                        else { terrainStore.forEach((_t, k) => visibleTiles.add(k)); showToast('Showing all heatmaps', 'fa-eye'); }
                        syncShowAllState();
                        redrawTerrainOverlays();
                        renderStaticSection('terrain');
                    });
                    subrailBody.appendChild(toggle);

                    if (terrainStore.size > 0) {
                        const scaleInfo = document.createElement('div');
                        scaleInfo.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; color: var(--ink-3); padding: 4px 4px 10px;';
                        scaleInfo.textContent = `Shared scale · ${globalMin} m – ${globalMax} m`;
                        subrailBody.appendChild(scaleInfo);
                    }

                    const heading = document.createElement('div');
                    heading.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; padding: 16px 4px 8px;';
                    heading.textContent = 'Colour scheme';
                    subrailBody.appendChild(heading);

                    const grid = document.createElement('div');
                    grid.className = 'scheme-grid';
                    Object.keys(HEATMAP_SCHEMES).forEach(key => {
                        const s = HEATMAP_SCHEMES[key];
                        const stops = [];
                        for (let i = 0; i <= 10; i++) {
                            const t = i / 10;
                            const c = s.color(t);
                            stops.push(`rgba(${c[0]|0},${c[1]|0},${c[2]|0},1) ${(t*100).toFixed(0)}%`);
                        }
                        const card = document.createElement('div');
                        card.className = 'scheme-card' + (currentSchemeKey === key ? ' active' : '');
                        card.innerHTML = `
                            <div class="scheme-preview" style="background: linear-gradient(90deg, ${stops.join(', ')});"></div>
                            <div class="scheme-name">${s.name}</div>
                        `;
                        card.addEventListener('click', () => {
                            currentSchemeKey = key;
                            heatmapCache.clear();
                            redrawTerrainOverlays();
                            renderStaticSection('terrain');
                            showToast('Colour scheme: ' + s.name, 'fa-palette');
                        });
                        grid.appendChild(card);
                    });
                    subrailBody.appendChild(grid);

                    if (terrainStore.size > 0) {
                        const heading2 = document.createElement('div');
                        heading2.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; padding: 16px 4px 8px;';
                        heading2.textContent = 'Loaded tiles · ' + terrainStore.size;
                        subrailBody.appendChild(heading2);

                        terrainStore.forEach((tile, key) => {
                            const isVisible = visibleTiles.has(key);
                            const row = document.createElement('div');
                            row.className = 'tile-row' + (isVisible ? ' active' : '');
                            row.innerHTML = `
                                <div class="tile-check"><i class="fas fa-check"></i></div>
                                <div class="tile-info">
                                    <div class="tile-info-name">${escapeHtml(key)}</div>
                                    <div class="tile-info-meta">${tile.width}×${tile.height}</div>
                                </div>
                                <button class="tile-zoom" title="Zoom to tile"><i class="fas fa-crosshairs"></i></button>
                                <button class="tile-del" title="Remove tile"><i class="fas fa-trash"></i></button>
                            `;
                            row.addEventListener('click', (e) => {
                                if (e.target.closest('.tile-zoom') || e.target.closest('.tile-del')) return;
                                toggleTileVisibility(key);
                                renderStaticSection('terrain');
                            });
                            row.querySelector('.tile-zoom').addEventListener('click', (e) => {
                                e.stopPropagation();
                                const sw = parseKey(key);
                                map.flyToBounds([[sw.lat, sw.lng], [sw.lat + 1, sw.lng + 1]], { duration: 1.2 });
                            });
                            row.querySelector('.tile-del').addEventListener('click', async (e) => {
                                e.stopPropagation();
                                if (!confirm(`Remove HGT tile ${key}?`)) return;
                                visibleTiles.delete(key);
                                terrainStore.delete(key);
                                await dbDelete('terrain', key);
                                recomputeGlobalScale();
                                syncShowAllState();
                                redrawTerrainOverlays();
                                updateTerrainVisibility();
                                renderStaticSection('terrain');
                                const tf = findNodeByName('Terrain (HGT)');
                                if (tf) {
                                    const idx = tf.children.findIndex(c => c.meta && c.meta.key === key);
                                    if (idx >= 0) tf.children.splice(idx, 1);
                                    renderTree();
                                    await persistTree();
                                }
                            });
                            subrailBody.appendChild(row);

                } else if (section === 'layers') {
                    const groups = {};
                    const groupOrder = [];
                    Object.keys(PROVIDERS).forEach(key => {
                        const p = PROVIDERS[key];
                        if (!groups[p.group]) { groups[p.group] = []; groupOrder.push(p.group); }
                        groups[p.group].push({ key, ...p });
                    });

                    subrailBody.innerHTML = '';
                    groupOrder.forEach(groupName => {
                        const heading = document.createElement('div');
                        heading.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; padding: 14px 4px 8px;';
                        heading.textContent = groupName;
                        subrailBody.appendChild(heading);

                        groups[groupName].forEach(item => {
                            const row = document.createElement('div');
                            row.className = 'layer-row' + (currentProviderKey === item.key ? ' active' : '');
                            row.innerHTML = `
                                <div class="check-circle"><i class="fas fa-check"></i></div>
                                <div class="tree-item-icon" style="width:22px;height:22px;border-radius:6px;"><i class="fas ${item.icon}" style="font-size:0.65rem;"></i></div>
                                <div style="flex:1;font-weight:500;">${item.name}</div>
                            `;
                            row.addEventListener('click', () => { switchProvider(item.key); renderStaticSection('layers'); });
                            subrailBody.appendChild(row);
                        });
                    });
                } else if (section === 'settings') {
                    const actions = [
                        { icon: 'fa-database', label: 'Storage info', desc: 'IndexedDB usage estimate', action: async () => {
                            if (navigator.storage && navigator.storage.estimate) {
                                const est = await navigator.storage.estimate();
                                showToast(`Used ${(est.usage / 1048576).toFixed(1)} MB of ${(est.quota / 1048576).toFixed(0)} MB`, 'fa-database');
                            } else showToast('Storage estimate unavailable', 'fa-info-circle');
                        }},
                        { icon: 'fa-location-dot', label: 'Go to my location', desc: 'GPS / network location', action: () => locateMe() },
                        { icon: 'fa-file-export', label: 'Export all as KML', desc: 'Download KML of all places', action: () => exportKMLAll() },
                        { icon: 'fa-route', label: 'Export all as GPX', desc: 'GPS Exchange Format', action: () => exportGPXAll() }
                    ];
                    subrailBody.innerHTML = actions.map((it, i) => `
                        <div class="static-item" data-action="${i}">
                            <div class="static-item-icon"><i class="fas ${it.icon}"></i></div>
                            <div class="static-item-body">
