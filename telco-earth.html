                    await persistTree();
                    showToast(`LOS added: ${result.name}`, 'fa-satellite-dish');
                });
            }
            function losLineGeometry(node, bearingDeg, stepMeters = 10) {
                const center = L.latLng(node.meta.lat, node.meta.lng);
                const radius = node.meta.radius || 10000;
                const centerHeight = node.meta.centerHeight || 30;
                const targetHeight = node.meta.targetHeight || 2;
                const centerElev = getElevation(center.lat, center.lng);
                const antennaElev = centerElev !== null ? centerElev + centerHeight : centerHeight;
                const bearingRad = bearingDeg * Math.PI / 180;
                const pts = [];
                const cosLat = Math.cos(center.lat * Math.PI / 180);
                for (let d = 0; d <= radius; d += stepMeters) {
                    const lat = center.lat + (d * Math.cos(bearingRad)) / 111320;
                    const lng = center.lng + (d * Math.sin(bearingRad)) / (111320 * cosLat);
                    const groundElev = getElevation(lat, lng);
                    if (groundElev === null) {
                        if (d === 0) return { pts: [], lostAt: null, antennaElev, targetElevEnd: null, centerElev };
                        break;
                    }
                    pts.push({lat, lng, d, groundElev, targetElev: groundElev + targetHeight});
                }
                if (pts.length < 2) return { pts, lostAt: null, antennaElev, targetElevEnd: null, centerElev };
                const endPt = pts[pts.length - 1];
                const targetElevEnd = endPt.targetElev;
                const totalD = endPt.d;
                const raySlope = (targetElevEnd - antennaElev) / totalD;
                let lostAt = null;
                for (const p of pts) {
                    if (p.d === 0) continue;
                    const rayElev = antennaElev + raySlope * p.d;
                    if (p.groundElev > rayElev) { lostAt = p.d; break; }
                }
                return { pts, lostAt, antennaElev, targetElevEnd, centerElev };
            }
            function truncateLOSPoints(pts, lostAt) {
                if (lostAt === null) return pts;
                const out = pts.filter(p => p.d <= lostAt);
                if (out.length === 0 || out[out.length - 1].d < lostAt) {
                    for (let k = 1; k < pts.length; k++) {
                        const a = pts[k - 1], b = pts[k];
                        if (a.d <= lostAt && b.d >= lostAt) {
                            const t = (lostAt - a.d) / (b.d - a.d || 1);
                            out.push({ lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t, d: lostAt });
                            break;
                        }
                    }
                }
                return out;
            }
            function buildLOSLayers(node, highlightBearing) {
                if (!node.meta.lat || !node.meta.lng) return [];
                const center = L.latLng(node.meta.lat, node.meta.lng);
                const radius = node.meta.radius || 10000;
                const numLines = node.meta.numLines || 36;
                const centerHeight = node.meta.centerHeight || 30;
                const targetHeight = node.meta.targetHeight || 2;
                const contourInterval = node.meta.contourInterval || 0;
                const color = node.meta.color || '#ea580c';
                const centerElev = getElevation(center.lat, center.lng);
                const layers = [];
                if (contourInterval > 0 && terrainStore.size > 0) {
                    const contourLines = buildTopographicContours(center, radius, contourInterval, color);
                    contourLines.forEach(line => layers.push(line));
                }
                layers.push(L.circleMarker(center, { radius: 6, color: 'white', weight: 2, fillColor: color, fillOpacity: 1 }));
                layers.push(L.circle(center, { radius: radius, color: color, weight: 1.5, dashArray: '6,4', fill: false, opacity: 0.7 }));
                for (let i = 0; i < numLines; i++) {
                    const bearing = (360 / numLines) * i;
                    const isHighlighted = highlightBearing !== undefined && Math.abs(bearing - highlightBearing) < 0.01;
                    const geo = losLineGeometry(node, bearing);
                    if (geo.pts.length < 2) continue;
                    const drawPts = truncateLOSPoints(geo.pts, geo.lostAt);
                    const coords = drawPts.map(p => [p.lat, p.lng]);
                    if (coords.length < 2) continue;
                    layers.push(L.polyline(coords, { color: isHighlighted ? '#facc15' : color, weight: isHighlighted ? 5 : 2, opacity: isHighlighted ? 1 : 0.85 }));
                }
                if (centerElev !== null) {
                    layers.push(L.circleMarker(center, { radius: 4, color: 'white', weight: 1.5, fillColor: '#166534', fillOpacity: 1 }));
                    layers.push(L.marker(center, {
                        icon: L.divIcon({
                            className: 'los-height-label',
                            html: `<div class="los-height-label-inner" style="background:#166534">⚡ ${Math.round(centerHeight)} m antenna</div>`,
                            iconSize: [120, 16], iconAnchor: [-8, 8]
                        }),
                        interactive: false, zIndexOffset: 2000
                    }));
                    const targetSample = losLineGeometry(node, 0);
                    if (targetSample.pts.length > 0) {
                        const lastPt = targetSample.pts[targetSample.pts.length - 1];
                        layers.push(L.circleMarker([lastPt.lat, lastPt.lng], { radius: 4, color: 'white', weight: 1.5, fillColor: '#ea580c', fillOpacity: 1 }));
                        layers.push(L.marker([lastPt.lat, lastPt.lng], {
                            icon: L.divIcon({
                                className: 'los-height-label',
                                html: `<div class="los-height-label-inner" style="background:#ea580c">🎯 ${Math.round(targetHeight)} m target</div>`,
                                iconSize: [120, 16], iconAnchor: [-8, 8]
                            }),
                            interactive: false, zIndexOffset: 2000
                        }));
                    }
                }
                return layers;
            }
            function buildTopographicContours(center, radius, interval, color) {
                const layers = [];
                const stepMeters = 50;
                const cosLat = Math.cos(center.lat * Math.PI / 180);
                const nSteps = Math.ceil(radius / stepMeters);
                if (nSteps < 4) return [];
                const grid = [];
                for (let j = 0; j <= nSteps; j++) {
                    const row = [];
                    for (let i = 0; i <= nSteps; i++) {
                        const dx = (i - nSteps/2) * stepMeters;
                        const dy = (j - nSteps/2) * stepMeters;
                        if (dx*dx + dy*dy > radius*radius) { row.push(null); continue; }
                        const lat = center.lat + dy / 111320;
                        const lng = center.lng + dx / (111320 * cosLat);
                        row.push(getElevation(lat, lng));
                    }
                    grid.push(row);
                }
                let minE = Infinity, maxE = -Infinity;
                for (const row of grid) for (const e of row) {
                    if (e !== null) { if (e < minE) minE = e; if (e > maxE) maxE = e; }
                }
                if (!isFinite(minE) || !isFinite(maxE)) return [];
                const startLevel = Math.ceil(minE / interval) * interval;
                const endLevel = Math.floor(maxE / interval) * interval;
                const toLat = (jj) => center.lat + ((jj - nSteps/2) * stepMeters) / 111320;
                const toLng = (ii) => center.lng + ((ii - nSteps/2) * stepMeters) / (111320 * cosLat);
                for (let level = startLevel; level <= endLevel; level += interval) {
                    const segments = [];
                    for (let j = 0; j < nSteps; j++) {
                        for (let i = 0; i < nSteps; i++) {
                            const tl = grid[j][i], tr = grid[j][i+1], bl = grid[j+1][i], br = grid[j+1][i+1];
                            if (tl === null || tr === null || bl === null || br === null) continue;
                            const idx = (tl > level ? 8 : 0) | (tr > level ? 4 : 0) | (br > level ? 2 : 0) | (bl > level ? 1 : 0);
                            if (idx === 0 || idx === 15) continue;
                            function interp(v1, v2, level) { if (v1 === v2) return 0.5; return (level - v1) / (v2 - v1); }
                            const pts = [];
                            if ((idx & 8) !== (idx & 4)) { const t = interp(tl, tr, level); pts.push([toLat(j), toLng(i + t)]); }
                            if ((idx & 4) !== (idx & 2)) { const t = interp(tr, br, level); pts.push([toLat(j + t), toLng(i + 1)]); }
                            if ((idx & 2) !== (idx & 1)) { const t = interp(br, bl, level); pts.push([toLat(j + 1), toLng(i + 1 - t)]); }
                            if ((idx & 1) !== (idx & 8)) { const t = interp(bl, tl, level); pts.push([toLat(j + 1 - t), toLng(i)]); }
                            if (pts.length >= 2) segments.push([pts[0], pts[1]]);
                        }
                    }
                    if (segments.length > 0) {
                        layers.push(L.polyline(segments, { color, weight: 1, opacity: 0.5, dashArray: '3,3', interactive: false }));
                        const mid = segments[0];
                        const labelLat = (mid[0][0] + mid[1][0]) / 2;
                        const labelLng = (mid[0][1] + mid[1][1]) / 2;
                        layers.push(L.marker([labelLat, labelLng], {
                            icon: L.divIcon({
                                className: 'los-contour-label',
                                html: `<div class="los-contour-label-inner">${level} m</div>`,
                                iconSize: [40, 16], iconAnchor: [20, 8]
                            }),
                            interactive: false, zIndexOffset: -100
                        }));
                    }
                }
                return layers;
            }
            let losHighlightLayer = null;
            function setLOSHighlight(node, bearingDeg) {
                if (losHighlightLayer) { map.removeLayer(losHighlightLayer); losHighlightLayer = null; }
                if (!node || bearingDeg === undefined || bearingDeg === null) return;
                const geo = losLineGeometry(node, bearingDeg);
                if (geo.pts.length < 2) return;
                const drawPts = truncateLOSPoints(geo.pts, geo.lostAt);
                const coords = drawPts.map(p => [p.lat, p.lng]);
                if (coords.length < 2) return;
                losHighlightLayer = L.polyline(coords, { color: '#facc15', weight: 6, opacity: 0.95, lineCap: 'round', lineJoin: 'round' }).addTo(map);
                losHighlightLayer.bringToFront();
            }

            // ==================== DISTANCE / AREA ====================
            function haversine(a, b) {
                const R = 6371000;
                const φ1 = a.lat * Math.PI / 180, φ2 = b.lat * Math.PI / 180;
                const Δφ = (b.lat - a.lat) * Math.PI / 180;
                const Δλ = (b.lng - a.lng) * Math.PI / 180;
                const s = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
                return 2 * R * Math.asin(Math.sqrt(s));
            }
            function pathDistance(latlngs) {
                let total = 0;
                for (let i = 1; i < latlngs.length; i++) total += haversine(latlngs[i-1], latlngs[i]);
                return total;
            }
            function polygonArea(latlngs) {
                if (latlngs.length < 3) return 0;
                const R = 6371000;
                let area = 0;
                for (let i = 0; i < latlngs.length; i++) {
                    const p1 = latlngs[i], p2 = latlngs[(i + 1) % latlngs.length];
                    area += (p2.lng - p1.lng) * Math.PI / 180 * (2 + Math.sin(p1.lat * Math.PI / 180) + Math.sin(p2.lat * Math.PI / 180));
                }
                return Math.abs(area * R * R / 2);
            }
            function formatDistance(m) { if (m < 1000) return `${m.toFixed(1)} m`; return `${(m / 1000).toFixed(3)} km`; }
            function formatArea(m2) {
                if (m2 < 1e6) return `${m2.toFixed(0)} m²`;
                if (m2 < 1e10) return `${(m2 / 1e6).toFixed(3)} km²`;
                return `${(m2 / 1e6).toExponential(2)} km²`;
            }

            // ==================== KML IMPORT / EXPORT ====================
            kmlInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || !files.length) return;
                for (const file of files) {
                    try {
                        const text = await file.text();
                        await importKML(text, file.name);
                    } catch (err) {
                        console.error(err);
                        showToast(`KML error: ${file.name}`, 'fa-exclamation-circle');
                    }
                }
                await persistTree();
                kmlInput.value = '';
            });
            async function importKML(text, filename) {
                const parser = new DOMParser();
                let doc;
                try { doc = parser.parseFromString(text, 'text/xml'); }
                catch (err) { showToast('Invalid KML', 'fa-exclamation-circle'); return; }
                if (doc.querySelector('parsererror')) { showToast('KML parse error', 'fa-exclamation-circle'); return; }
                if (!doc.querySelector('kml')) { showToast('Not a KML file', 'fa-exclamation-circle'); return; }
                const placemarks = doc.querySelectorAll('Placemark');
                if (!placemarks.length) { showToast('No placemarks', 'fa-info-circle'); return; }
                const parent = currentFolderId ? findNode(currentFolderId) : null;
                const folderName = filename.replace(/\.(kml|kmz)$/i, '');
                const kmlFolder = createNode({ type: 'folder', name: folderName, expanded: true, children: [], meta: { color: '#4d7c0f', desc: 'Imported from ' + filename } });
                let count = 0;
                placemarks.forEach((pm, idx) => {
                    const nameEl = pm.querySelector('name');
                    const descEl = pm.querySelector('description');
                    const name = nameEl ? nameEl.textContent.trim() : `Placemark ${idx + 1}`;
                    const desc = descEl ? descEl.textContent.trim() : '';
                    const point = pm.querySelector('Point coordinates');
                    if (point) {
                        const coords = parseKMLCoords(point.textContent);
                        if (coords.length) {
                            const [lng, lat] = coords[0];
                            const marker = L.marker([lat, lng], { icon: makeLeafletIcon(DEFAULT_ICON, '#4d7c0f') });
                            marker.bindPopup(`<b>${escapeHtml(name)}</b>${desc ? '<br>' + escapeHtml(desc) : ''}`);
                            drawnItems.addLayer(marker);
                            const newNode = createNode({ type: 'placemark', name, layer: marker, meta: { desc, lat, lng, kml: true, icon: DEFAULT_ICON, color: '#4d7c0f' } });
                            bindLayerFocus(newNode, marker);
                            attachLayerDrag(newNode, marker);
                            kmlFolder.children.push(newNode);
                            count++;
                        }
                    }
                    const lineEl = pm.querySelector('LineString coordinates');
                    if (lineEl) {
                        const coords = parseKMLCoords(lineEl.textContent);
                        if (coords.length >= 2) {
                            const latlngs = coords.map(c => [c[1], c[0]]);
                            const line = L.polyline(latlngs, { color: '#4d7c0f', weight: 3 });
                            line.bindPopup(`<b>${escapeHtml(name)}</b>`);
                            drawnItems.addLayer(line);
                            const newNode = createNode({ type: 'path', name, layer: line, meta: { desc, points: latlngs, kml: true, color: '#4d7c0f', lineThickness: 3 } });
                            bindLayerFocus(newNode, line);
                            attachLayerDrag(newNode, line);
                            kmlFolder.children.push(newNode);
                            count++;
                        }
                    }
                    const polyEl = pm.querySelector('Polygon outerBoundaryIs LinearRing coordinates');
                    if (polyEl) {
                        const coords = parseKMLCoords(polyEl.textContent);
                        if (coords.length >= 3) {
                            const latlngs = coords.map(c => [c[1], c[0]]);
                            const poly = L.polygon(latlngs, { color: '#4d7c0f', weight: 2, fillOpacity: 0.15 });
                            poly.bindPopup(`<b>${escapeHtml(name)}</b>`);
                            drawnItems.addLayer(poly);
                            const newNode = createNode({ type: 'polygon', name, layer: poly, meta: { desc, points: latlngs, kml: true, color: '#4d7c0f', lineThickness: 2 } });
                            bindLayerFocus(newNode, poly);
                            attachLayerDrag(newNode, poly);
                            kmlFolder.children.push(newNode);
                            count++;
                        }
                    }
                });
                if (count > 0) {
                    if (parent) addNodeToTree(kmlFolder, parent); else addNodeToTree(kmlFolder);
                    const bounds = L.latLngBounds([]);
                    kmlFolder.children.forEach(c => {
                        if (c.layer) {
                            if (c.layer.getBounds) { try { bounds.extend(c.layer.getBounds()); } catch(e){} }
                            else if (c.layer.getLatLng) bounds.extend(c.layer.getLatLng());
                        }
                    });
                    if (bounds.isValid()) setTimeout(() => map.flyToBounds(bounds, { ...availableMapPadding(), duration: 1.2, maxZoom: 16 }), 100);
                    showToast(`Imported ${count} items`, 'fa-file-import');
                } else showToast('No importable geometries', 'fa-info-circle');
            }
            function parseKMLCoords(text) {
                if (!text) return [];
                return text.trim().split(/\s+/).map(p => p.split(',').map(parseFloat)).filter(b => b.length >= 2 && !isNaN(b[0]) && !isNaN(b[1]));
            }
            function exportKMLAll() {
                const lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<kml xmlns="http://www.opengis.net/kml/2.2">', '<Document>'];
                lines.push(`<name>Telco Earth Export</name>`);
                treeNodes.forEach(n => writeKMLNode(n, lines, 1));
                lines.push('</Document>', '</kml>');
                downloadFile(lines.join('\n'), 'telco-earth-export.kml', 'application/vnd.google-earth.kml+xml');
                showToast('KML exported', 'fa-file-export');
            }
            function exportKMLNode(node) {
                const lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<kml xmlns="http://www.opengis.net/kml/2.2">', '<Document>'];
                lines.push(`<name>${escapeXml(node.name)}</name>`);
                writeKMLNode(node, lines, 1);
                lines.push('</Document>', '</kml>');
                const safe = node.name.replace(/[^a-z0-9\-_]/gi, '_') || 'export';
                downloadFile(lines.join('\n'), `${safe}.kml`, 'application/vnd.google-earth.kml+xml');
                showToast('KML exported', 'fa-file-export');
            }
            function writeKMLNode(node, lines, indent) {
                const pad = '  '.repeat(indent);
                if (node.type === 'folder' || node.type === 'kml') {
                    lines.push(`${pad}<Folder><name>${escapeXml(node.name)}</name>`);
                    if (node.meta.desc) lines.push(`${pad}  <description>${escapeXml(node.meta.desc)}</description>`);
                    if (node.children) node.children.forEach(c => writeKMLNode(c, lines, indent + 1));
                    lines.push(`${pad}</Folder>`);
                } else if (node.type === 'placemark' && node.meta.lat != null) {
                    lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                    if (node.meta.desc) lines.push(`${pad}  <description>${escapeXml(node.meta.desc)}</description>`);
                    lines.push(`${pad}  <Point><coordinates>${node.meta.lng},${node.meta.lat},0</coordinates></Point>`);
                    lines.push(`${pad}</Placemark>`);
                } else if ((node.type === 'path' || node.type === 'measure') && node.meta.points) {
                    lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                    lines.push(`${pad}  <LineString><coordinates>`);
                    node.meta.points.forEach(p => lines.push(`${pad}    ${p[1]},${p[0]},0`));
                    lines.push(`${pad}  </coordinates></LineString></Placemark>`);
                } else if ((node.type === 'polygon' || node.type === 'measure-area') && node.meta.points) {
                    lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                    lines.push(`${pad}  <Polygon><outerBoundaryIs><LinearRing><coordinates>`);
                    node.meta.points.forEach(p => lines.push(`${pad}    ${p[1]},${p[0]},0`));
                    lines.push(`${pad}  </coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`);
                } else if (node.type === 'los' && node.meta.lat != null) {
                    lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                    if (node.meta.desc) lines.push(`${pad}  <description>${escapeXml(node.meta.desc)}</description>`);
                    lines.push(`${pad}  <Point><coordinates>${node.meta.lng},${node.meta.lat},0</coordinates></Point>`);
                    lines.push(`${pad}</Placemark>`);
                }
            }
            function exportGPX(node) {
                const now = new Date().toISOString();
                const lines = ['<?xml version="1.0" encoding="UTF-8"?>',
                    '<gpx version="1.1" creator="Telco Earth" xmlns="http://www.topografix.com/GPX/1/1">',
                    `  <metadata><name>${escapeXml(node.name)}</name><time>${now}</time></metadata>`];
                function addWaypoint(n) {
                    lines.push(`  <wpt lat="${n.meta.lat}" lon="${n.meta.lng}">`);
                    lines.push(`    <name>${escapeXml(n.name)}</name>`);
                    if (n.meta.desc) lines.push(`    <desc>${escapeXml(n.meta.desc)}</desc>`);
                    lines.push(`  </wpt>`);
                }
                function addTrack(n) {
                    lines.push(`  <trk><name>${escapeXml(n.name)}</name>`);
                    if (n.meta.desc) lines.push(`    <desc>${escapeXml(n.meta.desc)}</desc>`);
                    lines.push(`    <trkseg>`);
                    n.meta.points.forEach(p => lines.push(`      <trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`));
                    lines.push(`    </trkseg></trk>`);
                }
                function walk(n) {
                    if (n.type === 'placemark' && n.meta.lat != null) addWaypoint(n);
                    else if ((n.type === 'path' || n.type === 'measure') && n.meta.points) addTrack(n);
                    else if ((n.type === 'polygon' || n.type === 'measure-area') && n.meta.points) {
                        const closed = { ...n, meta: { ...n.meta, points: n.meta.points.concat([n.meta.points[0]]) } };
                        addTrack(closed);
                    }
                    if (n.children) n.children.forEach(walk);
                }
                walk(node);
                lines.push('</gpx>');
                const safe = node.name.replace(/[^a-z0-9\-_]/gi, '_') || 'export';
                downloadFile(lines.join('\n'), `${safe}.gpx`, 'application/gpx+xml');
                showToast('GPX exported', 'fa-file-export');
            }
            function exportGPXAll() { exportGPX({ name: 'Telco Earth export', type: 'folder', children: treeNodes, meta: {} }); }
            function downloadFile(content, filename, mime) {
                const blob = new Blob([content], { type: mime });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 3000);
            }

            // ==================== HGT TERRAIN ====================
            const terrainStore = new Map();
            const visibleTiles = new Set();
            const heatmapCache = new Map();
            let showAllHeatmaps = false;
            function syncShowAllState() { showAllHeatmaps = (terrainStore.size > 0 && visibleTiles.size === terrainStore.size); }

            const elevCard = document.getElementById('elev-card');
            const elevValue = document.getElementById('elev-value');
            const coordLat = document.getElementById('coord-lat');
            const coordLng = document.getElementById('coord-lng');
            const elevHint = document.getElementById('elev-hint');
            const terrainStatusEl = document.getElementById('terrain-status');

            function parseHgtArrayBuffer(arrayBuffer) {
                const byteLength = arrayBuffer.byteLength;
                const totalSamples = byteLength / 2;
                const dim = Math.round(Math.sqrt(totalSamples));
                if (dim * dim * 2 !== byteLength) throw new Error(`Bad HGT size: ${byteLength}`);
                const width = dim, height = dim;
                const data = new Int16Array(totalSamples);
                const view = new DataView(arrayBuffer);
                for (let i = 0; i < totalSamples; i++) data[i] = view.getInt16(i * 2, false);
                return { data, width, height };
            }
            function getKeyFromFilename(name) {
                const base = name.replace(/\.[^/.]+$/, '').toUpperCase();
                return base.match(/^([NS])(\d{2})([EW])(\d{3})$/) ? base : null;
            }
            function parseKey(key) {
                const latSign = key[0] === 'N' ? 1 : -1;
                const latVal = parseInt(key.substring(1, 3), 10) * latSign;
                const lngSign = key[3] === 'E' ? 1 : -1;
                const lngVal = parseInt(key.substring(4, 7), 10) * lngSign;
                return { lat: latVal, lng: lngVal };
            }
            function getElevationFromTile(tile, lat, lng) {
                const { data, width, height } = tile;
                const { lat: swLat, lng: swLng } = parseKey(tile.key);
                let fLat = lat - swLat, fLng = lng - swLng;
                if (fLat < 0 || fLat > 1 || fLng < 0 || fLng > 1) return null;
                const row = Math.round((1 - fLat) * (height - 1));
                const col = Math.round(fLng * (width - 1));
                if (row < 0 || row >= height || col < 0 || col >= width) return null;
                const v = data[row * width + col];
                if (v === -32768 || v < -1000 || v > 9000) return null;
                return v;
            }
            function getElevation(lat, lng) {
                if (terrainStore.size === 0) return null;
                let normLng = lng;
                while (normLng < -180) normLng += 360;
                while (normLng > 180) normLng -= 360;
                const tileLat = Math.floor(lat);
                const tileLng = Math.floor(normLng);
                const latKeyChar = tileLat >= 0 ? 'N' : 'S';
                const lngKeyChar = tileLng >= 0 ? 'E' : 'W';
                const latVal = Math.abs(tileLat).toString().padStart(2, '0');
                const lngVal = Math.abs(tileLng).toString().padStart(3, '0');
                const key = `${latKeyChar}${latVal}${lngKeyChar}${lngVal}`;
                if (terrainStore.has(key)) return getElevationFromTile(terrainStore.get(key), lat, normLng);
                return null;
            }
            function updateTerrainDisplay(lat, lng) {
                if (terrainStore.size === 0) return;
                coordLat.textContent = `lat ${lat.toFixed(5)}°`;
                coordLng.textContent = `lng ${lng.toFixed(5)}°`;
                const elev = getElevation(lat, lng);
                if (elev === null || isNaN(elev)) {
                    elevValue.innerHTML = `— <small>m</small>`;
                    elevHint.textContent = 'No data for this location';
                } else {
                    elevValue.innerHTML = `${Math.round(elev)} <small>m</small>`;
                    elevHint.textContent = `${terrainStore.size} tile(s) loaded`;
                }
            }
            function updateTerrainVisibility() {
                if (terrainStore.size > 0) {
                    elevCard.classList.remove('hidden');
                    terrainStatusEl.classList.add('loaded');
                    terrainStatusEl.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem;"></i> ${terrainStore.size} tile(s)`;
                } else {
                    elevCard.classList.add('hidden');
                    terrainStatusEl.classList.remove('loaded');
                    terrainStatusEl.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem; color: var(--ink-3);"></i> No terrain loaded`;
                }
            }
            fileInput.addEventListener('change', async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                let loaded = 0;
                const loadedKeys = [];
                for (const file of files) {
                    const key = getKeyFromFilename(file.name);
                    if (!key) continue;
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const parsed = parseHgtArrayBuffer(arrayBuffer);
                        terrainStore.set(key, { data: parsed.data, width: parsed.width, height: parsed.height, key });
                        await persistTile(key, arrayBuffer.slice(0), parsed.width, parsed.height);
                        loaded++; loadedKeys.push(key);
                    } catch (err) { console.error(err); }
                }
                if (loaded > 0) {
                    let terrainFolder = findNodeByName('Terrain (HGT)');
                    if (!terrainFolder) {
                        terrainFolder = createNode({ type: 'folder', name: 'Terrain (HGT)', expanded: true, children: [], meta: { color: '#10b981' } });
                        addNodeToTree(terrainFolder);
                    }
                    loadedKeys.forEach(k => {
                        const existing = terrainFolder.children.find(c => c.meta && c.meta.key === k);
                        if (!existing) terrainFolder.children.push(createNode({ type: 'terrain', name: k, layer: null, meta: { key: k, color: '#10b981' } }));
                        visibleTiles.add(k);
                    });
                    recomputeGlobalScale();
                    syncShowAllState();
                    updateTerrainVisibility();
                    redrawTerrainOverlays();
                    if (activeSection === 'terrain') renderStaticSection('terrain');
                    else renderTree();
                    await persistTree();
                    showToast(`${loaded} HGT tile(s) loaded`, 'fa-mountain');
                } else showToast('No valid HGT files', 'fa-exclamation-circle');
                const c = map._lastMouseLatLng || map.getCenter();
                updateTerrainDisplay(c.lat, c.lng);
                fileInput.value = '';
            });
            function persistTile(key, arrayBuffer, width, height) {
                return dbPut('terrain', { key, buffer: arrayBuffer, width, height, ts: Date.now() }).catch(() => {});
            }
            async function loadPersistedTiles() {
                try {
                    const all = await dbGetAll('terrain');
                    if (!all.length) return;
                    for (const rec of all) {
                        try {
                            const parsed = parseHgtArrayBuffer(rec.buffer);
                            terrainStore.set(rec.key, { data: parsed.data, width: parsed.width, height: parsed.height, key: rec.key });
                            visibleTiles.add(rec.key);
                        } catch (e) { console.warn('Bad stored tile', rec.key); }
                    }
                    if (terrainStore.size) {
                        recomputeGlobalScale();
                        syncShowAllState();
                        updateTerrainVisibility();
                        redrawTerrainOverlays();
                        showToast(`Restored ${terrainStore.size} HGT tile(s)`, 'fa-database');
                    }
                } catch (e) { console.warn('loadPersistedTiles failed', e); }
            }
            let globalMin = 0, globalMax = 0;
            function recomputeGlobalScale() {
                let minV = Infinity, maxV = -Infinity;
                for (const [, tile] of terrainStore) {
                    const stats = computeTileStats(tile);
                    if (stats.min < minV) minV = stats.min;
                    if (stats.max > maxV) maxV = stats.max;
                }
                if (!isFinite(minV)) { minV = 0; maxV = 0; }
                if (maxV <= minV) maxV = minV + 1;
                globalMin = minV; globalMax = maxV;
                heatmapCache.clear();
            }
            map.on('move', () => {
                if (!map._lastMouseLatLng) {
                    const c = map.getCenter();
                    updateTerrainDisplay(c.lat, c.lng);
                }
            });
            function toggleTileVisibility(key) {
                if (visibleTiles.has(key)) visibleTiles.delete(key);
                else visibleTiles.add(key);
                syncShowAllState();
                redrawTerrainOverlays();
            }
            function buildTileBorderLayers() {
                const layerGroup = L.layerGroup();
                const edges = new Map();
                function canonicalEdge(a, b) {
                    const ak = a[0].toFixed(6) + ',' + a[1].toFixed(6);
                    const bk = b[0].toFixed(6) + ',' + b[1].toFixed(6);
                    if (ak < bk) return { key: ak + '|' + bk, a, b };
                    return { key: bk + '|' + ak, a: b, b: a };
                }
                visibleTiles.forEach(key => {
                    const sw = parseKey(key);
                    const s = [sw.lat, sw.lng];
                    const se = [sw.lat, sw.lng + 1];
                    const ne = [sw.lat + 1, sw.lng + 1];
                    const nw = [sw.lat + 1, sw.lng];
                    const corners = [s, se, ne, nw, s];
                    for (let i = 0; i < 4; i++) {
                        const e = canonicalEdge(corners[i], corners[i + 1]);
                        if (!edges.has(e.key)) edges.set(e.key, { a: e.a, b: e.b });
                    }
                });
                edges.forEach(({ a, b }) => {
                    layerGroup.addLayer(L.polyline([a, b], { color: '#10b981', weight: 1.5, opacity: 0.85, interactive: false, pane: 'terrainPane' }));
                });
                return layerGroup;
            }
            function redrawTerrainOverlays() {
                terrainOverlayGroup.clearLayers();
                if (visibleTiles.size > 0) {
                    visibleTiles.forEach(key => {
                        const tile = terrainStore.get(key);
                        if (!tile) return;
                        const layers = buildTerrainOverlayLayers(tile);
                        layers.forEach(l => terrainOverlayGroup.addLayer(l));
                    });
                    terrainOverlayGroup.addLayer(buildTileBorderLayers());
                }
                if (drawnItems.bringToFront) drawnItems.bringToFront();
            }
            function computeTileStats(tile) {
                if (tile._stats) return tile._stats;
                const data = tile.data;
                let minV = 32767, maxV = -32768;
                const step = (tile.width >= 3600) ? 8 : (tile.width >= 1200 ? 4 : 1);
                for (let i = 0; i < data.length; i += step) {
                    const v = data[i];
                    if (v > 0 && v < 9000) { if (v < minV) minV = v; if (v > maxV) maxV = v; }
                }
                if (minV > maxV) { minV = 0; maxV = 0; }
                tile._stats = { min: minV, max: maxV };
                return tile._stats;
            }
            function buildHeatmapCanvasForTile(tile) {
                const minV = globalMin;
                const maxV = globalMax;
                const range = Math.max(1, maxV - minV);
                const scheme = HEATMAP_SCHEMES[currentSchemeKey];
                const SIZE = 1024;
                const canvas = document.createElement('canvas');
                canvas.width = SIZE; canvas.height = SIZE;
                const ctx = canvas.getContext('2d');
                const data = tile.data;
                const w = tile.width, h = tile.height;
                const img = ctx.createImageData(SIZE, SIZE);
                const px = img.data;
                for (let y = 0; y < SIZE; y++) {
                    const srcY = Math.floor((y / SIZE) * (h - 1));
                    for (let x = 0; x < SIZE; x++) {
                        const srcX = Math.floor((x / SIZE) * (w - 1));
                        const v = data[srcY * w + srcX];
                        const idx = (y * SIZE + x) * 4;
                        if (v === -32768 || v <= 0 || v > 9000) { px[idx + 3] = 0; continue; }
                        const t = (v - minV) / range;
                        const c = scheme.color(t);
                        px[idx] = c[0]; px[idx+1] = c[1]; px[idx+2] = c[2];
                        px[idx+3] = c[3] !== undefined ? c[3] : 210;
                    }
                }
                ctx.putImageData(img, 0, 0);
                return canvas;
            }
            function getOrCreateHeatmap(tile) {
                const cacheKey = tile.key + '|' + currentSchemeKey + '|' + globalMin + '|' + globalMax;
                if (heatmapCache.has(cacheKey)) return heatmapCache.get(cacheKey);
                const canvas = buildHeatmapCanvasForTile(tile);
                const stats = computeTileStats(tile);
                const entry = { canvas, min: stats.min, max: stats.max };
                heatmapCache.set(cacheKey, entry);
                return entry;
            }
            function buildTerrainOverlayLayers(tile) {
                const key = tile.key;
                const sw = parseKey(key);
                const tileBounds = [[sw.lat, sw.lng], [sw.lat + 1, sw.lng + 1]];
                const heat = getOrCreateHeatmap(tile);
                const dataURL = heat.canvas.toDataURL('image/png');
                const overlay = L.imageOverlay(dataURL, tileBounds, {
                    opacity: 0.85, interactive: true, className: 'hgt-heat-canvas', zIndex: 400, pane: 'terrainPane'
                });
                overlay.bindTooltip(`<b>${escapeHtml(key)}</b><br>Tile: ${heat.min}–${heat.max} m<br>Shared scale: ${globalMin}–${globalMax} m`, { sticky: true, direction: 'top' });
                return [overlay];
            }

            // ==================== PATH PROFILE ====================
            const profilePanel = document.getElementById('profile-panel');
            const profileCanvas = document.getElementById('profile-canvas');
            const profileTitle = document.getElementById('profile-title');
            const profileSubtitle = document.getElementById('profile-subtitle');
            const profileStats = document.getElementById('profile-stats');
            const profileHover = document.getElementById('profile-hover');
            const profileHint = document.getElementById('profile-hint');
            const profileLineSelector = document.getElementById('profile-line-selector');
            const profileLineSelect = document.getElementById('profile-line-select');

            const profilePinsGroup = L.featureGroup().addTo(map);
            let profileData = null;
            let profileHoverSample = null;
            let profileHoverMarker = null;

            function clearProfileMarkers() {
                if (profileHoverMarker) { map.removeLayer(profileHoverMarker); profileHoverMarker = null; }
                profileHoverSample = null;
                profileHover.classList.remove('show');
            }
            function clearProfilePins() { profilePinsGroup.clearLayers(); }

            function openProfilePanel(node) {
                if (!node || !node.meta.points || node.meta.points.length < 2) { showToast('No geometry to profile', 'fa-info-circle'); return; }
                if (terrainStore.size === 0) { showToast('Load HGT data first', 'fa-exclamation-circle'); return; }
                clearProfileMarkers();
                clearProfilePins();
                profileLineSelector.classList.remove('show');
                const latlngs = node.meta.points.map(p => L.latLng(p[0], p[1]));
                const stepMeters = 20;
                const samples = [];
                let totalDist = 0;
                for (let i = 0; i < latlngs.length - 1; i++) {
                    const a = latlngs[i], b = latlngs[i + 1];
                    const segLen = haversine(a, b);
                    const n = Math.max(1, Math.ceil(segLen / stepMeters));
                    for (let k = 0; k < n; k++) {
                        const t = k / n;
                        const lat = a.lat + (b.lat - a.lat) * t;
                        const lng = a.lng + (b.lng - a.lng) * t;
                        const elev = getElevation(lat, lng);
                        if (elev !== null && !isNaN(elev)) samples.push({ d: totalDist, lat, lng, elev });
                        totalDist += segLen / n;
                    }
                }
                const last = latlngs[latlngs.length - 1];
                const lastElev = getElevation(last.lat, last.lng);
                if (lastElev !== null && !isNaN(lastElev)) samples.push({ d: totalDist, lat: last.lat, lng: last.lng, elev: lastElev });
                if (samples.length < 2) { showToast('Not enough terrain data along this path', 'fa-exclamation-circle'); return; }
                let minE = Infinity, maxE = -Infinity;
                samples.forEach(s => { if (s.elev < minE) minE = s.elev; if (s.elev > maxE) maxE = s.elev; });
                let gain = 0, loss = 0;
                for (let i = 1; i < samples.length; i++) {
                    const d = samples[i].elev - samples[i - 1].elev;
                    if (d > 0) gain += d; else loss -= d;
                }
                profileData = { type: 'path', node, samples, minE, maxE, gain, loss, totalDist };
                profileTitle.childNodes[0].nodeValue = node.name + ' ';
                profileSubtitle.textContent = `${formatDistance(totalDist)} · ${samples.length} samples`;
                profileStats.innerHTML = `
                    <span>Min <strong>${Math.round(minE)} m</strong></span>
                    <span>Max <strong>${Math.round(maxE)} m</strong></span>
                    <span>Gain <strong>+${Math.round(gain)} m</strong></span>
                    <span>Loss <strong>-${Math.round(loss)} m</strong></span>
                `;
                profileHint.textContent = 'Hover to preview · click to place a marker';
                profilePanel.classList.add('open');
                updateMapToolsVisibility();
                setTimeout(() => drawProfileChart(), 320);
            }
            function openLOSProfile(node) {
                if (!node || node.type !== 'los') { showToast('Not a LOS object', 'fa-exclamation-circle'); return; }
                if (terrainStore.size === 0) { showToast('Load HGT data first', 'fa-exclamation-circle'); return; }
                clearProfileMarkers();
                clearProfilePins();
                const numLines = node.meta.numLines || 36;
                const options = [];
                for (let i = 0; i < numLines; i++) {
                    const b = (360 / numLines) * i;
                    options.push(`<option value="${b}">${String(Math.round(b)).padStart(3, '0')}°</option>`);
                }
                profileLineSelect.innerHTML = options.join('');
                profileLineSelector.classList.add('show');
                profileLineSelect.value = '0';
                setLOSHighlight(node, 0);
                profileLineSelect.onchange = () => {
                    const bearing = parseFloat(profileLineSelect.value);
                    setLOSHighlight(node, bearing);
                    renderLOSProfile(node, bearing);
                };
                profileTitle.childNodes[0].nodeValue = node.name + ' ';
                profileSubtitle.textContent = `Radius ${node.meta.radius || 10000} m · ${numLines} lines`;
                profileHint.textContent = 'Hover to preview · click to place a marker';
                profilePanel.classList.add('open');
                updateMapToolsVisibility();
                renderLOSProfile(node, 0);
                setTimeout(() => drawProfileChart(), 320);
            }
            function renderLOSProfile(node, bearingDeg) {
                const geo = losLineGeometry(node, bearingDeg);
                if (geo.pts.length < 2) { showToast('No terrain data along this bearing', 'fa-exclamation-circle'); return; }
                const samples = geo.pts.map(p => ({ d: p.d, lat: p.lat, lng: p.lng, elev: p.groundElev, targetElev: p.targetElev }));
                let minE = Infinity, maxE = -Infinity;
                samples.forEach(s => {
                    if (s.elev != null && s.elev < minE) minE = s.elev;
                    if (s.elev != null && s.elev > maxE) maxE = s.elev;
                    if (s.targetElev != null && s.targetElev > maxE) maxE = s.targetElev;
                });
                if (geo.antennaElev != null && geo.antennaElev > maxE) maxE = geo.antennaElev;
                if (minE === Infinity) minE = 0;
                if (maxE === -Infinity) maxE = 100;
                const padding = Math.max(20, (maxE - minE) * 0.1);
                minE = Math.floor(minE - padding);
                maxE = Math.ceil(maxE + padding);
                const totalDist = samples.length > 0 ? samples[samples.length - 1].d : 0;
                const antennaElev = geo.antennaElev;
                const targetElevAtEnd = geo.targetElevEnd;
                const raySlope = (targetElevAtEnd - antennaElev) / totalDist;
                const losSegments = [];
                let currentSegment = { color: '#4d7c0f', points: [] };
                losSegments.push(currentSegment);
                samples.forEach((s) => {
                    const rayElev = antennaElev + raySlope * s.d;
                    const terrainHere = s.elev != null ? s.elev : 0;
                    const blocked = terrainHere > rayElev;
                    const pt = { d: s.d, elev: rayElev, blocked };
                    const last = losSegments[losSegments.length - 1];
                    if (blocked && last.color === '#4d7c0f') {
                        losSegments.push({ color: '#dc2626', points: [last.points[last.points.length - 1]] });
                    } else if (!blocked && last.color === '#dc2626') {
                        losSegments.push({ color: '#4d7c0f', points: [last.points[last.points.length - 1]] });
                    }
                    losSegments[losSegments.length - 1].points.push(pt);
                });
                const cleanedSegments = losSegments.filter(seg => seg.points.length >= 2);
                profileData = {
                    type: 'los', node, bearing: bearingDeg, samples, minE, maxE,
                    totalDist, antennaElev, targetElevAtEnd,
                    losSegments: cleanedSegments, centerElev: geo.centerElev, lostAt: geo.lostAt
                };
                const lossText = geo.lostAt !== null ? `${Math.round(geo.lostAt)} m` : 'clear to edge';
                profileStats.innerHTML = `
                    <span>Antenna <strong>${Math.round(antennaElev)} m</strong></span>
                    <span>Target <strong>${Math.round(targetElevAtEnd)} m</strong></span>
                    <span>LOS lost at <strong>${lossText}</strong></span>
                `;
                drawProfileChart();
            }
            function drawProfileChart() {
                if (!profileData) return;
                const canvas = profileCanvas;
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) return;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                const ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                const W = rect.width, H = rect.height;
                ctx.clearRect(0, 0, W, H);
                const { samples, minE, maxE, totalDist } = profileData;
                const padL = 55, padR = 20, padT = 44, padB = 30;
                const plotW = W - padL - padR;
                const plotH = H - padT - padB;
                const range = Math.max(1, maxE - minE);
                ctx.fillStyle = '#fafaf7';
                ctx.fillRect(0, 0, W, H);
                ctx.strokeStyle = 'rgba(0,0,0,0.06)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 4; i++) {
                    const y = padT + (i / 4) * plotH;
                    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
                    const elev = maxE - (i / 4) * range;
                    ctx.fillStyle = '#6d7167';
                    ctx.font = '10px "IBM Plex Mono", monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText(Math.round(elev) + ' m', padL - 6, y + 3);
                }
                ctx.fillStyle = '#6d7167';
                ctx.font = '10px "IBM Plex Mono", monospace';
                ctx.textAlign = 'center';
                for (let i = 0; i <= 4; i++) {
                    const x = padL + (i / 4) * plotW;
                    const d = (i / 4) * totalDist;
                    ctx.fillText(formatDistance(d), x, H - 8);
                }
                const gradient = ctx.createLinearGradient(0, padT, 0, padT + plotH);
                gradient.addColorStop(0, 'rgba(77, 124, 15, 0.35)');
                gradient.addColorStop(1, 'rgba(77, 124, 15, 0.03)');
                ctx.beginPath();
                ctx.moveTo(padL, padT + plotH);
                for (const s of samples) {
                    if (s.elev == null) continue;
                    const x = padL + (s.d / totalDist) * plotW;
                    const y = padT + (1 - (s.elev - minE) / range) * plotH;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(padL + plotW, padT + plotH);
                ctx.closePath();
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.beginPath();
                let started = false;
                for (let i = 0; i < samples.length; i++) {
                    const s = samples[i];
                    if (s.elev == null) continue;
                    const x = padL + (s.d / totalDist) * plotW;
                    const y = padT + (1 - (s.elev - minE) / range) * plotH;
                    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
                }
                ctx.strokeStyle = '#4d7c0f';
                ctx.lineWidth = 2;
                ctx.stroke();
                if (profileData.type === 'los') {
                    const antX = padL;
                    const antY = padT + (1 - (profileData.antennaElev - minE) / range) * plotH;
                    ctx.beginPath(); ctx.arc(antX, antY, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#166534'; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#166534';
                    ctx.font = 'bold 10px "IBM Plex Mono", monospace';
                    ctx.textAlign = 'left';
                    ctx.fillText('ANT', antX + 10, antY + 3);
                    const endX = padL + plotW;
                    const endY = padT + (1 - (profileData.targetElevAtEnd - minE) / range) * plotH;
                    ctx.beginPath(); ctx.arc(endX, endY, 6, 0, Math.PI * 2);
                    ctx.fillStyle = '#ea580c'; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                    ctx.fillStyle = '#ea580c';
                    ctx.font = 'bold 10px "IBM Plex Mono", monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('TGT', endX - 10, endY + 3);
                    ctx.beginPath(); ctx.moveTo(antX, antY); ctx.lineTo(endX, endY);
                    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]); ctx.stroke(); ctx.setLineDash([]);
                    for (const seg of profileData.losSegments) {
                        ctx.beginPath();
                        let first = true;
                        for (const p of seg.points) {
                            const x = padL + (p.d / totalDist) * plotW;
                            const y = padT + (1 - (p.elev - minE) / range) * plotH;
                            if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
                        }
                        ctx.strokeStyle = seg.color; ctx.lineWidth = 2.5; ctx.stroke();
                    }
                }
                if (profileHoverSample) {
                    const s = profileHoverSample;
                    const x = padL + (s.d / totalDist) * plotW;
                    const y = padT + (1 - (s.elev - minE) / range) * plotH;
                    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#4d7c0f'; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke();
                }
                profilePinsGroup.eachLayer(m => {
                    const s = m._profileSample;
                    if (!s) return;
                    const x = padL + (s.d / totalDist) * plotW;
                    const y = padT + (1 - (s.elev - minE) / range) * plotH;
                    ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2);
                    ctx.fillStyle = '#ea580c'; ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.lineWidth = 2.5; ctx.stroke();
                });
            }
            function sampleAtCanvasX(x) {
                if (!profileData) return null;
                const rect = profileCanvas.getBoundingClientRect();
                const padL = 55, padR = 20;
                const plotW = rect.width - padL - padR;
                const t = (x - padL) / plotW;
                if (t < 0 || t > 1) return null;
                const targetDist = t * profileData.totalDist;
                let closest = null;
                let bestD = Infinity;
                for (const s of profileData.samples) {
                    if (s.elev == null) continue;
                    const d = Math.abs(s.d - targetDist);
                    if (d < bestD) { bestD = d; closest = s; }
                }
                return closest;
            }
            profileCanvas.addEventListener('mousemove', (e) => {
                if (!profileData) return;
                const rect = profileCanvas.getBoundingClientRect();
                const sample = sampleAtCanvasX(e.clientX - rect.left);
                if (!sample) {
                    profileHover.classList.remove('show');
                    if (profileHoverMarker) { map.removeLayer(profileHoverMarker); profileHoverMarker = null; }
                    profileHoverSample = null;
                    drawProfileChart();
                    return;
                }
                profileHoverSample = sample;
                profileHover.classList.add('show');
                profileHover.innerHTML = `
                    <div><strong>${Math.round(sample.elev)} m</strong></div>
                    <div>${sample.lat.toFixed(5)}, ${sample.lng.toFixed(5)}</div>
                    <div>at ${formatDistance(sample.d)}</div>
                `;
                if (profileHoverMarker) profileHoverMarker.setLatLng([sample.lat, sample.lng]);
                else {
                    profileHoverMarker = L.marker([sample.lat, sample.lng], {
                        icon: L.divIcon({ className: 'profile-pulse', iconSize: [14, 14] }),
                        interactive: false, zIndexOffset: 2000
                    }).addTo(map);
                }
                drawProfileChart();
            });
            profileCanvas.addEventListener('mouseleave', () => {
                profileHover.classList.remove('show');
                if (profileHoverMarker) { map.removeLayer(profileHoverMarker); profileHoverMarker = null; }
                profileHoverSample = null;
                drawProfileChart();
            });
            profileCanvas.addEventListener('click', async (e) => {
                if (!profileData) return;
                const rect = profileCanvas.getBoundingClientRect();
                const sample = sampleAtCanvasX(e.clientX - rect.left);
                if (!sample) return;
                const name = `Pin @ ${formatDistance(sample.d)}`;
                const marker = L.marker([sample.lat, sample.lng], { icon: makeLeafletIcon(DEFAULT_ICON, '#ea580c') });
                marker.bindPopup(`<b>${Math.round(sample.elev)} m</b><br>${sample.lat.toFixed(6)}, ${sample.lng.toFixed(6)}<br>at ${formatDistance(sample.d)}`);
                drawnItems.addLayer(marker);
                const node = createNode({
                    type: 'placemark', name, layer: marker,
                    meta: { desc: `Profile pin at ${formatDistance(sample.d)}`, lat: sample.lat, lng: sample.lng, icon: DEFAULT_ICON, color: '#ea580c', profilePin: true }
                });
                bindLayerFocus(node, marker);
                attachLayerDrag(node, marker);
                addNodeToTree(node);
                await persistTree();
                const pinMarker = L.marker([sample.lat, sample.lng], { icon: L.divIcon({ className: 'profile-pin', iconSize: [20, 20] }), zIndexOffset: 2100 });
                pinMarker._profileSample = sample;
                profilePinsGroup.addLayer(pinMarker);
                drawProfileChart();
                showToast(`Marker placed at ${formatDistance(sample.d)}`, 'fa-map-pin');
            });
            document.getElementById('profile-clear-pins').addEventListener('click', () => {
                const n = profilePinsGroup.getLayers().length;
                clearProfilePins();
                drawProfileChart();
                if (n > 0) showToast(`Cleared ${n} marker(s)`, 'fa-eraser');
            });
            document.getElementById('profile-close').addEventListener('click', () => {
                profilePanel.classList.remove('open', 'expanded');
                clearProfileMarkers();
                setLOSHighlight(null);
                profileData = null;
                profileLineSelector.classList.remove('show');
                updateMapToolsVisibility();
            });
            document.getElementById('profile-expand').addEventListener('click', () => {
                profilePanel.classList.toggle('expanded');
                updateMapToolsVisibility();
                setTimeout(drawProfileChart, 320);
            });
            window.addEventListener('resize', () => { if (profileData) drawProfileChart(); });

            // ==================== GEOLOCATION ====================
            function locateMe() {
                if (!navigator.geolocation) { showToast('Geolocation not supported', 'fa-info-circle'); return; }
                showToast('Locating…', 'fa-location-dot');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude, accuracy } = pos.coords;
                        map.flyTo([latitude, longitude], 13, { duration: 1.5 });
                        L.circleMarker([latitude, longitude], { radius: 8, color: '#4d7c0f', fillColor: '#65a30d', fillOpacity: 0.9, weight: 2 })
                            .addTo(map).bindPopup(`You are here<br>±${Math.round(accuracy)} m`).openPopup();
                        showToast('Located', 'fa-location-dot');
                    },
                    () => showToast('Location error', 'fa-exclamation-circle'),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
            document.addEventListener('keydown', (e) => {
                if ((e.key === 'l' || e.key === 'L') && !e.target.matches('input, textarea')) locateMe();
            });

            // ==================== FIT TO PLACES ====================
            function fitToPlacesExtent() {
                const bounds = L.latLngBounds([]);
                let found = false;
                function walk(nodes) {
                    for (const n of nodes) {
                        if (n.type === 'placemark' && n.meta.lat != null && n.meta.lng != null) {
                            bounds.extend([n.meta.lat, n.meta.lng]); found = true;
                        } else if (n.type === 'los' && n.meta.lat != null) {
                            bounds.extend([n.meta.lat, n.meta.lng]); found = true;
                        } else if ((n.type === 'path' || n.type === 'polygon' || n.type === 'measure' || n.type === 'measure-area') && n.meta.points) {
                            n.meta.points.forEach(p => bounds.extend(p)); found = true;
                        } else if (n.children) walk(n.children);
                    }
                }
                walk(treeNodes);
                if (found && bounds.isValid()) {
                    map.fitBounds(bounds, { ...availableMapPadding(), maxZoom: 16, animate: false });
                }
            }

            // ==================== INIT ====================
            (async function init() {
                await loadSettings();
                renderTree();
                updateTerrainVisibility();
                await loadPersistedTiles();
                const restored = await loadPersistedTree();
                if (restored) setTimeout(fitToPlacesExtent, 200);
                updateMapToolsVisibility();
                setTimeout(() => showToast('Telco Earth ready', 'fa-tower-broadcast'), 700);
            })();
        })();
    </script>
</body>
