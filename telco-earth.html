                        if (editorState) openEditorPanel(node, editorState.activeTab);
                        else openEditorPanel(node);
                        setTimeout(() => zoomToNode(node), 120);
                    }
                });

                row.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (multiSelection.size > 0 && multiSelection.has(node.id)) {
                        showBulkContextMenu(e.clientX, e.clientY);
                    } else {
                        showContextMenu(e.clientX, e.clientY, node);
                    }
                });

                return row;
            }

            searchInputEl.addEventListener('input', () => {
                placesSearchQuery = searchInputEl.value;
                if (placesSearchQuery.trim()) searchClearEl.classList.add('show');
                else searchClearEl.classList.remove('show');
                if (activeSection === 'places' && placesTab === 'places') renderTree();
            });
            searchClearEl.addEventListener('click', () => {
                placesSearchQuery = '';
                searchInputEl.value = '';
                searchClearEl.classList.remove('show');
                searchInputEl.focus();
                if (activeSection === 'places' && placesTab === 'places') renderTree();
            });

            // ==================== DRAG HELPERS ====================
            let dragLineEl = null;
            let currentDropTarget = null;
            function ensureDragLine() {
                if (!dragLineEl) {
                    dragLineEl = document.createElement('div');
                    dragLineEl.className = 'drag-line';
                    document.body.appendChild(dragLineEl);
                }
                return dragLineEl;
            }
            function hideDragLine() {
                if (dragLineEl) dragLineEl.classList.remove('show', 'drop-inside');
                document.querySelectorAll('.fx-row.drop-target').forEach(el => el.classList.remove('drop-target'));
                currentDropTarget = null;
            }
            function showDragLine(rect, position) {
                const line = ensureDragLine();
                line.classList.add('show');
                line.style.left = rect.left + 'px';
                line.style.top = (position === 'before' ? rect.top - 1 : rect.bottom - 1) + 'px';
                line.style.width = rect.width + 'px';
            }

            function buildFxRow(node) {
                const row = document.createElement('div');
                row.className = 'fx-row';
                if (selectedNodeId === node.id) row.classList.add('active');
                if (multiSelection.has(node.id)) row.classList.add('multi-selected');
                if (node.visible === false) row.classList.add('hidden-item');
                row.dataset.nodeId = node.id;
                row.draggable = true;

                const icon = document.createElement('div');
                icon.className = 'fx-icon';
                let iconFa, iconColor;
                if (node.type === 'folder' || node.type === 'kml') {
                    iconFa = 'fa-folder'; iconColor = node.meta && node.meta.color ? node.meta.color : '';
                } else if (node.type === 'placemark') {
                    iconFa = node.meta.icon || DEFAULT_ICON;
                    iconColor = node.meta.color || '#4d7c0f';
                } else if (node.type === 'los') {
                    iconFa = 'fa-satellite-dish';
                    iconColor = node.meta.color || '#ea580c';
                } else {
                    iconFa = TYPE_ICONS[node.type] || 'fa-circle';
                    iconColor = node.meta && node.meta.color ? node.meta.color : '';
                }
                icon.innerHTML = `<i class="fas ${iconFa}"${iconColor ? ` style="color:${iconColor}"` : ''}></i>`;
                row.appendChild(icon);

                const label = document.createElement('div');
                label.className = 'fx-label';
                label.textContent = node.name;
                row.appendChild(label);

                const childCount = (node.children || []).filter(c => !(c.name === 'Terrain (HGT)' || c.type === 'terrain')).length;
                if (childCount > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'fx-badge';
                    badge.textContent = childCount;
                    row.appendChild(badge);
                }

                if (node.type === 'folder' || node.type === 'kml') {
                    const chev = document.createElement('i');
                    chev.className = 'fas fa-chevron-right fx-chevron';
                    row.appendChild(chev);
                } else {
                    const vis = document.createElement('div');
                    vis.className = 'fx-vis';
                    vis.title = node.visible === false ? 'Show' : 'Hide';
                    vis.innerHTML = `<i class="fas ${node.visible === false ? 'fa-eye-slash' : 'fa-eye'}"></i>`;
                    vis.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        setNodeVisible(node, node.visible === false);
                        renderTree();
                        await persistTree();
                    });
                    row.appendChild(vis);
                }

                row.addEventListener('click', (e) => {
                    if (e.target.closest('.fx-vis')) return;
                    e.stopPropagation();

                    if (e.ctrlKey || e.metaKey) {
                        if (selectedNodeId && selectedNodeId !== node.id && !multiSelection.has(selectedNodeId)) {
                            if (findNode(selectedNodeId)) multiSelection.add(selectedNodeId);
                        }
                        if (multiSelection.has(node.id)) multiSelection.delete(node.id);
                        else multiSelection.add(node.id);
                        if (multiSelection.size === 1) {
                            selectedNodeId = multiSelection.values().next().value;
                            multiSelection.clear();
                        } else {
                            selectedNodeId = node.id;
                        }
                        renderTree();
                        return;
                    }

                    if (multiSelection.size > 0) multiSelection.clear();
                    selectedNodeId = node.id;
                    if (node.type === 'folder' || node.type === 'kml') {
                        currentFolderId = node.id;
                        renderTree();
                    } else {
                        renderTree();
                        if (editorState) openEditorPanel(node, editorState.activeTab);
                        else if (node.layer && node.layer.openPopup) {
                            try { node.layer.openPopup(); } catch(e){}
                        }
                    }
                });

                row.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (multiSelection.size > 0 && multiSelection.has(node.id)) {
                        showBulkContextMenu(e.clientX, e.clientY);
                    } else {
                        showContextMenu(e.clientX, e.clientY, node);
                    }
                });

                row.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    e.dataTransfer.setData('text/plain', node.id);
                    e.dataTransfer.effectAllowed = 'move';
                    row.classList.add('dragging');
                    _draggingId = node.id;
                });
                row.addEventListener('dragend', () => {
                    row.classList.remove('dragging');
                    _draggingId = null;
                    hideDragLine();
                });
                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const draggedId = e.dataTransfer.getData('text/plain') || getDraggingId();
                    if (!draggedId || draggedId === node.id) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    function isDescendant(anc, desc) {
                        if (!anc.children) return false;
                        for (const c of anc.children) {
                            if (c.id === desc.id) return true;
                            if (isDescendant(c, desc)) return true;
                        }
                        return false;
                    }
                    if (isDescendant(dragged, node)) { e.dataTransfer.dropEffect = 'none'; return; }
                    const rect = row.getBoundingClientRect();
                    const relY = (e.clientY - rect.top) / rect.height;
                    const canContain = (node.type === 'folder' || node.type === 'kml');
                    let zone;
                    if (canContain && relY > 0.25 && relY < 0.75) zone = 'inside';
                    else if (relY < 0.5) zone = 'before';
                    else zone = 'after';

                    document.querySelectorAll('.fx-row.drop-target').forEach(el => el.classList.remove('drop-target'));
                    if (zone === 'inside') {
                        row.classList.add('drop-target');
                        showDragLine(rect, 'inside');
                        currentDropTarget = { type: 'inside', node };
                    } else {
                        showDragLine(rect, zone);
                        currentDropTarget = { type: zone, node };
                    }
                    e.dataTransfer.dropEffect = 'move';
                });
                row.addEventListener('dragleave', (e) => {
                    if (e.relatedTarget && row.contains(e.relatedTarget)) return;
                    row.classList.remove('drop-target');
                });
                row.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    row.classList.remove('drop-target');
                    const target = currentDropTarget;
                    hideDragLine();
                    const draggedId = e.dataTransfer.getData('text/plain') || getDraggingId();
                    if (!draggedId || draggedId === node.id) return;
                    const dragged = findNode(draggedId);
                    if (!dragged) return;
                    function isDescendant(anc, desc) {
                        if (!anc.children) return false;
                        for (const c of anc.children) {
                            if (c.id === desc.id) return true;
                            if (isDescendant(c, desc)) return true;
                        }
                        return false;
                    }
                    if (isDescendant(dragged, node)) { showToast('Cannot drop folder into itself'); return; }
                    if (!target || target.node.id !== node.id) return;
                    if (target.type === 'inside') {
                        removeNode(draggedId);
                        if (!node.children) node.children = [];
                        node.children.push(dragged);
                        renderTree();
                        await persistTree();
                        showToast(`Moved "${dragged.name}" into ${node.name}`, 'fa-arrows-up-down-left-right');
                    } else {
                        const loc = findParent(node.id);
                        if (!loc) { showToast('Cannot move here'); return; }
                        removeNode(draggedId);
                        const idx = loc.list.findIndex(n => n.id === node.id);
                        const insertAt = target.type === 'before' ? idx : idx + 1;
                        loc.list.splice(insertAt, 0, dragged);
                        renderTree();
                        await persistTree();
                        showToast(`Moved "${dragged.name}"`, 'fa-arrows-up-down-left-right');
                    }
                });

                return row;
            }

            let _draggingId = null;
            function getDraggingId() { return _draggingId; }

            // ==================== ARCHIVE ====================
            let archiveHoverState = null;
            function computeNodeBounds(node) {
                const bounds = L.latLngBounds([]);
                (function walk(n) {
                    if (n.type === 'placemark' && n.meta.lat != null && n.meta.lng != null) {
                        bounds.extend([n.meta.lat, n.meta.lng]);
                    } else if (n.type === 'los' && n.meta.lat != null) {
                        const c = L.latLng(n.meta.lat, n.meta.lng);
                        const r = (n.meta.radius || 10000) / 111320;
                        bounds.extend([c.lat - r, c.lng - r]);
                        bounds.extend([c.lat + r, c.lng + r]);
                    } else if (n.meta && n.meta.points) {
                        n.meta.points.forEach(p => bounds.extend(p));
                    }
                    if (n.children) n.children.forEach(walk);
                })(node);
                return bounds;
            }
            function buildPreviewLayers(node) {
                const out = [];
                (function walk(n) {
                    if (n.type === 'placemark' && n.meta.lat != null) {
                        out.push(L.marker([n.meta.lat, n.meta.lng], { icon: makeIconFromNode(n) }));
                    } else if ((n.type === 'path' || n.type === 'measure') && n.meta.points) {
                        out.push(L.polyline(n.meta.points, { color: n.meta.color || '#4d7c0f', weight: n.meta.lineThickness || 3 }));
                    } else if ((n.type === 'polygon' || n.type === 'measure-area') && n.meta.points) {
                        out.push(L.polygon(n.meta.points, { color: n.meta.color || '#4d7c0f', weight: n.meta.lineThickness || 2, fillOpacity: 0.2 }));
                    } else if (n.type === 'los') {
                        out.push(L.circleMarker([n.meta.lat, n.meta.lng], { radius: 6, color: 'white', weight: 2, fillColor: n.meta.color || '#ea580c', fillOpacity: 1 }));
                        out.push(L.circle([n.meta.lat, n.meta.lng], { radius: n.meta.radius || 10000, color: n.meta.color || '#ea580c', weight: 1.5, dashArray: '6,4', fill: false, opacity: 0.7 }));
                    }
                    if (n.children) n.children.forEach(walk);
                })(node);
                return out;
            }
            function archiveHoverEnter(node) {
                if (archiveHoverState) archiveHoverLeave();
                const restore = [];
                drawnItems.eachLayer(l => { if (drawnItems.hasLayer(l)) { drawnItems.removeLayer(l); restore.push(l); } });
                const preview = L.featureGroup();
                buildPreviewLayers(node).forEach(l => preview.addLayer(l));
                preview.addTo(map);
                preview.bringToFront();
                const bounds = computeNodeBounds(node);
                let prevView = null;
                if (bounds.isValid()) {
                    prevView = { center: map.getCenter(), zoom: map.getZoom() };
                    const pad = availableMapPadding();
                    if (bounds.getNorthEast().equals(bounds.getSouthWest())) {
                        map.setView(bounds.getCenter(), Math.max(map.getZoom(), 14), { animate: true });
                    } else {
                        map.fitBounds(bounds, { ...pad, maxZoom: 16, animate: true });
                    }
                }
                archiveHoverState = { restore, preview, prevView };
            }
            function archiveHoverLeave() {
                if (!archiveHoverState) return;
                const { restore, preview, prevView } = archiveHoverState;
                if (map.hasLayer(preview)) map.removeLayer(preview);
                restore.forEach(l => { try { drawnItems.addLayer(l); } catch(e){} });
                if (drawnItems.bringToFront) drawnItems.bringToFront();
                if (prevView) map.setView(prevView.center, prevView.zoom, { animate: true });
                archiveHoverState = null;
            }
            function renderArchiveSection() {
                subrailBody.innerHTML = '';
                if (archivedNodes.length === 0) {
                    subrailBody.innerHTML = `
                        <div class="fx-empty">
                            <div style="width: 52px; height: 52px; margin: 0 auto 14px; border-radius: 14px; background: var(--paper-2); display: flex; align-items: center; justify-content: center;">
                                <i class="fas fa-box-archive" style="color: var(--ink-3); font-size: 1.3rem;"></i>
                            </div>
                            <div style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.95rem; color: var(--ink); margin-bottom: 6px;">Archive is empty</div>
                            <div>Right-click a place and choose <b>Archive</b>.</div>
                        </div>`;
                    return;
                }
                const header = document.createElement('div');
                header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:4px 4px 10px;font-family:"IBM Plex Mono",monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-3);font-weight:500;';
                header.innerHTML = `
                    <span>${archivedNodes.length} item${archivedNodes.length !== 1 ? 's' : ''}</span>
                    <button id="archive-restore-all" style="background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:0.6rem;color:var(--ink-2);cursor:pointer;font-family:inherit;text-transform:none;letter-spacing:0;font-weight:500;">
                        <i class="fas fa-rotate-left"></i> Restore all
                    </button>
                `;
                subrailBody.appendChild(header);
                header.querySelector('#archive-restore-all').addEventListener('click', async () => {
                    if (!confirm(`Restore all ${archivedNodes.length} archived item(s)?`)) return;
                    const toRestore = archivedNodes.slice();
                    for (const n of toRestore) await restoreNode(n);
                });
                archivedNodes.forEach(node => {
                    const row = document.createElement('div');
                    row.className = 'fx-row';
                    row.style.cursor = 'pointer';
                    const icon = document.createElement('div');
                    icon.className = 'fx-icon';
                    let iconFa = 'fa-circle', iconColor = '';
                    if (node.type === 'placemark') { iconFa = node.meta.icon || DEFAULT_ICON; iconColor = node.meta.color || '#4d7c0f'; }
                    else if (node.type === 'los') { iconFa = 'fa-satellite-dish'; iconColor = node.meta.color || '#ea580c'; }
                    else { iconFa = TYPE_ICONS[node.type] || 'fa-circle'; iconColor = node.meta && node.meta.color ? node.meta.color : ''; }
                    icon.innerHTML = `<i class="fas ${iconFa}"${iconColor ? ` style="color:${iconColor}"` : ''}></i>`;
                    row.appendChild(icon);
                    const label = document.createElement('div');
                    label.className = 'fx-label';
                    label.textContent = node.name;
                    row.appendChild(label);
                    const restoreBtn = document.createElement('button');
                    restoreBtn.title = 'Restore';
                    restoreBtn.innerHTML = '<i class="fas fa-rotate-left"></i>';
                    restoreBtn.style.cssText = 'width:24px;height:24px;border-radius:5px;background:transparent;border:1px solid transparent;color:var(--sage);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.72rem;';
                    restoreBtn.addEventListener('click', async (e) => { e.stopPropagation(); await restoreNode(node); });
                    row.appendChild(restoreBtn);
                    const delBtn = document.createElement('button');
                    delBtn.title = 'Delete permanently';
                    delBtn.innerHTML = '<i class="fas fa-trash"></i>';
                    delBtn.style.cssText = 'width:24px;height:24px;border-radius:5px;background:transparent;border:1px solid transparent;color:var(--ink-3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.72rem;';
                    delBtn.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        if (!confirm(`Permanently delete "${node.name}"?`)) return;
                        await deleteArchived(node);
                    });
                    row.appendChild(delBtn);
                    row.addEventListener('mouseenter', () => archiveHoverEnter(node));
                    row.addEventListener('mouseleave', () => archiveHoverLeave());
                    row.addEventListener('contextmenu', (e) => {
                        e.preventDefault(); e.stopPropagation();
                        showArchivedContextMenu(e.clientX, e.clientY, node);
                    });
                    subrailBody.appendChild(row);
                });
            }

            // ==================== CONTEXT MENUS ====================
            const ctxMenu = document.getElementById('context-menu');
            function showContextMenu(x, y, node) {
                const items = [];
                items.push({ label: 'Edit…', icon: 'fa-pen', action: () => openEditorPanel(node) });
                items.push({ label: 'Zoom to', icon: 'fa-crosshairs', action: () => zoomToNode(node) });
                items.push({ label: 'Reposition on map', icon: 'fa-arrows-up-down-left-right', action: () => startReposition(node) });
                items.push({ sep: true });
                if (node.visible === false) {
                    items.push({ label: 'Show', icon: 'fa-eye', action: async () => { setNodeVisible(node, true); renderTree(); await persistTree(); }});
                } else {
                    items.push({ label: 'Hide', icon: 'fa-eye-slash', action: async () => { setNodeVisible(node, false); renderTree(); await persistTree(); }});
                }
                items.push({ label: 'Archive', icon: 'fa-box-archive', action: () => archiveNode(node) });
                const insertTargetFolder = (node.type === 'folder' || node.type === 'kml') ? node : (() => {
                    const loc = findParent(node.id);
                    return loc && loc.parent ? loc.parent : null;
                })();
                items.push({ sep: true });
                items.push({ label: 'New folder here', icon: 'fa-folder-plus', action: () => promptNewFolder(insertTargetFolder) });
                items.push({ label: 'Import here…', icon: 'fa-file-import', action: () => openImportScreen(insertTargetFolder ? insertTargetFolder.id : null) });
                if (node.type === 'folder' || node.type === 'kml') {
                    items.push({ sep: true });
                    items.push({ label: 'Show all children', icon: 'fa-eye', action: async () => {
                        if (node.children) node.children.forEach(c => setNodeVisible(c, true));
                        renderTree(); await persistTree();
                    }});
                    items.push({ label: 'Hide all children', icon: 'fa-eye-slash', action: async () => {
                        if (node.children) node.children.forEach(c => setNodeVisible(c, false));
                        renderTree(); await persistTree();
                    }});
                }
                if (['path','measure','polygon','measure-area'].includes(node.type) && node.meta.points) {
                    items.push({ sep: true });
                    items.push({ label: 'Path profile', icon: 'fa-chart-area', action: () => openProfilePanel(node) });
                }
                if (node.type === 'los') {
                    items.push({ sep: true });

            function showPanelContextMenu(x, y, parentFolderId) {

            function showArchivedContextMenu(x, y, node) {
                const items = [
                    { label: 'Restore', icon: 'fa-rotate-left', action: () => restoreNode(node) },
                    { label: 'Properties', icon: 'fa-circle-info', action: () => openEditorPanel(node) },
                    { sep: true },

                        if (!confirm(`Permanently delete "${node.name}"?`)) return;
                        await deleteArchived(node);
                    }}
                ];
                buildContextMenu(x, y, node.name, items);
            }
            function buildContextMenu(x, y, title, items) {
                ctxMenu.innerHTML = `<div class="ctx-title">${escapeHtml(title)}</div>` +
                    items.map((it, i) => {
                        if (it.sep) return '<div class="ctx-sep"></div>';
                        return `<div class="ctx-item ${it.danger ? 'danger' : ''}" data-i="${i}"><i class="fas ${it.icon}"></i><span>${it.label}</span></div>`;
                    }).join('');
                ctxMenu.classList.add('open');
                const mw = 240;
                const mh = ctxMenu.offsetHeight || 300;
                ctxMenu.style.left = Math.min(x, window.innerWidth - mw - 8) + 'px';
                ctxMenu.style.top = Math.min(y, window.innerHeight - mh - 8) + 'px';
                ctxMenu.querySelectorAll('.ctx-item').forEach(el => {
                    const idx = parseInt(el.dataset.i, 10);
                    const item = items[idx];
                    el.addEventListener('click', () => { hideContextMenu(); if (item.action) item.action(); });
                });
            }
            function hideContextMenu() { ctxMenu.classList.remove('open'); }
            document.addEventListener('click', (e) => { if (!ctxMenu.contains(e.target)) hideContextMenu(); });
            document.addEventListener('contextmenu', (e) => { if (e.defaultPrevented) return; if (!ctxMenu.contains(e.target)) hideContextMenu(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideContextMenu(); });

            // ==================== VISIBILITY / DELETE / ARCHIVE ====================
            function setNodeVisible(node, visible) {
                node.visible = visible;
                if (node.layer) {
                    if (visible) {
                        if (!map.hasLayer(node.layer)) node.layer.addTo(map);
                        if (!drawnItems.hasLayer(node.layer)) drawnItems.addLayer(node.layer);
                    } else {
                        if (map.hasLayer(node.layer)) map.removeLayer(node.layer);
                        if (drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                    }
                }
                if (node.children) node.children.forEach(c => setNodeVisible(c, visible));
                if (drawnItems.bringToFront) drawnItems.bringToFront();
            }
            async function deleteNodeWithChildren(node) {
                if (node.children) for (const c of node.children.slice()) await deleteNodeWithChildren(c);
                if (node.layer && map.hasLayer(node.layer)) map.removeLayer(node.layer);
                if (node.layer && drawnItems.hasLayer(node.layer)) drawnItems.removeLayer(node.layer);
                if (node.type === 'terrain' && node.meta && node.meta.key) {
                    visibleTiles.delete(node.meta.key);
                    terrainStore.delete(node.meta.key);
                    await dbDelete('terrain', node.meta.key);
                    recomputeGlobalScale();
                    redrawTerrainOverlays();
                    updateTerrainVisibility();
                }
                removeNode(node.id);
                if (selectedNodeId === node.id) selectedNodeId = null;
                multiSelection.delete(node.id);
            }
            async function archiveNode(node) {
                if (!node) return;
                const loc = findParent(node.id);
                node.archivedFrom = loc && loc.parent ? loc.parent.id : null;
                (function detach(n) {
                    if (n.layer) {
                        if (map.hasLayer(n.layer)) map.removeLayer(n.layer);
                        if (drawnItems.hasLayer(n.layer)) drawnItems.removeLayer(n.layer);
                    }
                    if (n.children) n.children.forEach(detach);
                })(node);
                removeNode(node.id);
                archivedNodes.push(node);
                if (selectedNodeId === node.id) selectedNodeId = null;
                multiSelection.delete(node.id);
                renderTree();
                await persistTree();
                showToast(`Archived "${node.name}"`, 'fa-box-archive');
            }
            async function restoreNode(node) {
                const idx = archivedNodes.findIndex(n => n.id === node.id);
                if (idx < 0) return;
                archivedNodes.splice(idx, 1);
                node.archivedFrom = null;
                let parent = null;
                if (node.archivedFrom) {
                    parent = findNode(node.archivedFrom);
                    if (!parent || parent.type !== 'folder') parent = null;
                }
                if (parent) {
                    if (!parent.children) parent.children = [];
                    parent.children.push(node);
                } else treeNodes.push(node);
                (function rebuild(n) {
                    if (n.type === 'placemark' && n.meta.lat != null && n.meta.lng != null) {
                        const marker = L.marker([n.meta.lat, n.meta.lng], { icon: makeIconFromNode(n) });
                        const desc = n.meta.desc ? '<br>' + escapeHtml(n.meta.desc) : '';
                        marker.bindPopup(`<b>${escapeHtml(n.name)}</b>${desc}`);
                        bindLayerFocus(n, marker);
                        attachLayerDrag(n, marker);
                        n.layer = marker;
                        if (n.visible !== false) marker.addTo(drawnItems);
                    } else if ((n.type === 'path' || n.type === 'measure') && n.meta.points) {
                        const line = L.polyline(n.meta.points, { color: n.meta.color || '#4d7c0f', weight: n.meta.lineThickness || 3 });
                        bindLayerFocus(n, line);
                        attachLayerDrag(n, line);
                        n.layer = line;
                        if (n.visible !== false) line.addTo(drawnItems);
                    } else if ((n.type === 'polygon' || n.type === 'measure-area') && n.meta.points) {
                        const poly = L.polygon(n.meta.points, { color: n.meta.color || '#4d7c0f', weight: n.meta.lineThickness || 2, fillOpacity: 0.2 });
                        bindLayerFocus(n, poly);
                        attachLayerDrag(n, poly);
                        n.layer = poly;
                        if (n.visible !== false) poly.addTo(drawnItems);
                    } else if (n.type === 'los') {
                        n.layer = L.layerGroup(buildLOSLayers(n));
                        if (n.visible !== false) n.layer.addTo(drawnItems);
                    }
                    if (n.children) n.children.forEach(rebuild);
                })(node);
                if (drawnItems.bringToFront) drawnItems.bringToFront();
                renderTree();
                await persistTree();
                showToast(`Restored "${node.name}"`, 'fa-rotate-left');
            }
            async function deleteArchived(node) {
                const idx = archivedNodes.findIndex(n => n.id === node.id);
                if (idx < 0) return;
                archivedNodes.splice(idx, 1);
                renderTree();
                await persistTree();
                showToast(`Deleted "${node.name}" from archive`, 'fa-trash');
            }

            function availableMapPadding() {
                const pad = { paddingTopLeft: [40, 40], paddingBottomRight: [40, 40] };
                if (editorPanel.classList.contains('open')) {
                    const pw = editorPanel.offsetWidth || 420;
                    pad.paddingBottomRight = [pw + 40, 40];
                }
                return pad;
            }
            function zoomToNode(node) {
                const pad = availableMapPadding();
                if (!node.layer) {
                    if (node.children) {
                        const bounds = L.latLngBounds([]);
                        (function walk(n) {
                            if (n.layer) {
                                if (n.layer.getBounds) { try { bounds.extend(n.layer.getBounds()); } catch(e){} }
                                else if (n.layer.getLatLng) bounds.extend(n.layer.getLatLng());
                            }
                            if (n.children) n.children.forEach(walk);
                        })(node);
                        if (bounds.isValid()) map.flyToBounds(bounds, { ...pad, duration: 1.2, maxZoom: 16 });
                    }
                    return;
                }
                if (node.layer.getBounds) {
                    const b = node.layer.getBounds();
                    if (b.isValid()) map.flyToBounds(b, { ...pad, duration: 1.2, maxZoom: 16 });
                } else if (node.layer.getLatLng) {
                    map.flyTo(node.layer.getLatLng(), Math.max(map.getZoom(), 13), { duration: 1.2 });
                } else if (node.type === 'los') {
                    const c = L.latLng(node.meta.lat, node.meta.lng);
                    const r = (node.meta.radius || 10000) / 111320;
                    map.flyToBounds([[c.lat - r, c.lng - r], [c.lat + r, c.lng + r]], { ...pad, duration: 1.2 });
                }
            }

            // ==================== SNAP ZONES ====================
            let snapRingLayer = null;
            let snapZoneActive = false;
            function rebuildSnapZoneLayer() {
                snapZoneGroup.clearLayers();
                if (!snapZoneActive || !SETTINGS.snapToMarkers) return;
                const r = Math.max(4, SETTINGS.snapPixels);
                function walk(nodes) {
                    for (const n of nodes) {
                        if ((n.type === 'placemark' || n.type === 'los') && n.visible !== false && n.meta.lat != null) {
                            snapZoneGroup.addLayer(L.circleMarker([n.meta.lat, n.meta.lng], {
                                radius: r, color: '#65a30d', weight: 2, dashArray: '5,4',
                                fillColor: '#65a30d', fillOpacity: 0.14, opacity: 0.85,
                                interactive: false, pane: 'snapPane'
                            }));
                        }
                        if (n.children) walk(n.children);
                    }
                }
                walk(treeNodes);
            }
            function setSnapZoneActive(active) {
                snapZoneActive = !!active;
                rebuildSnapZoneLayer();
                if (!active) hideSnapPreview();
            }
            function refreshSnapZoneMode() {
                const inEditorVertices = editorState && editorState.activeTab === 'vertices';
                const drawing = drawState && drawState.type !== 'placemark';
                setSnapZoneActive(!!(SETTINGS.snapToMarkers && (inEditorVertices || drawing)));
            }
            map.on('zoomend', () => { if (snapZoneActive) rebuildSnapZoneLayer(); });
            function updateSnapPreview(containerPoint) {
                if (!SETTINGS.snapToMarkers || !containerPoint) { hideSnapPreview(); return; }
                const snap = findSnapTargetPixel(containerPoint);
                if (snapRingLayer) { map.removeLayer(snapRingLayer); snapRingLayer = null; }
                if (snap) {
                    snapRingLayer = L.circleMarker(snap.latlng, {
                        radius: 14, color: '#166534', weight: 3,
                        fillColor: 'rgba(101,163,13,0.15)', fillOpacity: 0.5,
                        interactive: false, pane: 'snapPane'
                    }).addTo(map);
                }
            }
            function hideSnapPreview() {
                if (snapRingLayer) { map.removeLayer(snapRingLayer); snapRingLayer = null; }
            }
            function findSnapTargetPixel(containerPoint, excludeNodeIds) {
                if (!SETTINGS.snapToMarkers) return null;
                const exclude = excludeNodeIds || new Set();
                const threshold = SETTINGS.snapPixels;
                let best = null, bestDist = Infinity;
                function consider(latlng, node) {
                    if (exclude.has(node.id)) return;
                    const pt = map.latLngToContainerPoint(latlng);
                    const dx = pt.x - containerPoint.x;
                    const dy = pt.y - containerPoint.y;
                    const d = Math.sqrt(dx*dx + dy*dy);
                    if (d < bestDist && d <= threshold) { bestDist = d; best = { latlng, node, distance: d }; }
                }
                function walk(nodes) {
                    for (const n of nodes) {
                        if (n.type === 'placemark' && n.visible !== false && n.meta.lat != null) consider(L.latLng(n.meta.lat, n.meta.lng), n);
                        if (n.type === 'los' && n.visible !== false && n.meta.lat != null) consider(L.latLng(n.meta.lat, n.meta.lng), n);
                        if (n.children) walk(n.children);
                    }
                }
                walk(treeNodes);
                return best;
            }
            function applySnapFromContainerPoint(containerPoint, originalLatLng) {
                const snap = findSnapTargetPixel(containerPoint);
                if (!snap) return originalLatLng;
                return snap.latlng;
            }
            function applySnapFromEvent(e, originalLatLng) {
                return applySnapFromContainerPoint(e.containerPoint || map.latLngToContainerPoint(originalLatLng), originalLatLng);
            }

            // ==================== STATIC SECTIONS ====================
            function renderStaticSection(section) {
                subrailFooter.style.display = 'none';
                breadcrumbEl.style.display = 'none';
                searchBoxEl.classList.remove('show');
                if (section === 'draw') {
                    const items = [
                        { icon: 'fa-map-pin', label: 'Add placemark', desc: 'Click map to place a marker', action: () => beginDraw('placemark') },
                        { icon: 'fa-route', label: 'Add path', desc: 'Multi-point line', action: () => beginDraw('path') },
                        { icon: 'fa-draw-polygon', label: 'Add polygon', desc: 'Closed area', action: () => beginDraw('polygon') },
                        { icon: 'fa-ruler', label: 'Measure distance', desc: 'Multi-point measure', action: () => beginDraw('measure') },
                        { icon: 'fa-vector-square', label: 'Measure area', desc: 'Polygon area', action: () => beginDraw('measure-area') },
                        { icon: 'fa-satellite-dish', label: 'Add LOS radius', desc: 'Line-of-sight analysis from a point', action: () => beginLOS() },

                    subrailBody.innerHTML = items.map((it, i) => `

                } else if (section === 'terrain') {
                    const topItems = [
                        { icon: 'fa-upload', label: 'Upload HGT files', desc: 'SRTM .hgt format', action: () => fileInput.click() },
                        { icon: 'fa-download', label: 'Download HGT', desc: 'Viewfinder Panoramas', action: () => window.open('https://viewfinderpanoramas.org/Coverage%20map%20viewfinderpanoramas_org3.htm', '_blank') }
                    ];
                    subrailBody.innerHTML = topItems.map((it, i) => `
                        <div class="static-item" data-action="${i}">
                            <div class="static-item-icon"><i class="fas ${it.icon}"></i></div>

                                <div class="static-item-label">${it.label}</div>

                    subrailBody.querySelectorAll('.static-item').forEach((el, i) => el.addEventListener('click', () => topItems[i].action()));
                    const toggle = document.createElement('div');

                    toggle.innerHTML = `
                        <div class="toggle-switch"></div>
                        <div class="toggle-label">
                            <div class="toggle-label-main">Show all heatmaps</div>
                            <div class="toggle-label-sub">${subText}</div>
                        </div>
                    `;
                    toggle.addEventListener('click', () => {
                        if (terrainStore.size === 0) { showToast('No HGT tiles loaded yet', 'fa-info-circle'); return; }
                        if (showAllHeatmaps) { visibleTiles.clear(); showToast('Heatmaps hidden', 'fa-eye-slash'); }
                        else { terrainStore.forEach((_t, k) => visibleTiles.add(k)); showToast('Showing all heatmaps', 'fa-eye'); }
                        syncShowAllState();
                        redrawTerrainOverlays();
                        renderStaticSection('terrain');
                    });
                    subrailBody.appendChild(toggle);
                    if (terrainStore.size > 0) {
                        const scaleInfo = document.createElement('div');
                        scaleInfo.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.62rem; color: var(--ink-3); padding: 4px 4px 10px;';
                        scaleInfo.textContent = `Shared scale · ${globalMin} m – ${globalMax} m`;
                        subrailBody.appendChild(scaleInfo);
                    }
                    const heading = document.createElement('div');
                    heading.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; padding: 16px 4px 8px;';
                    heading.textContent = 'Colour scheme';
                    subrailBody.appendChild(heading);
                    const grid = document.createElement('div');
                    grid.className = 'scheme-grid';
                    Object.keys(HEATMAP_SCHEMES).forEach(key => {
                        const s = HEATMAP_SCHEMES[key];
                        const stops = [];
                        for (let i = 0; i <= 10; i++) {
                            const t = i / 10; const c = s.color(t);
                            stops.push(`rgba(${c[0]|0},${c[1]|0},${c[2]|0},1) ${(t*100).toFixed(0)}%`);
                        }
                        const card = document.createElement('div');

                        card.innerHTML = `<div class="scheme-preview" style="background: linear-gradient(90deg, ${stops.join(', ')});"></div><div class="scheme-name">${s.name}</div>`;
                        card.addEventListener('click', () => {

                    subrailBody.appendChild(grid);
                    if (terrainStore.size > 0) {
                        const heading2 = document.createElement('div');
                        heading2.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--ink-3); font-weight: 500; padding: 16px 4px 8px;';
                        heading2.textContent = 'Loaded tiles · ' + terrainStore.size;
                        subrailBody.appendChild(heading2);
                        terrainStore.forEach((tile, key) => {
                            const isVisible = visibleTiles.has(key);
                            const row = document.createElement('div');
                            row.className = 'tile-row' + (isVisible ? ' active' : '');
                            row.innerHTML = `
                                <div class="tile-check"><i class="fas fa-check"></i></div>

                                <button class="tile-del" title="Remove tile"><i class="fas fa-trash"></i></button>
                            `;
                            row.addEventListener('click', (e) => {
                                if (e.target.closest('.tile-zoom') || e.target.closest('.tile-del')) return;
                                toggleTileVisibility(key);
                                renderStaticSection('terrain');

                            row.querySelector('.tile-zoom').addEventListener('click', (e) => {
                                e.stopPropagation();
                                const sw = parseKey(key);
                                map.flyToBounds([[sw.lat, sw.lng], [sw.lat + 1, sw.lng + 1]], { duration: 1.2 });
                            });
                            row.querySelector('.tile-del').addEventListener('click', async (e) => {
                                e.stopPropagation();
                                if (!confirm(`Remove HGT tile ${key}?`)) return;
                                visibleTiles.delete(key);
                                terrainStore.delete(key);
                                await dbDelete('terrain', key);
                                recomputeGlobalScale();
                                syncShowAllState();
                                redrawTerrainOverlays();
                                updateTerrainVisibility();
                                renderStaticSection('terrain');
                                const tf = findNodeByName('Terrain (HGT)');
                                if (tf) {
                                    const idx = tf.children.findIndex(c => c.meta && c.meta.key === key);
                                    if (idx >= 0) tf.children.splice(idx, 1);
                                    renderTree();
                                    await persistTree();
                                }
                            });
                            subrailBody.appendChild(row);
                        });
                    }
                } else if (section === 'layers') {
                    const groups = {};

                    Object.keys(PROVIDERS).forEach(key => {
                        const p = PROVIDERS[key];
                        if (!groups[p.group]) { groups[p.group] = []; groupOrder.push(p.group); }
                        groups[p.group].push({ key, ...p });
                    });
                    subrailBody.innerHTML = '';
                    groupOrder.forEach(groupName => {

                    snapToggle.addEventListener('click', async () => {

                        renderStaticSection('settings');

                    const snapDistRow = document.createElement('div');
                    snapDistRow.className = 'static-item';
                    snapDistRow.style.cursor = 'default';
                    snapDistRow.innerHTML = `

                                <button class="btn btn-secondary" id="snap-dist-save" style="padding:6px 12px;font-size:0.75rem;">Save</button>

                    `;
                    const actions = [
                        { icon: 'fa-database', label: 'Storage info', desc: 'IndexedDB usage estimate', action: async () => {
                            if (navigator.storage && navigator.storage.estimate) {
                                const est = await navigator.storage.estimate();

                        { icon: 'fa-location-dot', label: 'Go to my location', desc: 'GPS / network location', action: () => locateMe() },
                        { icon: 'fa-file-export', label: 'Export all as KML', desc: 'Download KML of all places', action: () => exportKMLAll() },
                        { icon: 'fa-route', label: 'Export all as GPX', desc: 'GPS Exchange Format', action: () => exportGPXAll() }

                    subrailBody.innerHTML = '';
                    subrailBody.appendChild(snapToggle);
                    subrailBody.appendChild(snapDistRow);
                    snapDistRow.querySelector('#snap-dist-save').addEventListener('click', async () => {

                    const dangerHeading = document.createElement('div');
                    dangerHeading.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--danger); font-weight: 600; padding: 22px 4px 8px; display: flex; align-items: center; gap: 6px;';
                    dangerHeading.innerHTML = '<i class="fas fa-triangle-exclamation"></i> Clear data';
                    subrailBody.appendChild(dangerHeading);
                    const dangerItems = [
                        { icon: 'fa-eye-slash', label: 'Clear view', desc: 'Hide all places and heatmaps', action: async () => {
                            if (!confirm('Hide all places and heatmaps from the map?')) return;
                            treeNodes.forEach(n => setNodeVisible(n, false));
                            visibleTiles.clear();
                            syncShowAllState();
                            redrawTerrainOverlays();
                            renderTree();
                            await persistTree();
                            showToast('View cleared', 'fa-eye-slash');
                        }},
                        { icon: 'fa-database', label: 'Clear map tile cache', desc: 'Free in-memory tile cache', action: () => {
                            if (!confirm('Clear in-memory tile cache?')) return;
                            tileCache.forEach(e => e.url && URL.revokeObjectURL(e.url));
                            tileCache.clear();
                            cacheHits = 0; cacheMisses = 0;
                            showToast('Map tile cache cleared', 'fa-database');
                        }},
                        { icon: 'fa-mountain', label: 'Clear HGT data', desc: 'Delete stored terrain tiles', action: async () => {
                            if (!confirm('Delete all HGT tiles from the browser? This cannot be undone.')) return;
                            await dbClear('terrain');
                            terrainStore.clear();
                            visibleTiles.clear();
                            heatmapCache.clear();
                            updateTerrainVisibility();
                            redrawTerrainOverlays();
                            const tf = findNodeByName('Terrain (HGT)');
                            if (tf) removeNode(tf.id);
                            renderTree();
                            await persistTree();
                            showToast('HGT data cleared', 'fa-trash-alt');
                        }},
                        { icon: 'fa-map-location-dot', label: 'Clear places data', desc: 'Delete all saved places', action: async () => {
                            if (!confirm('Delete all places and archived items from the browser? This cannot be undone.')) return;
                            await dbClear('places');
                            treeNodes = [];
                            archivedNodes = [];
                            currentFolderId = null;

                            drawnItems.clearLayers();

                    dangerItems.forEach(it => {

                        el.className = 'static-item danger';
                        el.innerHTML = `
                            <div class="static-item-icon"><i class="fas ${it.icon}"></i></div>

            }

            // ==================== REPOSITION ====================
            let repositionState = null;
            function startReposition(node) {
                if (repositionState) endReposition();
                repositionState = { node };
                document.getElementById('reposition-banner').classList.add('show');
                (function applyRing(n) {
                    if (n.layer && n.layer.getElement && n.layer.getElement()) n.layer.getElement().classList.add('reposition-ring');
                    if (n.children) n.children.forEach(applyRing);
                })(node);
                (function enableDrag(n) {
                    if (n.type === 'placemark' && n.layer && n.layer.dragging) {
                        n.layer.dragging.enable();
                        n.layer.on('dragend', onRepositionDragEnd);
                    } else if ((n.type === 'path' || n.type === 'polygon' || n.type === 'measure' || n.type === 'measure-area') && n.layer) {
                        const bounds = n.layer.getBounds();
                        if (bounds && bounds.isValid()) {
                            const hitbox = L.rectangle(bounds, { color: 'transparent', fillColor: 'transparent', interactive: true, className: 'reposition-ring' }).addTo(map);
                            n._repositionHitbox = hitbox;
                            let dragStart = null;
                            hitbox.on('mousedown', (ev) => {
                                L.DomEvent.stopPropagation(ev);
                                dragStart = { latlng: ev.latlng };
                                map.dragging.disable();
                                map.on('mousemove', onMove);
                                map.on('mouseup', onUp);
                            });
                            function onMove(ev) {
                                if (!dragStart) return;
                                const dLat = ev.latlng.lat - dragStart.latlng.lat;
                                const dLng = ev.latlng.lng - dragStart.latlng.lng;
                                moveLayerBy(n, dLat, dLng);
                                dragStart.latlng = ev.latlng;
                                hitbox.setBounds(n.layer.getBounds());
                            }
                            function onUp() {
                                dragStart = null;
                                map.dragging.enable();
                                map.off('mousemove', onMove);
                                map.off('mouseup', onUp);
                            }
                        }
                    } else if (n.type === 'los' && n.layer) {
                        const centerMarker = L.marker([n.meta.lat, n.meta.lng], {
                            icon: L.divIcon({ className: 'vertex-marker', iconSize: [14, 14] }),
                            draggable: true, zIndexOffset: 1000
                        }).addTo(map);
                        n._losRepositionMarker = centerMarker;
                        centerMarker.on('drag', (ev) => {
                            const ll = ev.target.getLatLng();
                            n.meta.lat = ll.lat;
                            n.meta.lng = ll.lng;
                            rebuildLOSLayer(n);
                        });
                    }
                    if (n.children) n.children.forEach(enableDrag);
                })(node);
                showToast('Drag to reposition · click Done when finished', 'fa-arrows-up-down-left-right');
            }
            function moveLayerBy(node, dLat, dLng) {
                if (node.type === 'placemark' && node.layer) {
                    const ll = node.layer.getLatLng();
                    const newLL = [ll.lat + dLat, ll.lng + dLng];
                    node.layer.setLatLng(newLL);
                    node.meta.lat = newLL[0];
                    node.meta.lng = newLL[1];
                } else if ((node.type === 'path' || node.type === 'polygon' || node.type === 'measure' || node.type === 'measure-area') && node.layer) {
                    let lls = node.layer.getLatLngs();
                    function shiftLatLng(ll) { return L.latLng(ll.lat + dLat, ll.lng + dLng); }
                    if (Array.isArray(lls[0])) lls = lls.map(ring => ring.map(shiftLatLng));
                    else lls = lls.map(shiftLatLng);
                    node.layer.setLatLngs(lls);
                    node.meta.points = (Array.isArray(lls[0]) ? lls[0] : lls).map(p => [p.lat, p.lng]);
                }
                if (node.children) node.children.forEach(c => moveLayerBy(c, dLat, dLng));
            }
            function onRepositionDragEnd() {}
            async function endReposition() {
                if (!repositionState) return;
                const node = repositionState.node;
                (function teardown(n) {
                    if (n.type === 'placemark' && n.layer && n.layer.dragging) {
                        n.layer.dragging.disable();
                        n.layer.off('dragend', onRepositionDragEnd);
                    }
                    if (n._repositionHitbox) { map.removeLayer(n._repositionHitbox); n._repositionHitbox = null; }
                    if (n._losRepositionMarker) { map.removeLayer(n._losRepositionMarker); n._losRepositionMarker = null; }
                    if (n.layer && n.layer.getElement && n.layer.getElement()) n.layer.getElement().classList.remove('reposition-ring');
                    if (n.children) n.children.forEach(teardown);
                })(node);
                (function refreshMeta(n) {
                    if ((n.type === 'path' || n.type === 'polygon' || n.type === 'measure' || n.type === 'measure-area') && n.layer) {
                        let lls = n.layer.getLatLngs();
                        if (Array.isArray(lls[0])) lls = lls[0];
                        n.meta.points = lls.map(p => [p.lat, p.lng]);
                    }
                    if (n.children) n.children.forEach(refreshMeta);
                })(node);
                document.getElementById('reposition-banner').classList.remove('show');
                repositionState = null;
                renderTree();
                await persistTree();
                showToast('Reposition saved', 'fa-check');
            }
            document.getElementById('reposition-done').addEventListener('click', endReposition);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && repositionState) endReposition(); });

            // ==================== RAIL ====================
            const railBtns = document.querySelectorAll('.rail-btn[data-subrail]');
            railBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.subrail;
                    const isOpen = subrail.classList.contains('open');
                    const isSame = activeSection === key;
                    railBtns.forEach(b => b.classList.toggle('active', b === btn));
                    if (isOpen && isSame) {
                        subrail.classList.remove('open');
                        btn.classList.remove('active');
                    } else {
                        activeSection = key;
                        if (key !== 'places') placesTab = 'places';
                        subrail.classList.add('open');
                        renderTree();
                    }
                    updateMapToolsVisibility();
                });
            });
            document.getElementById('cache-btn').addEventListener('click', () => {
                showToast(`Cache: ${tileCache.size} tiles · ${cacheHits} hits / ${cacheMisses} misses`, 'fa-database');
            });

            // ==================== NEW FOLDER ====================
            async function promptNewFolder(parentFolder) {
                const result = await openNewNodeModal({ type: 'folder', name: 'New Folder', meta: { color: '#4d7c0f', desc: '' } });
                if (!result) return;
                const node = createNode({ type: 'folder', name: result.name, meta: { color: result.color, desc: result.desc }, children: [] });
                if (parentFolder) addNodeToTree(node, parentFolder);
                else addNodeToTree(node);
                await persistTree();
                showToast(`Folder created: ${result.name}`, 'fa-folder-plus');
            }

            // ==================== EDITOR PANEL ====================
            const editorPanel = document.getElementById('editor-panel');
            const editorPanelTitle = document.getElementById('editor-panel-title');
            const editorPanelSubtitle = document.getElementById('editor-panel-subtitle');
            const editorTabsEl = document.getElementById('editor-tabs');
            const editorBody = document.getElementById('editor-panel-body');
            const editorFooter = document.getElementById('editor-panel-footer');
            const editorCloseBtn = document.getElementById('editor-panel-close');

            let editorState = null;
            let _liveStyleTimer = null;
            let _livePropTimer = null;

            function scheduleLiveStyleApply() {
                clearTimeout(_liveStyleTimer);
                _liveStyleTimer = setTimeout(async () => {
                    if (!editorState) return;
                    await saveEditorStyle({ silent: true });
                }, 200);
            }
            function scheduleLivePropertiesApply() {
                clearTimeout(_livePropTimer);
                _livePropTimer = setTimeout(async () => {
                    if (!editorState) return;
                    await saveEditorProperties({ silent: true });
                }, 400);
            }
            function closeEditorPanel() {
                if (!editorState) return;
                clearTimeout(_livePropTimer);
                clearTimeout(_liveStyleTimer);
                if (editorState.teardown) editorState.teardown();
                editorPanel.classList.remove('open');
                editorState = null;
                editorFooter.innerHTML = '';
                setSnapZoneActive(false);
            }
            editorCloseBtn.addEventListener('click', closeEditorPanel);

            function openEditorPanel(node, startTab) {
                if (editorState) closeEditorPanel();
                const isShape = ['path','measure','polygon','measure-area'].includes(node.type);
                const isLOS = node.type === 'los';
                const isPlacemark = node.type === 'placemark';
                const isFolder = node.type === 'folder' || node.type === 'kml';
                const canEditVertices = isShape && node.meta.points && node.meta.points.length > 0;

                const tabs = [
                    { key: 'properties', icon: 'fa-circle-info', label: 'Properties' },
                    { key: 'style', icon: 'fa-palette', label: 'Style' }
                ];
                if (canEditVertices) tabs.push({ key: 'vertices', icon: 'fa-bezier-curve', label: 'Vertices' });
                const activeTab = startTab && tabs.find(t => t.key === startTab) ? startTab : 'properties';

                editorState = { node, activeTab, tabs, isShape, isLOS, isPlacemark, isFolder, canEditVertices, _newIcon: null };
                editorPanelTitle.childNodes[0].nodeValue = node.name + ' ';
                editorPanelSubtitle.textContent = (node.type || 'item').toUpperCase();

                const dragCleanup = enableEditingDragForNode(node);
                editorState.teardown = () => { dragCleanup && dragCleanup(); };

                renderEditorTabs();
                renderEditorBody();
                renderEditorFooter();
                editorPanel.classList.add('open');
                setTimeout(() => zoomToNode(node), 280);
                refreshSnapZoneMode();
            }

            function openBulkEditorForSelection() {
                if (multiSelection.size === 0) return;
                if (editorState) closeEditorPanel();

                const initialIds = Array.from(multiSelection);
                const resolvedIds = [];
                const missingIds = [];
                for (const id of initialIds) {
                    if (findNode(id)) resolvedIds.push(id);
                    else missingIds.push(id);
                }
                multiSelection = new Set(resolvedIds);

                if (resolvedIds.length === 0) {
                    showToast('Nothing to edit — selected items no longer exist', 'fa-info-circle');
                    renderTree();
                    return;
                }
                if (missingIds.length > 0) {
                    showToast(`${missingIds.length} item(s) no longer exist and were skipped`, 'fa-info-circle');
                    renderTree();
                }

                editorState = {
                    isBulkSelection: true,
                    selectionIds: resolvedIds,
                    activeTab: 'style',
                    tabs: [{ key: 'style', icon: 'fa-palette', label: 'Style' }],
                    _newIcon: null,
                    _bulkSubTab: null
                };
                editorPanelTitle.childNodes[0].nodeValue = `${resolvedIds.length} items selected `;
                editorPanelSubtitle.textContent = 'MULTI-SELECTION';
                renderEditorTabs();
                renderEditorBody();
                renderEditorFooter();
                editorPanel.classList.add('open');
            }

            function renderEditorTabs() {
                if (!editorState) return;
                editorTabsEl.innerHTML = '';
                editorState.tabs.forEach(t => {
                    const btn = document.createElement('button');
                    btn.className = 'editor-tab' + (editorState.activeTab === t.key ? ' active' : '');
                    btn.innerHTML = `<i class="fas ${t.icon}"></i> ${t.label}`;
                    btn.addEventListener('click', () => {
                        editorState.activeTab = t.key;
                        renderEditorTabs();
                        renderEditorBody();
                        renderEditorFooter();
                        refreshSnapZoneMode();
                    });
                    editorTabsEl.appendChild(btn);
                });
            }
            function renderEditorFooter() {
                if (!editorState) return;
                editorFooter.innerHTML = '';
                if (editorState.isBulkSelection) {
                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'btn btn-secondary';
                    cancelBtn.textContent = 'Cancel';
                    cancelBtn.addEventListener('click', () => {
                        multiSelection.clear();
                        closeEditorPanel();
                        renderTree();
                    });
                    editorFooter.appendChild(cancelBtn);
                    const saveBtn = document.createElement('button');
                    saveBtn.className = 'btn btn-primary';
                    saveBtn.innerHTML = `<i class="fas fa-check"></i> Apply to ${editorState.selectionIds.length}`;
                    saveBtn.addEventListener('click', async () => { await saveBulkSelection(); });
                    editorFooter.appendChild(saveBtn);
                    return;
                }
                if (editorState.activeTab === 'properties') {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-danger';
                    delBtn.innerHTML = '<i class="fas fa-trash"></i> Delete';
                    delBtn.addEventListener('click', async () => {
                        const node = editorState.node;
                        if (!confirm(`Delete "${node.name}"${node.children && node.children.length ? ' and all its children' : ''}?`)) return;
                        closeEditorPanel();
                        await deleteNodeWithChildren(node);
                        renderTree();
                        await persistTree();
                        showToast('Deleted', 'fa-trash');
                    });
                    editorFooter.appendChild(delBtn);
                }
            }
            function renderEditorBody() {
                if (!editorState) return;
                if (editorState.isBulkSelection) { renderBulkSelectionStyleTab(); return; }
                if (editorState.activeTab === 'properties') renderPropertiesTab();
                else if (editorState.activeTab === 'style') renderStyleTab();
                else if (editorState.activeTab === 'vertices') renderVerticesTab();
            }

            // ============ BULK STYLE ============
            function renderBulkSelectionStyleTab() {
                const ids = editorState.selectionIds;
                const nodes = ids.map(id => findNode(id)).filter(Boolean);
                const types = new Set(nodes.map(n => n.type));

                const subTabs = [];
                if (types.has('placemark')) subTabs.push({ key: 'marker', label: 'Markers', icon: 'fa-map-pin' });
                if (types.has('path') || types.has('measure') || types.has('polygon') || types.has('measure-area'))
                    subTabs.push({ key: 'path', label: 'Paths', icon: 'fa-route' });
                if (types.has('los')) subTabs.push({ key: 'los', label: 'LOS', icon: 'fa-satellite-dish' });
                if (types.has('folder') || types.has('kml')) subTabs.push({ key: 'folder', label: 'Folders', icon: 'fa-folder' });
                if (subTabs.length > 1) subTabs.unshift({ key: 'all', label: 'All', icon: 'fa-layer-group' });
                if (subTabs.length === 0) subTabs.push({ key: 'all', label: 'All', icon: 'fa-layer-group' });

                if (!editorState._bulkSubTab || !subTabs.find(t => t.key === editorState._bulkSubTab)) {
                    editorState._bulkSubTab = subTabs[0].key;
                }
                const tab = editorState._bulkSubTab;

                const first = nodes[0] || { meta: {} };
                const color = first.meta.color || '#4d7c0f';
                const ringRadius = first.meta.ringRadius || 0;
                const ringThickness = first.meta.ringThickness || 0;
                const lineThickness = first.meta.lineThickness || 3;

                const swatches = COLOR_PRESETS.map(c => `<div class="swatch" data-color="${c}" style="background:${c};" title="${c}"></div>`).join('');

                const colorSection = `
                    <div class="editor-section-label">Colour</div>
                    <div class="editor-field">
                        <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;">
                            <input type="color" id="bulk-ed-color" value="${color}">
                            <input type="text" id="bulk-ed-hex" value="${color}" maxlength="7" style="font-family:'IBM Plex Mono',monospace;">
                        </div>
                        <div class="swatch-grid" id="bulk-ed-swatch-grid">${swatches}</div>
                    </div>
                `;
                const markerSection = `
                    <div class="editor-section-label">Marker icon</div>
                    <div class="icon-grid" id="bulk-icon-grid" style="max-height:130px;">
                        ${Object.keys(ICON_LIBRARY).map(cat => {
                            let out = `<div class="icon-cat-title">${cat}</div>`;
                            ICON_LIBRARY[cat].forEach(icon => {
                                out += `<div class="icon-choice" data-fa="${icon.fa}" title="${icon.label}"><i class="fas ${icon.fa}"></i></div>`;
                            });
                            return out;
                        }).join('')}
                    </div>
                    <div class="editor-section-label">Ring</div>
                    <div class="editor-field-row">
                        <div class="editor-field"><label>Radius (px)</label><input type="number" id="bulk-ring-radius" value="${ringRadius}" min="0" step="1"></div>
                        <div class="editor-field"><label>Thickness (px)</label><input type="number" id="bulk-ring-thickness" value="${ringThickness}" min="0" step="1"></div>
                    </div>
                `;
                const pathSection = `
                    <div class="editor-section-label">Line thickness</div>
                    <div class="editor-value-row">
                        <input type="range" id="bulk-line-thickness" value="${lineThickness}" min="1" max="12" step="1">
                        <span class="val" id="bulk-line-val">${lineThickness}px</span>
                    </div>
                `;

                editorBody.innerHTML = `
                    ${subTabs.length > 1 ? `
                        <div class="style-subtabs">
                            ${subTabs.map(t => `<button class="style-subtab ${tab === t.key ? 'active' : ''}" data-bulksub="${t.key}"><i class="fas ${t.icon}"></i> ${t.label}</button>`).join('')}
                        </div>
                    ` : ''}
                    <div class="editor-hint" style="margin-bottom:12px;">Applying to <strong>${nodes.length}</strong> selected item(s).</div>
                    ${colorSection}
                    ${(tab === 'all' || tab === 'marker') ? markerSection : ''}
                    ${(tab === 'all' || tab === 'path') ? pathSection : ''}
                    ${tab === 'los' ? `<div class="editor-hint">LOS objects use colour only in bulk mode.</div>` : ''}
                    ${tab === 'folder' ? `<div class="editor-hint">Folder colours tint the folder icon in the tree.</div>` : ''}
                `;

                editorBody.querySelectorAll('[data-bulksub]').forEach(b => {
                    b.addEventListener('click', () => {
                        editorState._bulkSubTab = b.dataset.bulksub;
                        renderEditorBody();
                    });
                });

                const colorInp = editorBody.querySelector('#bulk-ed-color');
                const hexInp = editorBody.querySelector('#bulk-ed-hex');
                const swatchGrid = editorBody.querySelector('#bulk-ed-swatch-grid');
                let bulkIcon = null;
                let bulkRingRadius = ringRadius;
                let bulkRingThickness = ringThickness;
                let bulkLineThickness = lineThickness;

                function setColor(c, fromInput) {
                    if (!/^#[0-9a-fA-F]{6}$/.test(c)) return;
                    if (!fromInput) colorInp.value = c;
                    hexInp.value = c.toLowerCase();
                    swatchGrid.querySelectorAll('.swatch').forEach(sw => {
                        sw.style.borderColor = (sw.dataset.color.toLowerCase() === c.toLowerCase()) ? 'var(--ink)' : 'transparent';
                    });
                    const ig = editorBody.querySelector('#bulk-icon-grid');
                    if (ig) ig.querySelectorAll('.icon-choice i').forEach(i => i.style.color = c);
                }
                colorInp.addEventListener('input', () => setColor(colorInp.value, true));
                hexInp.addEventListener('input', () => setColor(hexInp.value));
                swatchGrid.querySelectorAll('.swatch').forEach(sw => sw.addEventListener('click', () => setColor(sw.dataset.color)));
                setColor(color);

                const iconGrid = editorBody.querySelector('#bulk-icon-grid');
                if (iconGrid) {
                    iconGrid.querySelectorAll('.icon-choice').forEach(el => {
                        el.querySelector('i').style.color = color;
                        el.addEventListener('click', () => {
                            iconGrid.querySelectorAll('.icon-choice').forEach(x => x.classList.remove('selected'));
                            el.classList.add('selected');
                            bulkIcon = el.dataset.fa;
                        });
                    });
                }
                const ringRadiusInp = editorBody.querySelector('#bulk-ring-radius');
                const ringThickInp = editorBody.querySelector('#bulk-ring-thickness');
                if (ringRadiusInp) ringRadiusInp.addEventListener('input', () => { bulkRingRadius = parseFloat(ringRadiusInp.value) || 0; });
                if (ringThickInp) ringThickInp.addEventListener('input', () => { bulkRingThickness = parseFloat(ringThickInp.value) || 0; });
                const lineRange = editorBody.querySelector('#bulk-line-thickness');
                const lineVal = editorBody.querySelector('#bulk-line-val');
                if (lineRange) {
                    lineRange.addEventListener('input', () => {
                        bulkLineThickness = parseInt(lineRange.value, 10) || 1;
                        lineVal.textContent = bulkLineThickness + 'px';
                    });
                }
                editorState._bulk = {
                    tab: () => editorState._bulkSubTab,
                    color: () => hexInp.value || colorInp.value,
                    icon: () => bulkIcon,
                    ringRadius: () => bulkRingRadius,
                    ringThickness: () => bulkRingThickness,
                    lineThickness: () => bulkLineThickness
                };
            }

            async function saveBulkSelection() {
                if (!editorState || !editorState._bulk) return;
                const b = editorState._bulk;
                const tab = b.tab();
                const newColor = b.color();
                const newIcon = b.icon();
                const newRingRadius = b.ringRadius();
                const newRingThickness = b.ringThickness();
                const newLineThickness = b.lineThickness();

                editorState.selectionIds = editorState.selectionIds.filter(id => findNode(id));
                multiSelection = new Set(editorState.selectionIds);

                let count = 0;
                for (const id of editorState.selectionIds) {
                    const n = findNode(id);
                    if (!n) continue;
                    const applyColorToAll = (tab === 'all' || tab === 'folder' || tab === 'marker' || tab === 'path' || tab === 'los');
                    const applyMarker = (tab === 'all' || tab === 'marker');
                    const applyPath = (tab === 'all' || tab === 'path');
                    const applyLOS = (tab === 'all' || tab === 'los');

                    if (applyColorToAll) n.meta.color = newColor;
                    if (n.type === 'placemark') {
                        if (applyMarker) {
                            if (newIcon) n.meta.icon = newIcon;
                            n.meta.ringRadius = newRingRadius;
                            n.meta.ringThickness = newRingThickness;
                            if (n.layer && n.layer.setIcon) n.layer.setIcon(makeIconFromNode(n));
                        }
                    } else if (n.type === 'los') {
                        if (applyLOS || tab === 'all') rebuildLOSLayer(n);
                    } else if (['path','measure','polygon','measure-area'].includes(n.type)) {
                        if (applyPath) {
                            n.meta.lineThickness = newLineThickness;
                            if (n.layer && n.layer.setStyle) n.layer.setStyle({ color: n.meta.color, weight: n.meta.lineThickness });
                        }
