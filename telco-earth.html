                    const dangerHeading = document.createElement('div');
                    dangerHeading.style.cssText = 'font-family: "IBM Plex Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--danger); font-weight: 600; padding: 22px 4px 8px; display: flex; align-items: center; gap: 6px;';
                    dangerHeading.innerHTML = '<i class="fas fa-triangle-exclamation"></i> Clear data';
                    subrailBody.appendChild(dangerHeading);

                    const dangerItems = [
                        { icon: 'fa-eye-slash', label: 'Clear view', desc: 'Hide all places and heatmaps', action: async () => {
                            if (!confirm('Hide all places and heatmaps from the map?')) return;
                            treeNodes.forEach(n => setNodeVisible(n, false));
                            visibleTiles.clear();
                            syncShowAllState();
                            redrawTerrainOverlays();
                            renderTree();
                            await persistTree();
                            showToast('View cleared', 'fa-eye-slash');
                        }},
                        { icon: 'fa-database', label: 'Clear map tile cache', desc: 'Free in-memory tile cache', action: () => {
                            if (!confirm('Clear in-memory tile cache?')) return;
                            tileCache.forEach(e => e.url && URL.revokeObjectURL(e.url));
                            tileCache.clear();
                            cacheHits = 0; cacheMisses = 0;
                            showToast('Map tile cache cleared', 'fa-database');
                        }},
                        { icon: 'fa-mountain', label: 'Clear HGT data', desc: 'Delete stored terrain tiles', action: async () => {
                            if (!confirm('Delete all HGT tiles from the browser? This cannot be undone.')) return;
                            await dbClear('terrain');
                            terrainStore.clear();
                            visibleTiles.clear();
                            heatmapCache.clear();
                            updateTerrainVisibility();
                            redrawTerrainOverlays();
                            const tf = findNodeByName('Terrain (HGT)');
                            if (tf) removeNode(tf.id);
                            renderTree();
                            await persistTree();
                            showToast('HGT data cleared', 'fa-trash-alt');
                        }},
                        { icon: 'fa-map-location-dot', label: 'Clear places data', desc: 'Delete all saved places', action: async () => {
                            if (!confirm('Delete all places from the browser? This cannot be undone.')) return;
                            await dbClear('places');
                            treeNodes = [];
                            drawnItems.clearLayers();
                            selectedNodeId = null;
                            renderTree();
                            showToast('Places data cleared', 'fa-trash-alt');
                        }}
                    ];
                    dangerItems.forEach(it => {
                        const el = document.createElement('div');
                        el.className = 'static-item danger';
                        el.innerHTML = `
                            <div class="static-item-icon"><i class="fas ${it.icon}"></i></div>
                            <div class="static-item-body">
                                <div class="static-item-label">${it.label}</div>
                                <div class="static-item-desc">${it.desc}</div>
                            </div>
                        `;
                        el.addEventListener('click', () => it.action());
                        subrailBody.appendChild(el);
                    });
                }
            }

            function selectNode(node) {
                selectedNodeId = node.id;
                renderTree();
                if (node.layer && node.layer.openPopup) {
                    try { node.layer.openPopup(); } catch(e){}
                }
            }

            // ==================== REPOSITION ====================
            let repositionState = null;
            function startReposition(node) {
                if (repositionState) endReposition();
                repositionState = { node };
                document.getElementById('reposition-banner').classList.add('show');

                (function applyRing(n) {
                    if (n.layer && n.layer.getElement && n.layer.getElement()) {
                        n.layer.getElement().classList.add('reposition-ring');
                    }
                    if (n.children) n.children.forEach(applyRing);
                })(node);

                (function enableDrag(n) {
                    if (n.type === 'placemark' && n.layer && n.layer.dragging) {
                        n.layer.dragging.enable();
                        n.layer.on('dragend', onRepositionDragEnd);
                    } else if ((n.type === 'path' || n.type === 'polygon' ||
                                n.type === 'measure' || n.type === 'measure-area') && n.layer) {
                        const bounds = n.layer.getBounds();
                        if (bounds && bounds.isValid()) {
                            const hitbox = L.rectangle(bounds, {
                                color: 'transparent', fillColor: 'transparent',
                                interactive: true, className: 'reposition-ring'
                            }).addTo(map);
                            n._repositionHitbox = hitbox;
                            let dragStart = null;
                            hitbox.on('mousedown', (ev) => {
                                L.DomEvent.stopPropagation(ev);
                                dragStart = { latlng: ev.latlng };
                                map.dragging.disable();
                                map.on('mousemove', onMove);
                                map.on('mouseup', onUp);
                            });
                            function onMove(ev) {
                                if (!dragStart) return;
                                const dLat = ev.latlng.lat - dragStart.latlng.lat;
                                const dLng = ev.latlng.lng - dragStart.latlng.lng;
                                moveLayerBy(n, dLat, dLng);
                                dragStart.latlng = ev.latlng;
                                hitbox.setBounds(n.layer.getBounds());
                            }
                            function onUp() {
                                dragStart = null;
                                map.dragging.enable();
                                map.off('mousemove', onMove);
                                map.off('mouseup', onUp);
                            }
                        }
                    } else if (n.type === 'los' && n.layer) {
                        const centerMarker = L.marker([n.meta.lat, n.meta.lng], {
                            icon: L.divIcon({ className: 'vertex-marker', iconSize: [14, 14] }),
                            draggable: true, zIndexOffset: 1000
                        }).addTo(map);
                        n._losRepositionMarker = centerMarker;
                        centerMarker.on('drag', (ev) => {
                            const ll = ev.target.getLatLng();
                            n.meta.lat = ll.lat;
                            n.meta.lng = ll.lng;
                            const layers = buildLOSLayers(n);
                            if (n.layer) drawnItems.removeLayer(n.layer);
                            n.layer = L.layerGroup(layers);
                            n.layer.addTo(drawnItems);
                        });
                    }
                    if (n.children) n.children.forEach(enableDrag);
                })(node);

                showToast('Drag to reposition · click Done when finished', 'fa-arrows-up-down-left-right');
            }
            function moveLayerBy(node, dLat, dLng) {
                if (node.type === 'placemark' && node.layer) {
                    const ll = node.layer.getLatLng();
                    const newLL = [ll.lat + dLat, ll.lng + dLng];
                    node.layer.setLatLng(newLL);
                    node.meta.lat = newLL[0];
                    node.meta.lng = newLL[1];
                } else if ((node.type === 'path' || node.type === 'polygon' ||
                            node.type === 'measure' || node.type === 'measure-area') && node.layer) {
                    let lls = node.layer.getLatLngs();
                    function shiftLatLng(ll) { return L.latLng(ll.lat + dLat, ll.lng + dLng); }
                    if (Array.isArray(lls[0])) lls = lls.map(ring => ring.map(shiftLatLng));
                    else lls = lls.map(shiftLatLng);
                    node.layer.setLatLngs(lls);
                    node.meta.points = (Array.isArray(lls[0]) ? lls[0] : lls).map(p => [p.lat, p.lng]);
                }
                if (node.children) node.children.forEach(c => moveLayerBy(c, dLat, dLng));
            }
            function onRepositionDragEnd() {}
            async function endReposition() {
                if (!repositionState) return;
                const node = repositionState.node;
                (function teardown(n) {
                    if (n.type === 'placemark' && n.layer && n.layer.dragging) {
                        n.layer.dragging.disable();
                        n.layer.off('dragend', onRepositionDragEnd);
                    }
                    if (n._repositionHitbox) {
                        map.removeLayer(n._repositionHitbox);
                        n._repositionHitbox = null;
                    }
                    if (n._losRepositionMarker) {
                        map.removeLayer(n._losRepositionMarker);
                        n._losRepositionMarker = null;
                    }
                    if (n.layer && n.layer.getElement && n.layer.getElement()) {
                        n.layer.getElement().classList.remove('reposition-ring');
                    }
                    if (n.children) n.children.forEach(teardown);
                })(node);
                (function refreshMeta(n) {
                    if ((n.type === 'path' || n.type === 'polygon' ||
                         n.type === 'measure' || n.type === 'measure-area') && n.layer) {
                        let lls = n.layer.getLatLngs();
                        if (Array.isArray(lls[0])) lls = lls[0];
                        n.meta.points = lls.map(p => [p.lat, p.lng]);
                    }
                    if (n.children) n.children.forEach(refreshMeta);
                })(node);
                document.getElementById('reposition-banner').classList.remove('show');
                repositionState = null;
                renderTree();
                await persistTree();
                showToast('Reposition saved', 'fa-check');
            }
            document.getElementById('reposition-done').addEventListener('click', endReposition);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && repositionState) endReposition();
            });

            // ==================== RAIL ====================
            const railBtns = document.querySelectorAll('.rail-btn[data-subrail]');
            railBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const key = btn.dataset.subrail;
                    const isOpen = subrail.classList.contains('open');
                    const isSame = activeSection === key;
                    railBtns.forEach(b => b.classList.toggle('active', b === btn));

                    if (!isSame) {
                        subrail.classList.remove('wide');
                        placesViewMode = 'list';
                    }

                    if (isOpen && isSame) {
                        subrail.classList.remove('open');
                        btn.classList.remove('active');
                        subrail.classList.remove('wide');
                    } else {
                        activeSection = key;
                        subrail.classList.add('open');
                        renderTree();
                    }
                    updateMapToolsVisibility();
                });
            });

            document.getElementById('sb-search').addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                subrailBody.querySelectorAll('.tree-item').forEach(el => {
                    const label = el.querySelector('.tree-item-label');
                    if (!label) return;
                    el.parentElement.style.display = label.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
            });

            document.getElementById('cache-btn').addEventListener('click', () => {
                showToast(`Cache: ${tileCache.size} tiles · ${cacheHits} hits / ${cacheMisses} misses`, 'fa-database');
            });

            // ==================== NEW FOLDER ====================
            async function promptNewFolder() {
                const result = await openEditor({ type: 'folder', name: 'New Folder', meta: { color: '#4d7c0f', desc: '' } }, { isNew: true });
                if (!result) return;
                const node = createNode({
                    type: 'folder', name: result.name,
                    meta: { color: result.color, desc: result.desc },
                    expanded: true, children: []
                });
                addNodeToTree(node);
                await persistTree();
                showToast(`Folder created: ${result.name}`, 'fa-folder-plus');
            }

            // ==================== UNIFIED EDITOR ====================
            async function openEditor(node, options = {}) {
                const isNew = options.isNew === true;
                const type = node.type;
                const isPlacemark = (type === 'placemark') || (isNew && options.type === 'placemark');
                const isFolder = type === 'folder' || type === 'kml';
                const isLOS = type === 'los' || (isNew && options.type === 'los');

                let selectedIcon = (node.meta && node.meta.icon) ? node.meta.icon : DEFAULT_ICON;
                let selectedColor = (node.meta && node.meta.color) || (isLOS ? '#ea580c' : '#4d7c0f');
                let name = node.name || 'Untitled';
                let desc = (node.meta && node.meta.desc) || '';
                let bulkFilter = 'all';
                let bulkIcon = selectedIcon;

                let losRadius = (node.meta && node.meta.radius) || 10000;
                let losLines = (node.meta && node.meta.numLines) || 36;
                let losCenterH = (node.meta && node.meta.centerHeight) || 30;
                let losTargetH = (node.meta && node.meta.targetHeight) || 2;
                let losContour = (node.meta && node.meta.contourInterval) || 500;

                return new Promise(resolve => {
                    const modal = document.getElementById('modal-overlay');
                    const box = document.getElementById('modal-box');
                    const title = document.getElementById('modal-title');
                    const body = document.getElementById('modal-body');
                    const actions = document.getElementById('modal-actions');

                    box.classList.add('wide');
                    title.innerHTML = `<i class="fas ${TYPE_ICONS[type] || 'fa-pen'}"></i> ${isNew ? 'New' : 'Edit'} ${type}`;

                    let iconPickerHTML = '';
                    if (isPlacemark) {
                        iconPickerHTML = `<label>Icon</label><div class="icon-grid" id="icon-grid">`;
                        Object.keys(ICON_LIBRARY).forEach(cat => {
                            iconPickerHTML += `<div class="icon-cat-title">${cat}</div>`;
                            ICON_LIBRARY[cat].forEach(icon => {
                                const sel = icon.fa === selectedIcon ? 'selected' : '';
                                iconPickerHTML += `<div class="icon-choice ${sel}" data-fa="${icon.fa}" title="${icon.label}"><i class="fas ${icon.fa}"></i></div>`;
                            });
                        });
                        iconPickerHTML += `</div>`;
                    }

                    let losHTML = '';
                    if (isLOS) {
                        losHTML = `
                            <label>LOS parameters</label>
                            <div class="modal-row">
                                <div>
                                    <label style="text-transform:none;letter-spacing:0;font-size:0.68rem;">Radius (m)</label>
                                    <input type="number" id="los-radius" value="${losRadius}" min="100" step="100">
                                </div>
                                <div>
                                    <label style="text-transform:none;letter-spacing:0;font-size:0.68rem;">Lines</label>
                                    <input type="number" id="los-lines" value="${losLines}" min="4" max="180" step="2">
                                </div>
                            </div>
                            <div class="modal-row">
                                <div>
                                    <label style="text-transform:none;letter-spacing:0;font-size:0.68rem;">Antenna height (m)</label>
                                    <input type="number" id="los-ch" value="${losCenterH}" min="0" step="1">
                                </div>
                                <div>
                                    <label style="text-transform:none;letter-spacing:0;font-size:0.68rem;">Target height (m)</label>
                                    <input type="number" id="los-th" value="${losTargetH}" min="0" step="1">
                                </div>
                            </div>
                            <label style="text-transform:none;letter-spacing:0;font-size:0.68rem;">Contour interval (m)</label>
                            <input type="number" id="los-contour" value="${losContour}" min="0" step="50">
                        `;
                    }

                    const swatchHTML = COLOR_PRESETS.map(c =>
                        `<div class="swatch" data-color="${c}" style="background:${c};" title="${c}"></div>`
                    ).join('');

                    let bulkHTML = '';
                    if (isFolder && !isNew) {
                        bulkHTML = `
                            <div class="bulk-edit-section" id="bulk-section">
                                <div class="bulk-edit-header"><i class="fas fa-layer-group"></i> Bulk edit children</div>
                                <div class="bulk-filter-row">
                                    <button class="bulk-filter active" data-filter="all">All</button>
                                    <button class="bulk-filter" data-filter="placemark">Markers only</button>
                                    <button class="bulk-filter" data-filter="line">Lines / polygons</button>
                                </div>
                                <div style="font-size:0.72rem; color:var(--sage); margin-bottom:10px;" id="bulk-count">—</div>

                                <div class="bulk-subsection">
                                    <div class="bulk-subsection-title">Icon (markers only)</div>
                                    <div class="icon-grid" id="bulk-icon-grid" style="max-height:120px;">
                                        ${Object.keys(ICON_LIBRARY).map(cat => {
                                            let out = `<div class="icon-cat-title">${cat}</div>`;
                                            ICON_LIBRARY[cat].forEach(icon => {
                                                const sel = icon.fa === bulkIcon ? 'selected' : '';
                                                out += `<div class="icon-choice ${sel}" data-fa="${icon.fa}" title="${icon.label}"><i class="fas ${icon.fa}"></i></div>`;
                                            });
                                            return out;
                                        }).join('')}
                                    </div>
                                </div>

                                <div class="bulk-subsection">
                                    <div class="bulk-subsection-title">Color (all selected types)</div>
                                    <div class="swatch-grid" id="bulk-swatch-grid" style="margin-top:6px;margin-bottom:8px;">${swatchHTML}</div>
                                </div>

                                <button class="btn btn-primary" id="bulk-apply" style="width:100%; margin-top:6px;">
                                    <i class="fas fa-check"></i> Apply to <span id="bulk-count-inline">0</span> item(s)
                                </button>
                            </div>`;
                    }

                    body.innerHTML = `
                        <label>Name</label>
                        <input type="text" id="ed-name" value="${escapeHtml(name)}" placeholder="Enter name…">

                        <label>Description</label>
                        <textarea id="ed-desc" rows="3" placeholder="Optional description…">${escapeHtml(desc)}</textarea>

                        ${iconPickerHTML}
                        ${losHTML}

                        <label>Color</label>
                        <div class="color-row">
                            <input type="color" id="ed-color" class="color-input" value="${selectedColor}">
                            <input type="text" id="ed-hex" class="color-hex" value="${selectedColor}" maxlength="7">
                        </div>
                        <div class="swatch-grid" id="swatch-grid">${swatchHTML}</div>

                        ${bulkHTML}
                    `;

                    function applyColorToIcons() {
                        if (!isPlacemark) return;
                        const grid = body.querySelector('#icon-grid');
                        if (!grid) return;
                        grid.querySelectorAll('.icon-choice i').forEach(i => { i.style.color = selectedColor; });
                    }

                    if (isPlacemark) {
                        const grid = body.querySelector('#icon-grid');
                        grid.querySelectorAll('.icon-choice').forEach(el => {
                            el.addEventListener('click', () => {
                                grid.querySelectorAll('.icon-choice').forEach(x => x.classList.remove('selected'));
                                el.classList.add('selected');
                                selectedIcon = el.dataset.fa;
                            });
                        });
                        applyColorToIcons();
                    }

                    const colorInput = body.querySelector('#ed-color');
                    const hexInput = body.querySelector('#ed-hex');
                    const swatchGrid = body.querySelector('#swatch-grid');

                    function setColor(c, fromInput) {
                        if (!/^#[0-9a-fA-F]{6}$/.test(c)) return;
                        selectedColor = c.toLowerCase();
                        if (!fromInput) colorInput.value = selectedColor;
                        hexInput.value = selectedColor;
                        swatchGrid.querySelectorAll('.swatch').forEach(sw => {
                            sw.style.borderColor = (sw.dataset.color.toLowerCase() === selectedColor) ? 'var(--ink)' : 'transparent';
                        });
                        applyColorToIcons();
                        const bulkGrid = body.querySelector('#bulk-icon-grid');
                        if (bulkGrid) bulkGrid.querySelectorAll('.icon-choice i').forEach(i => i.style.color = selectedColor);
                    }
                    colorInput.addEventListener('input', () => setColor(colorInput.value, true));
                    hexInput.addEventListener('input', () => setColor(hexInput.value));
                    swatchGrid.querySelectorAll('.swatch').forEach(sw => {
                        sw.addEventListener('click', () => setColor(sw.dataset.color));
                    });
                    setColor(selectedColor);

                    if (isLOS) {
                        body.querySelector('#los-radius').addEventListener('input', e => losRadius = parseFloat(e.target.value) || 10000);
                        body.querySelector('#los-lines').addEventListener('input', e => losLines = parseInt(e.target.value, 10) || 36);
                        body.querySelector('#los-ch').addEventListener('input', e => losCenterH = parseFloat(e.target.value) || 0);
                        body.querySelector('#los-th').addEventListener('input', e => losTargetH = parseFloat(e.target.value) || 0);
                        body.querySelector('#los-contour').addEventListener('input', e => losContour = parseFloat(e.target.value) || 0);
                    }

                    if (isFolder && !isNew) {
                        const countEl = body.querySelector('#bulk-count');
                        const countInline = body.querySelector('#bulk-count-inline');
                        function countChildren() {
                            let n = 0;
                            (function walk(node) {
                                if (node.children) node.children.forEach(c => {
                                    if (bulkFilter === 'all') n++;
                                    else if (bulkFilter === 'placemark' && c.type === 'placemark') n++;
                                    else if (bulkFilter === 'line' && ['path','polygon','measure','measure-area'].includes(c.type)) n++;
                                    walk(c);
                                });
                            })(node);
                            return n;
                        }
                        function refreshCount() {
                            const c = countChildren();
                            countEl.textContent = `${c} item(s) will be updated`;
                            countInline.textContent = c;
                        }
                        body.querySelectorAll('.bulk-filter').forEach(btn => {
                            btn.addEventListener('click', () => {
                                body.querySelectorAll('.bulk-filter').forEach(b => b.classList.remove('active'));
                                btn.classList.add('active');
                                bulkFilter = btn.dataset.filter;
                                refreshCount();
                            });
                        });

                        const bulkGrid = body.querySelector('#bulk-icon-grid');
                        bulkGrid.querySelectorAll('.icon-choice').forEach(el => {
                            el.addEventListener('click', () => {
                                bulkGrid.querySelectorAll('.icon-choice').forEach(x => x.classList.remove('selected'));
                                el.classList.add('selected');
                                bulkIcon = el.dataset.fa;
                            });
                            el.querySelector('i').style.color = selectedColor;
                        });

                        const bulkSwatches = body.querySelector('#bulk-swatch-grid');
                        bulkSwatches.querySelectorAll('.swatch').forEach(sw => {
                            sw.addEventListener('click', () => setColor(sw.dataset.color));
                        });

                        refreshCount();

                        body.querySelector('#bulk-apply').addEventListener('click', async () => {
                            const newColor = selectedColor;
                            const newIcon = bulkIcon;
                            let count = 0;
                            (function walk(node) {
                                if (node.children) node.children.forEach(c => {
                                    if (bulkFilter === 'all' ||
                                        (bulkFilter === 'placemark' && c.type === 'placemark') ||
                                        (bulkFilter === 'line' && ['path','polygon','measure','measure-area'].includes(c.type))) {
                                        c.meta.color = newColor;
                                        if (c.type === 'placemark') {
                                            c.meta.icon = newIcon;
                                            if (c.layer && c.layer.setIcon) {
                                                c.layer.setIcon(makeLeafletIcon(newIcon, newColor));
                                            }
                                        } else if (c.layer && c.layer.setStyle) {
                                            c.layer.setStyle({ color: newColor });
                                        }
                                        count++;
                                    }
                                    walk(c);
                                });
                            })(node);
                            renderTree();
                            await persistTree();
                            showToast(`Updated ${count} item(s)`, 'fa-check');
                        });
                    }

                    actions.innerHTML = `
                        <button class="btn btn-secondary" id="ed-cancel">Cancel</button>
                        ${!isNew ? '<button class="btn btn-secondary" id="ed-reposition"><i class="fas fa-arrows-up-down-left-right"></i> Reposition</button>' : ''}
                        ${!isNew ? '<button class="btn btn-danger" id="ed-delete"><i class="fas fa-trash"></i> Delete</button>' : ''}
                        <button class="btn btn-primary" id="ed-save">${isNew ? 'Create' : 'Save'}</button>
                    `;

                    const cleanup = () => {
                        modal.classList.remove('open');
                        box.classList.remove('wide');
                        body.innerHTML = '';
                        actions.innerHTML = `
                            <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                            <button class="btn btn-primary" id="modal-ok">Save</button>
                        `;
                    };

                    body.querySelector('#ed-name').focus();
                    body.querySelector('#ed-name').select();

                    document.getElementById('ed-save').addEventListener('click', () => {
                        const n = body.querySelector('#ed-name').value.trim() || 'Untitled';
                        const d = body.querySelector('#ed-desc').value.trim();
                        cleanup();
                        resolve({
                            name: n, desc: d, icon: selectedIcon, color: selectedColor,
                            los: {
                                radius: losRadius,
                                numLines: losLines,
                                centerHeight: losCenterH,
                                targetHeight: losTargetH,
                                contourInterval: losContour
                            }
                        });
                    });

                    if (!isNew) {
                        document.getElementById('ed-delete').addEventListener('click', async () => {
                            if (!confirm(`Delete "${name}"?`)) return;
                            cleanup();
                            await deleteNodeWithChildren(findNode(node.id));
                            renderTree();
                            await persistTree();
                            showToast('Deleted', 'fa-trash');
                            resolve(null);
                        });
                        document.getElementById('ed-reposition').addEventListener('click', () => {
                            cleanup();
                            resolve(null);
                            setTimeout(() => startReposition(findNode(node.id)), 80);
                        });
                    }

                    document.getElementById('ed-cancel').addEventListener('click', () => { cleanup(); resolve(null); });
                    modal.classList.add('open');
                    const onKey = (e) => {
                        if (e.key === 'Escape') {
                            document.removeEventListener('keydown', onKey);
                            cleanup(); resolve(null);
                        } else if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
                            document.removeEventListener('keydown', onKey);
                            document.getElementById('ed-save').click();
                        }
                    };
                    document.addEventListener('keydown', onKey);
                });
            }

            async function applyEditorResult(node, result) {
                if (!result) return;
                node.name = result.name;
                node.meta.desc = result.desc;
                if (node.type === 'placemark') {
                    node.meta.icon = result.icon;
                    node.meta.color = result.color;
                    if (node.layer && node.layer.setIcon) {
                        node.layer.setIcon(makeLeafletIcon(result.icon, result.color));
                    }
                    if (node.layer && node.layer.getPopup && node.layer.getPopup()) {
                        const desc = node.meta.desc ? '<br>' + escapeHtml(node.meta.desc) : '';
                        node.layer.setPopupContent(`<b>${escapeHtml(node.name)}</b>${desc}`);
                    }
                } else if (node.type === 'los') {
                    node.meta.color = result.color;
                    node.meta.radius = result.los.radius;
                    node.meta.numLines = result.los.numLines;
                    node.meta.centerHeight = result.los.centerHeight;
                    node.meta.targetHeight = result.los.targetHeight;
                    node.meta.contourInterval = result.los.contourInterval;
                    const layers = buildLOSLayers(node);
                    const wasVisible = node.visible !== false;
                    if (node.layer) drawnItems.removeLayer(node.layer);
                    node.layer = L.layerGroup(layers);
                    if (wasVisible) node.layer.addTo(drawnItems);
                } else {
                    node.meta.color = result.color;
                    if (node.layer && node.layer.setStyle) {
                        node.layer.setStyle({ color: result.color });
                    }
                }
                renderTree();
                await persistTree();
                showToast('Saved', 'fa-check');
            }
            const _openEditorRaw = openEditor;
            openEditor = async function(node, options = {}) {
                const result = await _openEditorRaw(node, options);
                if (options.isNew || result === null) return result;
                await applyEditorResult(findNode(node.id), result);
                return null;
            };

            // ==================== SPREADSHEET IMPORT ====================
            function openSpreadsheetImport() {
                const fsOverlay = document.getElementById('fs-modal-overlay');
                const fsContent = document.getElementById('fs-modal-content');

                fsContent.innerHTML = `
                    <div class="sheet-layout">
                        <div class="sheet-header">
                            <h2>Import from spreadsheet</h2>
                            <button class="detail-close" id="sheet-close"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="sheet-body">
                            <div class="sheet-col">
                                <div class="sheet-panel">
                                    <div class="sheet-panel-title">01 — Paste data</div>
                                    <textarea class="sheet-paste" id="sheet-paste" placeholder="Paste cells from Excel (Ctrl+V / Cmd+V) — include header row."></textarea>
                                </div>
                                <div class="sheet-panel" id="sheet-mapping-panel" style="display:none;">
                                    <div class="sheet-panel-title">02 — Map columns</div>
                                    <div class="sheet-mapping-row">
                                        <div><label>Latitude</label><select id="sheet-lat"></select></div>
                                        <div><label>Longitude</label><select id="sheet-lon"></select></div>
                                    </div>
                                    <div class="sheet-mapping-row">
                                        <div><label>Name</label><select id="sheet-name"></select></div>
                                        <div><label>Description</label><select id="sheet-desc"></select></div>
                                    </div>
                                    <div style="font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ink-3);margin-top:4px;" id="sheet-count"></div>
                                </div>
                            </div>
                            <div class="sheet-col">
                                <div class="sheet-panel" style="flex:1;">
                                    <div class="sheet-panel-title">03 — Preview</div>
                                    <div class="sheet-preview" id="sheet-preview">
                                        <div style="padding:20px;text-align:center;color:var(--ink-3);font-size:0.78rem;">Paste data on the left</div>
                                    </div>
                                    <div style="display:flex;gap:8px;margin-top:14px;">
                                        <button class="btn btn-secondary" id="sheet-cancel" style="flex:1;">Cancel</button>
                                        <button class="btn btn-primary" id="sheet-commit" style="flex:2;" disabled>
                                            <i class="fas fa-upload"></i> Import as placemarks
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                fsOverlay.classList.add('open');
                updateMapToolsVisibility();

                const pasteEl = fsContent.querySelector('#sheet-paste');
                const mappingPanel = fsContent.querySelector('#sheet-mapping-panel');
                const previewEl = fsContent.querySelector('#sheet-preview');
                const countEl = fsContent.querySelector('#sheet-count');
                const commitBtn = fsContent.querySelector('#sheet-commit');

                let headers = [];
                let rows = [];
                let mapping = { lat: 0, lon: 1, name: -1, desc: -1 };

                function parseDelimited(text, delim) {
                    const out = []; let row = [], cur = '', inQ = false;
                    for (let i = 0; i < text.length; i++) {
                        const ch = text[i];
                        if (inQ) {
                            if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
                            else cur += ch;
                        } else if (ch === '"' && cur === '') inQ = true;
                        else if (ch === delim) { row.push(cur.trim()); cur = ''; }
                        else if (ch === '\n' || ch === '\r') {
                            if (ch === '\r' && text[i+1] === '\n') i++;
                            row.push(cur.trim()); out.push(row); row = []; cur = '';
                        } else cur += ch;
                    }
                    row.push(cur.trim()); out.push(row);
                    return out.filter(r => r.some(c => c !== ''));
                }
                function findCol(keywords, exclude = []) {
                    for (const kw of keywords) {
                        const idx = headers.findIndex((h, i) => !exclude.includes(i) && h.toLowerCase().includes(kw));
                        if (idx !== -1) return idx;
                    }
                    return -1;
                }
                function buildSelectors() {
                    const sample = i => {
                        const r = rows.find(r => (r[i] || '') !== '');
                        return r ? ' — ' + r[i].substring(0, 20) : '';
                    };
                    const options = (selected, withNone) =>
                        (withNone ? `<option value="-1" ${selected < 0 ? 'selected' : ''}>— None —</option>` : '') +
                        headers.map((h, i) => `<option value="${i}" ${i === selected ? 'selected' : ''}>${escapeHtml(h || 'Col ' + (i+1))}${escapeHtml(sample(i))}</option>`).join('');
                    fsContent.querySelector('#sheet-lat').innerHTML = options(mapping.lat, false);
                    fsContent.querySelector('#sheet-lon').innerHTML = options(mapping.lon, false);
                    fsContent.querySelector('#sheet-name').innerHTML = options(mapping.name, true);
                    fsContent.querySelector('#sheet-desc').innerHTML = options(mapping.desc, true);
                }
                function updatePreview() {
                    if (!headers.length) return;
                    previewEl.innerHTML = `<table>
                        <thead><tr>${headers.map(h => `<th>${escapeHtml(h)}</th>`).join('')}</tr></thead>
                        <tbody>
                            ${rows.slice(0, 50).map(r => `<tr>${headers.map((_, i) => `<td title="${escapeHtml(r[i]||'')}">${escapeHtml(r[i]||'')}</td>`).join('')}</tr>`).join('')}
                        </tbody>
                    </table>`;
                    countEl.textContent = `${rows.length} data row(s)`;
                }
                function processPaste() {
                    const text = pasteEl.value.replace(/^\uFEFF/, '').trim();
                    if (!text) {
                        mappingPanel.style.display = 'none';
                        commitBtn.disabled = true;
                        previewEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--ink-3);font-size:0.78rem;">Paste data on the left</div>';
                        return;
                    }
                    const firstLine = text.split(/\r?\n/)[0];
                    const delim = firstLine.includes('\t') ? '\t' : ',';
                    const all = parseDelimited(text, delim);
                    if (all.length < 2) return;
                    headers = all[0];
                    rows = all.slice(1);

                    let lat = findCol(['latitude', 'lat']);
                    let lon = findCol(['longitude', 'long', 'lng', 'lon'], [lat]);
                    if (lat < 0) lat = 0;
                    if (lon < 0) lon = Math.min(1, headers.length - 1);
                    let name = findCol(['name', 'tag', 'title', 'label'], [lat, lon]);
                    let desc = findCol(['desc', 'detail', 'note', 'comment'], [lat, lon, name]);
                    mapping = { lat, lon, name, desc };

                    mappingPanel.style.display = 'block';
                    buildSelectors();
                    updatePreview();
                    commitBtn.disabled = false;
                }

                ['sheet-lat','sheet-lon','sheet-name','sheet-desc'].forEach(id => {
                    fsContent.querySelector('#' + id).addEventListener('change', (e) => {
                        mapping[id.split('-')[1]] = parseInt(e.target.value, 10);
                    });
                });
                pasteEl.addEventListener('input', processPaste);

                function closeSheet() {
                    fsOverlay.classList.remove('open');
                    fsContent.innerHTML = '';
                    updateMapToolsVisibility();
                }
                fsContent.querySelector('#sheet-close').addEventListener('click', closeSheet);
                fsContent.querySelector('#sheet-cancel').addEventListener('click', closeSheet);

                commitBtn.addEventListener('click', async () => {
                    if (!rows.length) return;
                    const folderName = prompt('Name for imported folder:', 'Imported points') || 'Imported points';
                    const folder = createNode({
                        type: 'folder', name: folderName, expanded: true, children: [],
                        meta: { color: '#4d7c0f', desc: `Imported from spreadsheet — ${rows.length} rows` }
                    });
                    let added = 0, skipped = 0;
                    rows.forEach((row, i) => {
                        const num = v => parseFloat(String(v || '').replace(/[°,\s]/g, ''));
                        const lat = num(row[mapping.lat]);
                        const lon = num(row[mapping.lon]);
                        if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) { skipped++; return; }
                        const name = mapping.name >= 0 && row[mapping.name] ? row[mapping.name] : `Point ${i + 1}`;
                        const desc = mapping.desc >= 0 ? row[mapping.desc] || '' : '';
                        const marker = L.marker([lat, lon], { icon: makeLeafletIcon(DEFAULT_ICON, '#4d7c0f') });
                        marker.bindPopup(`<b>${escapeHtml(name)}</b>${desc ? '<br>' + escapeHtml(desc) : ''}`);
                        drawnItems.addLayer(marker);
                        folder.children.push(createNode({
                            type: 'placemark', name, layer: marker,
                            meta: { desc, lat, lng: lon, icon: DEFAULT_ICON, color: '#4d7c0f' }
                        }));
                        added++;
                    });
                    if (added > 0) {
                        addNodeToTree(folder);
                        const bounds = L.latLngBounds([]);
                        folder.children.forEach(c => bounds.extend([c.meta.lat, c.meta.lng]));
                        if (bounds.isValid()) map.fitBounds(bounds, { padding: [60, 60] });
                        await persistTree();
                        closeSheet();
                        showToast(`Imported ${added} point(s)${skipped ? `, skipped ${skipped}` : ''}`, 'fa-check');
                    } else showToast('No valid coordinates found', 'fa-exclamation-circle');
                });
            }

            // ==================== DRAWING ====================
            const drawnItems = new L.FeatureGroup().addTo(map);
            let drawState = null;

            function clearDrawModeUI() {
                document.querySelectorAll('.map-tool').forEach(el => el.classList.remove('active'));
            }
            function cancelActiveDraw() {
                if (drawState) {
                    if (drawState.tempLayer) map.removeLayer(drawState.tempLayer);
                    drawState = null;
                }
                clearDrawModeUI();
                map.getContainer().style.cursor = '';
            }
            function beginDraw(type) {
                cancelActiveDraw();
                stopEditing();
                if (repositionState) endReposition();
                drawState = { type, points: [], tempLayer: null, lastClickTime: 0 };
                clearDrawModeUI();
                const btn = document.getElementById(
                    type === 'placemark' ? 'tool-placemark' :
                    type === 'path' ? 'tool-path' :
                    type === 'polygon' ? 'tool-polygon' :
                    type === 'measure' ? 'tool-measure' :
                    type === 'measure-area' ? 'tool-measure-area' : ''
                );
                if (btn) btn.classList.add('active');
                map.getContainer().style.cursor = 'crosshair';
                if (type === 'placemark') showToast('Click on the map to place a marker', 'fa-map-pin');
                else if (type === 'path' || type === 'measure') showToast('Click points · double-click to finish', 'fa-route');
                else if (type === 'polygon' || type === 'measure-area') showToast('Click points · double-click to close', 'fa-draw-polygon');
            }
            function updateTempPreview(latlng) {
                if (!drawState) return;
                if (drawState.tempLayer) { map.removeLayer(drawState.tempLayer); drawState.tempLayer = null; }
                if (drawState.type === 'path' || drawState.type === 'measure') {
                    const pts = drawState.points.concat([latlng]);
                    if (pts.length >= 2) {
                        const color = drawState.type === 'measure' ? '#f59e0b' : '#4d7c0f';
                        const dash = drawState.type === 'measure' ? '6,4' : null;
                        drawState.tempLayer = L.polyline(pts, { color, weight: 3, dashArray: dash || undefined, opacity: 0.75 }).addTo(map);
                    }
                } else if (drawState.type === 'polygon' || drawState.type === 'measure-area') {
                    const pts = drawState.points.concat([latlng]);
                    const color = drawState.type === 'measure-area' ? '#f59e0b' : '#4d7c0f';
                    const dash = drawState.type === 'measure-area' ? '6,4' : null;
                    if (pts.length >= 3) {
                        drawState.tempLayer = L.polygon(pts, { color, weight: 2, fillOpacity: 0.12, dashArray: dash || undefined, opacity: 0.75 }).addTo(map);
                    } else if (pts.length >= 2) {
                        drawState.tempLayer = L.polyline(pts, { color, weight: 2, dashArray: '4,4', opacity: 0.75 }).addTo(map);
                    }
                }
            }
            async function finishPathOrPolygon() {
                if (!drawState) return;
                const pts = drawState.points;
                const type = drawState.type;
                if (drawState.tempLayer) { map.removeLayer(drawState.tempLayer); drawState.tempLayer = null; }
                if (pts.length < 2) {
                    showToast('Not enough points', 'fa-info-circle');
                    drawState = null; clearDrawModeUI();
                    map.getContainer().style.cursor = '';
                    return;
                }
                const latlngs = pts.slice();
                drawState = null; clearDrawModeUI();
                map.getContainer().style.cursor = '';

                if (type === 'path' || type === 'measure') {
                    const d = pathDistance(latlngs);
                    const isMeasure = (type === 'measure');
                    const color = isMeasure ? '#f59e0b' : '#4d7c0f';
                    const line = L.polyline(latlngs, { color, weight: 3 });
                    drawnItems.addLayer(line);
                    if (isMeasure) {
                        const distStr = formatDistance(d);
                        line.bindPopup(`Distance: <b>${distStr}</b>`).openPopup();
                        const n = createNode({
                            type: 'measure', name: `Distance: ${distStr}`,
                            layer: line, meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]), color }
                        });
                        addNodeToTree(n);
                        await persistTree();
                        showToast('Measured: ' + distStr, 'fa-ruler');
                    } else {
                        const result = await openEditor({
                            type: 'path', name: 'New path',
                            meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]), color, desc: '' }
                        }, { isNew: true });
                        if (!result) { drawnItems.removeLayer(line); return; }
                        line.setStyle({ color: result.color });
                        line.bindPopup(`<b>${escapeHtml(result.name)}</b><br>Length: ${formatDistance(d)}`);
                        const n = createNode({
                            type: 'path', name: result.name, layer: line,
                            meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]), color: result.color, desc: result.desc }
                        });
                        addNodeToTree(n);
                        await persistTree();
                        showToast(`Path: ${result.name}`, 'fa-route');
                    }
                } else if (type === 'polygon' || type === 'measure-area') {
                    if (pts.length < 3) { showToast('Need 3+ points', 'fa-info-circle'); return; }
                    const isMeasure = (type === 'measure-area');
                    const color = isMeasure ? '#f59e0b' : '#4d7c0f';
                    const poly = L.polygon(latlngs, { color, weight: 2, fillOpacity: 0.2 });
                    drawnItems.addLayer(poly);
                    if (isMeasure) {
                        const a = polygonArea(latlngs);
                        const areaStr = formatArea(a);
                        poly.bindPopup(`Area: <b>${areaStr}</b>`).openPopup();
                        const n = createNode({
                            type: 'measure-area', name: `Area: ${areaStr}`,
                            layer: poly, meta: { area: a, points: latlngs.map(p => [p.lat, p.lng]), color }
                        });
                        addNodeToTree(n);
                        await persistTree();
                        showToast('Area: ' + areaStr, 'fa-vector-square');
                    } else {
                        const result = await openEditor({
                            type: 'polygon', name: 'New polygon',
                            meta: { points: latlngs.map(p => [p.lat, p.lng]), color, desc: '' }
                        }, { isNew: true });
                        if (!result) { drawnItems.removeLayer(poly); return; }
                        poly.setStyle({ color: result.color });
                        poly.bindPopup(`<b>${escapeHtml(result.name)}</b>`);
                        const n = createNode({
                            type: 'polygon', name: result.name, layer: poly,
                            meta: { points: latlngs.map(p => [p.lat, p.lng]), color: result.color, desc: result.desc }
                        });
                        addNodeToTree(n);
                        await persistTree();
                        showToast(`Polygon: ${result.name}`, 'fa-draw-polygon');
                    }
                }
            }

            map.on('click', async (e) => {

            document.getElementById('tool-placemark').addEventListener('click', () => beginDraw('placemark'));
            document.getElementById('tool-path').addEventListener('click', () => beginDraw('path'));
            document.getElementById('tool-polygon').addEventListener('click', () => beginDraw('polygon'));
            document.getElementById('tool-measure').addEventListener('click', () => beginDraw('measure'));
            document.getElementById('tool-measure-area').addEventListener('click', () => beginDraw('measure-area'));
            document.getElementById('tool-los').addEventListener('click', () => beginLOS());

            function stopEditing() { editingNodeId = null; }

            async function clearAllDrawings() {
                if (!confirm('Clear all drawings?')) return;

                drawnItems.clearLayers();
                const removeTypes = ['placemark','path','polygon','measure','measure-area','los'];
                function filterNodes(nodes) {
