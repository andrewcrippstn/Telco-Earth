                        renderTree();
                    }
                });
            });

            document.getElementById('sb-search').addEventListener('input', (e) => {
                const q = e.target.value.toLowerCase();
                subrailBody.querySelectorAll('.tree-item').forEach(el => {
                    const label = el.querySelector('.tree-item-label');
                    if (!label) return;
                    el.parentElement.style.display = label.textContent.toLowerCase().includes(q) ? '' : 'none';
                });
            });

            document.getElementById('cache-btn').addEventListener('click', () => {
                showToast(`Cache: ${tileCache.size} tiles · ${cacheHits} hits / ${cacheMisses} misses`, 'fa-database');
            });

            // ==================== FOLDER EDIT ====================
            async function promptNewFolder() {
                const result = await openModal('<i class="fas fa-folder-plus"></i> New folder',
                    `<label>Folder name</label>
                     <input type="text" data-field="name" value="New Folder" placeholder="Folder name…">`);
                if (!result) return;
                const name = (result.name || 'New Folder').trim();
                addNodeToTree(createNode({ type: 'folder', name, expanded: true, children: [] }));
                showToast(`Folder created: ${name}`, 'fa-folder-plus');
            }

            async function promptEditFolder(folder) {
                const result = await openModal('<i class="fas fa-folder"></i> Edit folder',
                    `<label>Folder name</label>
                     <input type="text" data-field="name" value="${escapeHtml(folder.name)}" placeholder="Folder name…">`);
                if (!result) return;
                folder.name = (result.name || folder.name).trim();
                renderTree();
                showToast(`Renamed to "${folder.name}"`, 'fa-check');
            }

            async function bulkChangeIcons(folder) {
                const placemarks = [];
                (function collect(n) {
                    if (n.type === 'placemark') placemarks.push(n);
                    if (n.children) n.children.forEach(collect);
                })(folder);
                if (!placemarks.length) { showToast('No placemarks in folder', 'fa-info-circle'); return; }
                const result = await openModal(
                    `<i class="fas fa-icons"></i> Change icons (${placemarks.length})`,
                    `<div class="icon-grid" id="icon-grid">
                        ${Object.keys(ICON_PRESETS).map(k => {
                            const p = ICON_PRESETS[k];
                            return `<div class="icon-choice" data-icon="${k}"><i class="fas ${p.fa}" style="color:${p.color};"></i></div>`;
                        }).join('')}
                     </div>`);
                if (!result || !result.iconPreset) return;
                placemarks.forEach(pm => {
                    pm.meta.iconPreset = result.iconPreset;
                    if (pm.layer && pm.layer.setIcon) pm.layer.setIcon(makeLeafletIcon(result.iconPreset));
                });
                renderTree();
                showToast(`Updated ${placemarks.length} placemark(s)`, 'fa-check');
            }

            async function bulkChangeColor(folder) {
                const items = [];
                (function collect(n) {
                    if (['placemark','path','polygon'].includes(n.type)) items.push(n);
                    if (n.children) n.children.forEach(collect);
                })(folder);
                if (!items.length) { showToast('No items to recolor', 'fa-info-circle'); return; }
                const COLORS = [
                    { name: 'Sage', hex: '#4d7c0f' }, { name: 'Forest', hex: '#166534' },
                    { name: 'Ocean', hex: '#1e40af' }, { name: 'Sky', hex: '#0284c7' },
                    { name: 'Sunset', hex: '#ea580c' }, { name: 'Ruby', hex: '#dc2626' },
                    { name: 'Amber', hex: '#d97706' }, { name: 'Violet', hex: '#7c3aed' }
                ];
                const result = await openModal('<i class="fas fa-palette"></i> Change color',
                    `<label>Pick a color</label>
                     <div class="icon-grid" style="grid-template-columns:repeat(4,1fr);" id="color-grid">
                        ${COLORS.map(c => `<div class="icon-choice" data-color="${c.hex}" title="${c.name}"><i class="fas fa-circle" style="color:${c.hex};"></i></div>`).join('')}
                     </div>`);
                if (!result || !result.color) return;
                items.forEach(item => {
                    if (item.type === 'placemark' && item.layer && item.layer.setIcon) {
                        const preset = item.meta.iconPreset || 'green-pin';
                        const p = ICON_PRESETS[preset];
                        if (p) {
                            const newKey = 'custom-' + result.color.replace('#','') + '-' + preset;
                            ICON_PRESETS[newKey] = { name: p.name, color: result.color, fa: p.fa };
                            item.meta.iconPreset = newKey;
                            item.layer.setIcon(makeLeafletIcon(newKey));
                        }
                    } else if (item.layer && item.layer.setStyle) {
                        item.layer.setStyle({ color: result.color });
                    }
                });
                renderTree();
                showToast(`Updated ${items.length} items`, 'fa-check');
            }

            // ==================== DRAWING ====================
            const drawnItems = new L.FeatureGroup().addTo(map);
            let drawState = null;

            function clearDrawModeUI() {
                document.querySelectorAll('.map-tool').forEach(el => el.classList.remove('active'));
            }
            function cancelActiveDraw() {
                if (drawState) {
                    if (drawState.tempLayer) map.removeLayer(drawState.tempLayer);
                    drawState = null;
                }
                clearDrawModeUI();
                map.getContainer().style.cursor = '';
            }

            function beginDraw(type) {
                cancelActiveDraw();
                stopEditing();
                drawState = { type, points: [], tempLayer: null, lastClickTime: 0 };
                clearDrawModeUI();
                const btn = document.getElementById(
                    type === 'placemark' ? 'tool-placemark' :
                    type === 'path' ? 'tool-path' :
                    type === 'polygon' ? 'tool-polygon' :
                    type === 'measure' ? 'tool-measure' :
                    type === 'measure-area' ? 'tool-measure-area' : ''
                );
                if (btn) btn.classList.add('active');
                map.getContainer().style.cursor = 'crosshair';
                if (type === 'placemark') showToast('Click on the map to place a marker', 'fa-map-pin');
                else if (type === 'path' || type === 'measure') showToast('Click points · double-click to finish', 'fa-route');
                else if (type === 'polygon' || type === 'measure-area') showToast('Click points · double-click to close', 'fa-draw-polygon');
            }

            function updateTempPreview(latlng) {
                if (!drawState) return;
                if (drawState.tempLayer) { map.removeLayer(drawState.tempLayer); drawState.tempLayer = null; }
                if (drawState.type === 'path' || drawState.type === 'measure') {
                    const pts = drawState.points.concat([latlng]);
                    if (pts.length >= 2) {
                        const color = drawState.type === 'measure' ? '#f59e0b' : '#4d7c0f';
                        const dash = drawState.type === 'measure' ? '6,4' : null;
                        drawState.tempLayer = L.polyline(pts, { color, weight: 3, dashArray: dash || undefined, opacity: 0.75 }).addTo(map);
                    }
                } else if (drawState.type === 'polygon' || drawState.type === 'measure-area') {
                    const pts = drawState.points.concat([latlng]);
                    const color = drawState.type === 'measure-area' ? '#f59e0b' : '#4d7c0f';
                    const dash = drawState.type === 'measure-area' ? '6,4' : null;
                    if (pts.length >= 3) {
                        drawState.tempLayer = L.polygon(pts, { color, weight: 2, fillOpacity: 0.12, dashArray: dash || undefined, opacity: 0.75 }).addTo(map);
                    } else if (pts.length >= 2) {
                        drawState.tempLayer = L.polyline(pts, { color, weight: 2, dashArray: '4,4', opacity: 0.75 }).addTo(map);
                    }
                }
            }

            async function finishPathOrPolygon() {
                if (!drawState) return;
                const pts = drawState.points;
                const type = drawState.type;
                if (drawState.tempLayer) { map.removeLayer(drawState.tempLayer); drawState.tempLayer = null; }
                if (pts.length < 2) {
                    showToast('Not enough points', 'fa-info-circle');
                    drawState = null; clearDrawModeUI();
                    map.getContainer().style.cursor = '';
                    return;
                }
                const latlngs = pts.slice();
                drawState = null; clearDrawModeUI();
                map.getContainer().style.cursor = '';

                if (type === 'path' || type === 'measure') {
                    const d = pathDistance(latlngs);
                    const isMeasure = (type === 'measure');
                    const color = isMeasure ? '#f59e0b' : '#4d7c0f';
                    const dash = isMeasure ? '6,4' : null;
                    const line = L.polyline(latlngs, { color, weight: 3, dashArray: dash || undefined });
                    drawnItems.addLayer(line);
                    if (isMeasure) {
                        const distStr = formatDistance(d);
                        line.bindPopup(`Distance: <b>${distStr}</b>`).openPopup();
                        addNodeToTree(createNode({ type: 'measure', name: `Distance: ${distStr}`, layer: line, meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]) } }));
                        showToast('Measured: ' + distStr, 'fa-ruler');
                    } else {
                        const result = await openModal('<i class="fas fa-route"></i> Save path',
                            `<label>Name</label><input type="text" data-field="name" value="Path" placeholder="Path name…">
                             <div style="font-size:0.78rem;color:var(--ink-2);">Length: ${formatDistance(d)}</div>`);
                        if (!result) { drawnItems.removeLayer(line); return; }
                        const name = (result.name || 'Path').trim();
                        line.bindPopup(`<b>${escapeHtml(name)}</b><br>Length: ${formatDistance(d)}`);
                        addNodeToTree(createNode({ type: 'path', name, layer: line, meta: { distance: d, points: latlngs.map(p => [p.lat, p.lng]) } }));
                        showToast(`Path: ${name}`, 'fa-route');
                    }
                } else if (type === 'polygon' || type === 'measure-area') {
                    if (pts.length < 3) { showToast('Need 3+ points', 'fa-info-circle'); return; }
                    const isMeasure = (type === 'measure-area');
                    const color = isMeasure ? '#f59e0b' : '#4d7c0f';
                    const dash = isMeasure ? '6,4' : null;
                    const poly = L.polygon(latlngs, { color, weight: 2, fillOpacity: isMeasure ? 0.18 : 0.22, dashArray: dash || undefined });
                    drawnItems.addLayer(poly);
                    if (isMeasure) {
                        const a = polygonArea(latlngs);
                        const areaStr = formatArea(a);
                        poly.bindPopup(`Area: <b>${areaStr}</b>`).openPopup();
                        addNodeToTree(createNode({ type: 'measure-area', name: `Area: ${areaStr}`, layer: poly, meta: { area: a, points: latlngs.map(p => [p.lat, p.lng]) } }));
                        showToast('Area: ' + areaStr, 'fa-vector-square');
                    } else {
                        const result = await openModal('<i class="fas fa-draw-polygon"></i> Save polygon',
                            `<label>Name</label><input type="text" data-field="name" value="Polygon" placeholder="Polygon name…">`);
                        if (!result) { drawnItems.removeLayer(poly); return; }
                        const name = (result.name || 'Polygon').trim();
                        poly.bindPopup(`<b>${escapeHtml(name)}</b>`);
                        addNodeToTree(createNode({ type: 'polygon', name, layer: poly, meta: { points: latlngs.map(p => [p.lat, p.lng]) } }));
                        showToast(`Polygon: ${name}`, 'fa-draw-polygon');
                    }
                }
            }

            map.on('click', async (e) => {
                updateTerrainDisplay(e.latlng.lat, e.latlng.lng);
                if (!drawState) return;

                const now = Date.now();
                const isDoubleClick = (now - (drawState.lastClickTime || 0)) < 350;
                drawState.lastClickTime = now;

                if (drawState.type === 'placemark') {
                    const latlng = e.latlng;
                    const result = await openModal('<i class="fas fa-map-pin"></i> Add placemark',
                        `<label>Name</label>
                         <input type="text" data-field="name" placeholder="Enter a name…" value="Placemark">
                         <label>Description</label>
                         <textarea data-field="desc" rows="2" placeholder="Optional description…"></textarea>
                         <label>Icon</label>
                         <div class="icon-grid" id="icon-grid">
                            ${Object.keys(ICON_PRESETS).map(k => {
                                const p = ICON_PRESETS[k];
                                return `<div class="icon-choice" data-icon="${k}"><i class="fas ${p.fa}" style="color:${p.color};"></i></div>`;
                            }).join('')}
                         </div>`);
                    drawState = null; clearDrawModeUI();
                    map.getContainer().style.cursor = '';
                    if (!result) return;
                    const name = (result.name || 'Placemark').trim();
                    const desc = (result.desc || '').trim();
                    const iconPreset = result.iconPreset || 'green-pin';
                    const marker = L.marker(latlng, { icon: makeLeafletIcon(iconPreset) });
                    marker.bindPopup(`<b>${escapeHtml(name)}</b>${desc ? '<br>' + escapeHtml(desc) : ''}`);
                    drawnItems.addLayer(marker);
                    addNodeToTree(createNode({ type: 'placemark', name, layer: marker, meta: { desc, lat: latlng.lat, lng: latlng.lng, iconPreset } }));
                    marker.openPopup();
                    showToast(`Placemark: ${name}`, 'fa-map-pin');
                    return;
                }

                if (isDoubleClick && (drawState.type === 'path' || drawState.type === 'polygon' ||
                    drawState.type === 'measure' || drawState.type === 'measure-area')) return;

                drawState.points.push(e.latlng);
                updateTempPreview(e.latlng);
            });

            map.on('mousemove', (e) => {
                map._lastMouseLatLng = e.latlng;
                updateTerrainDisplay(e.latlng.lat, e.latlng.lng);
                if (drawState && drawState.type !== 'placemark') updateTempPreview(e.latlng);
            });

            map.on('dblclick', (e) => {
                if (!drawState) return;
                if (drawState.type === 'path' || drawState.type === 'polygon' ||
                    drawState.type === 'measure' || drawState.type === 'measure-area') {
                    L.DomEvent.preventDefault(e);
                    L.DomEvent.stopPropagation(e);
                    finishPathOrPolygon();
                }
            });

            map.on('contextmenu', (e) => {
                if (drawState) { L.DomEvent.preventDefault(e); showToast('Drawing cancelled', 'fa-times'); cancelActiveDraw(); }
            });

            document.getElementById('tool-placemark').addEventListener('click', () => beginDraw('placemark'));
            document.getElementById('tool-path').addEventListener('click', () => beginDraw('path'));
            document.getElementById('tool-polygon').addEventListener('click', () => beginDraw('polygon'));
            document.getElementById('tool-measure').addEventListener('click', () => beginDraw('measure'));
            document.getElementById('tool-measure-area').addEventListener('click', () => beginDraw('measure-area'));

            // ==================== EDITING ====================
            let activeEditState = null;

            function startEditing(node) {
                if (!node || !node.layer) return;
                cancelActiveDraw();
                stopEditing();
                editingNodeId = node.id;
                selectedNodeId = node.id;
                renderTree();
                activeEditState = { node, vertexMarkers: [], midMarkers: [] };

                if (node.type === 'placemark') startPlacemarkEditing(node);
                else {
                    node.layer.getElement() && node.layer.getElement().classList.add('editing-shape');
                    attachVertexEditing(node.layer, node, node.type === 'polygon' || node.type === 'measure-area');
                    showToast('Drag vertices · blue midpoints add/reshape', 'fa-pen');
                }
            }

            function startPlacemarkEditing(node) {
                const marker = node.layer;
                if (marker.dragging) marker.dragging.enable();
                if (marker.getElement()) marker.getElement().style.filter = 'drop-shadow(0 0 8px var(--sage))';
                marker.on('dragend', onPlacemarkDragEnd);
                showPlacemarkEditPanel(node);
                showToast(`Editing "${node.name}" — drag to move`, 'fa-map-pin');
            }

            function onPlacemarkDragEnd(e) {
                const marker = e.target;
                const node = findNodeByLayer(marker);
                if (!node) return;
                const ll = marker.getLatLng();
                node.meta.lat = ll.lat;
                node.meta.lng = ll.lng;
            }

            function showPlacemarkEditPanel(node) {
                let panel = document.getElementById('pm-edit-panel');
                if (panel) panel.remove();
                panel = document.createElement('div');
                panel.id = 'pm-edit-panel';
                panel.className = 'pm-edit-panel';
                panel.innerHTML = `
                    <div class="pm-edit-header">
                        <span>Placemark</span>
                        <button id="pm-edit-close"><i class="fas fa-times"></i></button>
                    </div>
                    <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);font-weight:500;margin-bottom:5px;">Name</label>
                    <input type="text" id="pm-edit-name" class="pm-edit-input" value="${escapeHtml(node.name)}">
                    <label style="display:block;font-family:'IBM Plex Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-3);font-weight:500;margin-bottom:5px;">Icon</label>
                    <div class="icon-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:10px;">
                        ${Object.keys(ICON_PRESETS).map(k => {
                            const p = ICON_PRESETS[k];
                            const sel = (node.meta.iconPreset === k) ? 'selected' : '';
                            return `<div class="icon-choice ${sel}" data-icon="${k}"><i class="fas ${p.fa}" style="color:${p.color};"></i></div>`;
                        }).join('')}
                    </div>
                    <button class="btn btn-primary" id="pm-edit-done" style="width:100%;">Done</button>
                `;
                document.body.appendChild(panel);

                panel.querySelectorAll('.icon-choice').forEach(el => {
                    el.addEventListener('click', () => {
                        const preset = el.dataset.icon;
                        node.meta.iconPreset = preset;
                        node.layer.setIcon(makeLeafletIcon(preset));
                        panel.querySelectorAll('.icon-choice').forEach(x => x.classList.remove('selected'));
                        el.classList.add('selected');
                        renderTree();
                    });
                });
                document.getElementById('pm-edit-name').addEventListener('input', (e) => {
                    node.name = e.target.value;
                    renderTree();
                });
                document.getElementById('pm-edit-close').addEventListener('click', stopEditing);
                document.getElementById('pm-edit-done').addEventListener('click', () => { stopEditing(); showToast('Updated', 'fa-check'); });
            }

            function attachVertexEditing(layer, node, isPolygon) {
                const latlngs = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                latlngs.forEach((ll, i) => {
                    const marker = L.marker(ll, {
                        draggable: true,
                        icon: L.divIcon({ className: 'vertex-marker', iconSize: [14, 14] }),
                        zIndexOffset: 1000
                    }).addTo(map);
                    marker.on('drag', (e) => {
                        const newLatLng = e.target.getLatLng();
                        const arr = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                        arr[i] = newLatLng;
                        if (isPolygon) layer.setLatLngs([arr]);
                        else layer.setLatLngs(arr);
                        updateMidpoints(layer, node, isPolygon);
                    });
                    marker.on('dragend', () => updateShapeMeta(layer, node));
                    marker.on('contextmenu', (e) => {
                        L.DomEvent.preventDefault(e);
                        L.DomEvent.stopPropagation(e);
                        const arr = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                        if (isPolygon && arr.length <= 3) { showToast('Min 3 vertices'); return; }
                        if (!isPolygon && arr.length <= 2) { showToast('Min 2 vertices'); return; }
                        arr.splice(i, 1);
                        if (isPolygon) layer.setLatLngs([arr]);
                        else layer.setLatLngs(arr);
                        refreshEditMarkers(node);
                        updateShapeMeta(layer, node);
                        showToast('Vertex removed', 'fa-eraser');
                    });
                    activeEditState.vertexMarkers.push(marker);
                });
                updateMidpoints(layer, node, isPolygon);
            }

            function updateMidpoints(layer, node, isPolygon) {
                activeEditState.midMarkers.forEach(m => map.removeLayer(m));
                activeEditState.midMarkers = [];
                const arr = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                const count = arr.length;
                const maxMid = isPolygon ? count : count - 1;
                for (let i = 0; i < maxMid; i++) {
                    const a = arr[i];
                    const b = arr[(i + 1) % count];
                    if (!a || !b) continue;
                    const midLat = (a.lat + b.lat) / 2;
                    const midLng = (a.lng + b.lng) / 2;
                    const midMarker = L.marker([midLat, midLng], {
                        draggable: true,
                        icon: L.divIcon({ className: 'midpoint-marker', iconSize: [12, 12] }),
                        zIndexOffset: 900
                    }).addTo(map);
                    let insertedIndex = null;
                    let inserted = false;
                    midMarker.on('dragstart', () => {
                        if (inserted) return;
                        const arr2 = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                        insertedIndex = i + 1;
                        arr2.splice(insertedIndex, 0, midMarker.getLatLng());
                        if (isPolygon) layer.setLatLngs([arr2]);
                        else layer.setLatLngs(arr2);
                        inserted = true;
                    });
                    midMarker.on('drag', (e) => {
                        if (insertedIndex === null) return;
                        const newLL = e.target.getLatLng();
                        const arr2 = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                        arr2[insertedIndex] = newLL;
                        if (isPolygon) layer.setLatLngs([arr2]);
                        else layer.setLatLngs(arr2);
                    });
                    midMarker.on('dragend', () => {
                        if (insertedIndex !== null) { refreshEditMarkers(node); updateShapeMeta(layer, node); }
                    });
                    midMarker.on('click', (e) => {
                        L.DomEvent.preventDefault(e);
                        L.DomEvent.stopPropagation(e);
                        if (inserted) return;
                        const arr2 = isPolygon ? layer.getLatLngs()[0] : layer.getLatLngs();
                        arr2.splice(i + 1, 0, L.latLng(midLat, midLng));
                        if (isPolygon) layer.setLatLngs([arr2]);
                        else layer.setLatLngs(arr2);
                        refreshEditMarkers(node);
                        updateShapeMeta(layer, node);
                        showToast('Vertex added', 'fa-plus');
                    });
                    activeEditState.midMarkers.push(midMarker);
                }
            }

            function refreshEditMarkers(node) {
                activeEditState.vertexMarkers.forEach(m => map.removeLayer(m));
                activeEditState.midMarkers.forEach(m => map.removeLayer(m));
                activeEditState.vertexMarkers = [];
                activeEditState.midMarkers = [];
                const isPolygon = (node.type === 'polygon' || node.type === 'measure-area');
                attachVertexEditing(node.layer, node, isPolygon);
            }

            function updateShapeMeta(layer, node) {
                if (node.type === 'path' || node.type === 'measure') {
                    const latlngs = layer.getLatLngs();
                    const d = pathDistance(latlngs);
                    node.meta.distance = d;
                    node.meta.points = latlngs.map(p => [p.lat, p.lng]);
                    if (node.type === 'measure') {
                        node.name = `Distance: ${formatDistance(d)}`;
                        layer.setPopupContent(`Distance: <b>${formatDistance(d)}</b>`);
                    } else {
                        layer.setPopupContent(`<b>${escapeHtml(node.name)}</b><br>Length: ${formatDistance(d)}`);
                    }
                } else if (node.type === 'polygon' || node.type === 'measure-area') {
                    const latlngs = layer.getLatLngs()[0];
                    const a = polygonArea(latlngs);
                    node.meta.area = a;
                    node.meta.points = latlngs.map(p => [p.lat, p.lng]);
                    if (node.type === 'measure-area') {
                        node.name = `Area: ${formatArea(a)}`;
                        layer.setPopupContent(`Area: <b>${formatArea(a)}</b>`);
                    } else {
                        layer.setPopupContent(`<b>${escapeHtml(node.name)}</b><br>Area: ${formatArea(a)}`);
                    }
                }
                renderTree();
            }

            function stopEditing() {
                const panel = document.getElementById('pm-edit-panel');
                if (panel) panel.remove();
                if (activeEditState) {
                    activeEditState.vertexMarkers.forEach(m => map.removeLayer(m));
                    activeEditState.midMarkers.forEach(m => map.removeLayer(m));
                    const layer = activeEditState.node.layer;
                    if (layer && layer.getElement()) {
                        layer.getElement().classList.remove('editing-shape');
                        layer.getElement().style.filter = '';
                    }
                    if (activeEditState.node.type === 'placemark' && layer.dragging) {
                        layer.off('dragend', onPlacemarkDragEnd);
                    }
                    activeEditState = null;
                }
                if (editingNodeId) { editingNodeId = null; renderTree(); }
            }

            function findNodeByLayer(layer, nodes = treeNodes) {
                for (const n of nodes) {
                    if (n.layer === layer) return n;
                    if (n.children) { const f = findNodeByLayer(layer, n.children); if (f) return f; }
                }
                return null;
            }

            function clearAllDrawings() {
                if (!confirm('Clear all drawings?')) return;
                cancelActiveDraw(); stopEditing();
                drawnItems.clearLayers();
                const removeTypes = ['placemark','path','polygon','measure','measure-area'];
                function filterNodes(nodes) {
                    return nodes.filter(n => {
                        if (removeTypes.includes(n.type)) return false;
                        if (n.children) n.children = filterNodes(n.children);
                        return true;
                    });
                }
                treeNodes = filterNodes(treeNodes);
                selectedNodeId = null;
                renderTree();
                showToast('All drawings cleared', 'fa-eraser');
            }

            // ==================== DISTANCE / AREA ====================
            function haversine(a, b) {
                const R = 6371000;
                const φ1 = a.lat * Math.PI / 180, φ2 = b.lat * Math.PI / 180;
                const Δφ = (b.lat - a.lat) * Math.PI / 180;
                const Δλ = (b.lng - a.lng) * Math.PI / 180;
                const s = Math.sin(Δφ/2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) ** 2;
                return 2 * R * Math.asin(Math.sqrt(s));
            }
            function pathDistance(latlngs) {
                let total = 0;
                for (let i = 1; i < latlngs.length; i++) total += haversine(latlngs[i-1], latlngs[i]);
                return total;
            }
            function polygonArea(latlngs) {
                if (latlngs.length < 3) return 0;
                const R = 6371000;
                let area = 0;
                for (let i = 0; i < latlngs.length; i++) {
                    const p1 = latlngs[i], p2 = latlngs[(i + 1) % latlngs.length];
                    area += (p2.lng - p1.lng) * Math.PI / 180 * (2 + Math.sin(p1.lat * Math.PI / 180) + Math.sin(p2.lat * Math.PI / 180));
                }
                return Math.abs(area * R * R / 2);
            }
            function formatDistance(m) {
                if (m < 1000) return `${m.toFixed(1)} m`;
                return `${(m / 1000).toFixed(3)} km`;
            }
            function formatArea(m2) {
                if (m2 < 1e6) return `${m2.toFixed(0)} m²`;
                if (m2 < 1e10) return `${(m2 / 1e6).toFixed(3)} km²`;
                return `${(m2 / 1e6).toExponential(2)} km²`;
            }

            // ==================== MODAL ====================
            const modalOverlay = document.getElementById('modal-overlay');
            const modalTitle = document.getElementById('modal-title');
            const modalBody = document.getElementById('modal-body');
            let modalResolver = null;
            let modalSelectedIcon = 'green-pin';

            function openModal(title, bodyHtml) {
                modalTitle.innerHTML = title;
                modalBody.innerHTML = bodyHtml;
                modalOverlay.classList.add('open');
                modalSelectedIcon = 'green-pin';

                const iconGrid = modalBody.querySelector('#icon-grid');
                if (iconGrid) {
                    const choices = iconGrid.querySelectorAll('.icon-choice');
                    const defaultChoice = Array.from(choices).find(c => c.dataset.icon === 'green-pin') || choices[0];
                    if (defaultChoice) defaultChoice.classList.add('selected');
                    choices.forEach(el => {
                        el.addEventListener('click', () => {
                            choices.forEach(x => x.classList.remove('selected'));
                            el.classList.add('selected');
                            modalSelectedIcon = el.dataset.icon;
                        });
                    });
                }

                const colorGrid = modalBody.querySelector('#color-grid');
                let selectedColor = null;
                if (colorGrid) {
                    const choices = colorGrid.querySelectorAll('.icon-choice');
                    if (choices[0]) choices[0].classList.add('selected');
                    selectedColor = choices[0] ? choices[0].dataset.color : null;
                    choices.forEach(el => {
                        el.addEventListener('click', () => {
                            choices.forEach(x => x.classList.remove('selected'));
                            el.classList.add('selected');
                            selectedColor = el.dataset.color;
                        });
                    });
                }

                const firstInput = modalBody.querySelector('input, textarea, select');
                if (firstInput) setTimeout(() => { firstInput.focus(); firstInput.select(); }, 100);
                return new Promise(resolve => {
                    modalResolver = (fields) => {
                        if (fields) {
                            fields.iconPreset = modalSelectedIcon;
                            fields.color = selectedColor;
                        }
                        resolve(fields);
                    };
                });
            }

            document.getElementById('modal-cancel').addEventListener('click', () => {
                modalOverlay.classList.remove('open');
                if (modalResolver) modalResolver(null);
                modalResolver = null;
            });
            document.getElementById('modal-ok').addEventListener('click', () => {
                modalOverlay.classList.remove('open');
                if (modalResolver) {
                    const fields = {};
                    modalBody.querySelectorAll('input, textarea, select').forEach(el => {
                        fields[el.dataset.field || el.id || el.name] = el.value;
                    });
                    modalResolver(fields);
                }
                modalResolver = null;
            });
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) document.getElementById('modal-cancel').click();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.classList.contains('open')) document.getElementById('modal-cancel').click();
                if (e.key === 'Enter' && modalOverlay.classList.contains('open')) {
                    const active = document.activeElement;
                    if (active && active.tagName !== 'TEXTAREA') document.getElementById('modal-ok').click();
                }
            });

            // ==================== KML IMPORT ====================
            kmlInput.addEventListener('change', async (e) => {
                const files = e.target.files;
                if (!files || !files.length) return;
                for (const file of files) {
                    try {
                        const text = await file.text();
                        await importKML(text, file.name);
                    } catch (err) {
                        console.error(err);
                        showToast(`KML error: ${file.name}`, 'fa-exclamation-circle');
                    }
                }
                kmlInput.value = '';
            });

            async function importKML(text, filename) {
                const parser = new DOMParser();
                let doc;
                try { doc = parser.parseFromString(text, 'text/xml'); }
                catch (err) { showToast('Invalid KML', 'fa-exclamation-circle'); return; }
                if (doc.querySelector('parsererror')) { showToast('KML parse error', 'fa-exclamation-circle'); return; }
                if (!doc.querySelector('kml')) { showToast('Not a KML file', 'fa-exclamation-circle'); return; }

                const placemarks = doc.querySelectorAll('Placemark');
                if (!placemarks.length) { showToast('No placemarks', 'fa-info-circle'); return; }

                const folderName = filename.replace(/\.(kml|kmz)$/i, '');
                const kmlFolder = createNode({ type: 'folder', name: folderName, expanded: true, children: [] });
                let count = 0;

                placemarks.forEach((pm, idx) => {
                    const nameEl = pm.querySelector('name');
                    const descEl = pm.querySelector('description');
                    const name = nameEl ? nameEl.textContent.trim() : `Placemark ${idx + 1}`;
                    const desc = descEl ? descEl.textContent.trim() : '';

                    const point = pm.querySelector('Point coordinates');
                    if (point) {
                        const coords = parseKMLCoords(point.textContent);
                        if (coords.length) {
                            const [lng, lat] = coords[0];
                            const marker = L.marker([lat, lng], { icon: makeLeafletIcon('green-pin') });
                            marker.bindPopup(`<b>${escapeHtml(name)}</b>`);
                            drawnItems.addLayer(marker);
                            kmlFolder.children.push(createNode({ type: 'placemark', name, layer: marker, meta: { desc, lat, lng, kml: true, iconPreset: 'green-pin' } }));
                            count++;
                        }
                    }
                    const lineEl = pm.querySelector('LineString coordinates');
                    if (lineEl) {
                        const coords = parseKMLCoords(lineEl.textContent);
                        if (coords.length >= 2) {
                            const latlngs = coords.map(c => [c[1], c[0]]);
                            const line = L.polyline(latlngs, { color: '#4d7c0f', weight: 3 });
                            line.bindPopup(`<b>${escapeHtml(name)}</b>`);
                            drawnItems.addLayer(line);
                            kmlFolder.children.push(createNode({ type: 'path', name, layer: line, meta: { desc, points: latlngs, kml: true } }));
                            count++;
                        }
                    }
                    const polyEl = pm.querySelector('Polygon outerBoundaryIs LinearRing coordinates');
                    if (polyEl) {
                        const coords = parseKMLCoords(polyEl.textContent);
                        if (coords.length >= 3) {
                            const latlngs = coords.map(c => [c[1], c[0]]);
                            const poly = L.polygon(latlngs, { color: '#4d7c0f', weight: 2, fillOpacity: 0.15 });
                            poly.bindPopup(`<b>${escapeHtml(name)}</b>`);
                            drawnItems.addLayer(poly);
                            kmlFolder.children.push(createNode({ type: 'polygon', name, layer: poly, meta: { desc, points: latlngs, kml: true } }));
                            count++;
                        }
                    }
                });

                if (count > 0) {
                    addNodeToTree(kmlFolder);
                    const bounds = L.latLngBounds([]);
                    kmlFolder.children.forEach(c => {
                        if (c.layer) {
                            if (c.layer.getBounds) { try { bounds.extend(c.layer.getBounds()); } catch(e){} }
                            else if (c.layer.getLatLng) bounds.extend(c.layer.getLatLng());
                        }
                    });
                    if (bounds.isValid()) map.flyToBounds(bounds, { padding: [40,40], duration: 1.2 });
                    showToast(`Imported ${count} items`, 'fa-file-import');
                } else {
                    showToast('No importable geometries', 'fa-info-circle');
                }
            }

            function parseKMLCoords(text) {
                if (!text) return [];
                return text.trim().split(/\s+/).map(p => p.split(',').map(parseFloat))
                    .filter(b => b.length >= 2 && !isNaN(b[0]) && !isNaN(b[1]));
            }

            // ==================== EXPORT KML ====================
            function exportKML() {
                const lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<kml xmlns="http://www.opengis.net/kml/2.2">', '<Document>'];
                lines.push(`<name>Telco Earth Export</name>`);
                function writeNode(node, indent) {
                    const pad = '  '.repeat(indent);
                    if (node.type === 'folder') {
                        lines.push(`${pad}<Folder><name>${escapeXml(node.name)}</name>`);
                        if (node.children) node.children.forEach(c => writeNode(c, indent + 1));
                        lines.push(`${pad}</Folder>`);
                    } else if (node.type === 'placemark' && node.layer && node.layer.getLatLng) {
                        const ll = node.layer.getLatLng();
                        lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                        if (node.meta && node.meta.desc) lines.push(`${pad}  <description>${escapeXml(node.meta.desc)}</description>`);
                        lines.push(`${pad}  <Point><coordinates>${ll.lng},${ll.lat},0</coordinates></Point>`);
                        lines.push(`${pad}</Placemark>`);
                    } else if ((node.type === 'path' || node.type === 'measure') && node.layer && node.layer.getLatLngs) {
                        const lls = node.layer.getLatLngs();
                        lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                        lines.push(`${pad}  <LineString><coordinates>`);
                        lls.forEach(ll => lines.push(`${pad}    ${ll.lng},${ll.lat},0`));
                        lines.push(`${pad}  </coordinates></LineString></Placemark>`);
                    } else if ((node.type === 'polygon' || node.type === 'measure-area') && node.layer && node.layer.getLatLngs) {
                        const rings = node.layer.getLatLngs();
                        const outer = Array.isArray(rings[0]) ? rings[0] : rings;
                        lines.push(`${pad}<Placemark><name>${escapeXml(node.name)}</name>`);
                        lines.push(`${pad}  <Polygon><outerBoundaryIs><LinearRing><coordinates>`);
                        outer.forEach(ll => lines.push(`${pad}    ${ll.lng},${ll.lat},0`));
                        lines.push(`${pad}  </coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`);
                    }
                }
                treeNodes.forEach(n => writeNode(n, 1));
                lines.push('</Document>', '</kml>');
                const blob = new Blob([lines.join('\n')], { type: 'application/vnd.google-earth.kml+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'telco-earth-export.kml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 3000);
                showToast('KML exported', 'fa-file-export');
            }

            // ==================== HGT TERRAIN ====================
            const terrainStore = new Map();
            const visibleTiles = new Set();
            const heatmapCache = new Map();
            let showAllHeatmaps = false;

            function syncShowAllState() {
                showAllHeatmaps = (terrainStore.size > 0 && visibleTiles.size === terrainStore.size);
            }

            const elevCard = document.getElementById('elev-card');
            const elevValue = document.getElementById('elev-value');
            const coordLat = document.getElementById('coord-lat');
            const coordLng = document.getElementById('coord-lng');
            const elevHint = document.getElementById('elev-hint');
            const terrainStatusEl = document.getElementById('terrain-status');

            function parseHgtArrayBuffer(arrayBuffer) {
                const byteLength = arrayBuffer.byteLength;
                const totalSamples = byteLength / 2;
                const dim = Math.round(Math.sqrt(totalSamples));
                if (dim * dim * 2 !== byteLength) throw new Error(`Bad HGT size: ${byteLength}`);
                const width = dim, height = dim;
                const data = new Int16Array(totalSamples);
                const view = new DataView(arrayBuffer);
                for (let i = 0; i < totalSamples; i++) data[i] = view.getInt16(i * 2, false);
                return { data, width, height };
            }
            function getKeyFromFilename(name) {
                const base = name.replace(/\.[^/.]+$/, '').toUpperCase();
                return base.match(/^([NS])(\d{2})([EW])(\d{3})$/) ? base : null;
            }
            function parseKey(key) {
                const latSign = key[0] === 'N' ? 1 : -1;
                const latVal = parseInt(key.substring(1, 3), 10) * latSign;
                const lngSign = key[3] === 'E' ? 1 : -1;
                const lngVal = parseInt(key.substring(4, 7), 10) * lngSign;
                return { lat: latVal, lng: lngVal };
            }
            function getElevationFromTile(tile, lat, lng) {
                const { data, width, height } = tile;
                const { lat: swLat, lng: swLng } = parseKey(tile.key);
                let fLat = lat - swLat, fLng = lng - swLng;
                if (fLat < 0 || fLat > 1 || fLng < 0 || fLng > 1) return null;
                const row = Math.round((1 - fLat) * (height - 1));
                const col = Math.round(fLng * (width - 1));
                if (row < 0 || row >= height || col < 0 || col >= width) return null;
                const v = data[row * width + col];
                if (v === -32768 || v < -1000 || v > 9000) return null;
                return v;
            }
            function getElevation(lat, lng) {
                if (terrainStore.size === 0) return null;
                let normLng = lng;
                while (normLng < -180) normLng += 360;
                while (normLng > 180) normLng -= 360;
                const tileLat = Math.floor(lat);
                const tileLng = Math.floor(normLng);
                const latKeyChar = tileLat >= 0 ? 'N' : 'S';
                const lngKeyChar = tileLng >= 0 ? 'E' : 'W';
                const latVal = Math.abs(tileLat).toString().padStart(2, '0');
                const lngVal = Math.abs(tileLng).toString().padStart(3, '0');
                const key = `${latKeyChar}${latVal}${lngKeyChar}${lngVal}`;
                if (terrainStore.has(key)) return getElevationFromTile(terrainStore.get(key), lat, normLng);
                return null;
            }
            function updateTerrainDisplay(lat, lng) {
                if (terrainStore.size === 0) return;
                coordLat.textContent = `lat ${lat.toFixed(5)}°`;
                coordLng.textContent = `lng ${lng.toFixed(5)}°`;
                const elev = getElevation(lat, lng);
                if (elev === null || isNaN(elev)) {
                    elevValue.innerHTML = `— <small>m</small>`;
                    elevHint.textContent = 'No data for this location';
                } else {
                    elevValue.innerHTML = `${Math.round(elev)} <small>m</small>`;
                    elevHint.textContent = `${terrainStore.size} tile(s) loaded`;
                }
            }
            function updateTerrainVisibility() {
                if (terrainStore.size > 0) {
                    elevCard.classList.remove('hidden');
                    terrainStatusEl.classList.add('loaded');
                    terrainStatusEl.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem;"></i> ${terrainStore.size} tile(s)`;
                } else {
                    elevCard.classList.add('hidden');
                    terrainStatusEl.classList.remove('loaded');
                    terrainStatusEl.innerHTML = `<i class="fas fa-circle" style="font-size: 0.5rem; color: var(--ink-3);"></i> No terrain loaded`;
                }
            }

            fileInput.addEventListener('change', async (event) => {
                const files = event.target.files;
                if (!files || files.length === 0) return;
                let loaded = 0, failed = 0;
                const loadedKeys = [];
                for (const file of files) {
                    const key = getKeyFromFilename(file.name);
                    if (!key) { failed++; continue; }
                    try {
                        const arrayBuffer = await file.arrayBuffer();
                        const parsed = parseHgtArrayBuffer(arrayBuffer);
                        terrainStore.set(key, { data: parsed.data, width: parsed.width, height: parsed.height, key });
                        loaded++; loadedKeys.push(key);
                    } catch (err) { failed++; console.error(err); }
                }
                if (loaded > 0) {
                    let terrainFolder = findNodeByName('Terrain (HGT)');
                    if (!terrainFolder) {
                        terrainFolder = createNode({ type: 'folder', name: 'Terrain (HGT)', expanded: true, children: [] });
                        addNodeToTree(terrainFolder);
                    }
                    loadedKeys.forEach(k => {
                        const existing = terrainFolder.children.find(c => c.meta && c.meta.key === k);
                        if (!existing) terrainFolder.children.push(createNode({ type: 'terrain', name: k, layer: null, meta: { key: k } }));
                        visibleTiles.add(k);
                    });
                    syncShowAllState();
                    updateTerrainVisibility();
                    redrawTerrainOverlays();
                    if (activeSection === 'terrain') renderStaticSection('terrain');
                    else renderTree();
                    showToast(`${loaded} HGT tile(s) loaded`, 'fa-mountain');
                } else {
                    showToast('No valid HGT files', 'fa-exclamation-circle');
                }
                const c = map._lastMouseLatLng || map.getCenter();
                updateTerrainDisplay(c.lat, c.lng);
                fileInput.value = '';
            });

            map.on('move', () => {
                if (!map._lastMouseLatLng) {
                    const c = map.getCenter();
                    updateTerrainDisplay(c.lat, c.lng);
                }
            });

            function toggleTileVisibility(key) {
                if (visibleTiles.has(key)) visibleTiles.delete(key);
                else visibleTiles.add(key);
                syncShowAllState();
                redrawTerrainOverlays();
            }

            const terrainOverlayGroup = L.featureGroup().addTo(map);

            function redrawTerrainOverlays() {
                terrainOverlayGroup.clearLayers();
                if (visibleTiles.size === 0) return;
                visibleTiles.forEach(key => {
                    const tile = terrainStore.get(key);
                    if (!tile) return;
                    const layers = buildTerrainOverlayLayers(tile);
                    layers.forEach(l => terrainOverlayGroup.addLayer(l));
                });
                if (drawnItems && drawnItems.bringToFront) drawnItems.bringToFront();
            }

            function computeTileStats(tile) {
                if (tile._stats) return tile._stats;
                const data = tile.data;
                let minV = 32767, maxV = -32768;
                const step = (tile.width >= 3600) ? 8 : (tile.width >= 1200 ? 4 : 1);
                for (let i = 0; i < data.length; i += step) {
                    const v = data[i];
                    if (v > 0 && v < 9000) { if (v < minV) minV = v; if (v > maxV) maxV = v; }
                }
                if (minV > maxV) { minV = 0; maxV = 0; }
                tile._stats = { min: minV, max: maxV };
                return tile._stats;
            }

            function buildHeatmapCanvasForTile(tile) {
                const SIZE = 1024;
                const canvas = document.createElement('canvas');
                canvas.width = SIZE;
                canvas.height = SIZE;
                const ctx = canvas.getContext('2d');
                const data = tile.data;
                const w = tile.width, h = tile.height;
                const stats = computeTileStats(tile);
                const minV = stats.min, maxV = stats.max;
                const range = Math.max(1, maxV - minV);
                const scheme = HEATMAP_SCHEMES[currentSchemeKey];

                const img = ctx.createImageData(SIZE, SIZE);
                const px = img.data;

                for (let y = 0; y < SIZE; y++) {
                    const srcY = Math.floor((y / SIZE) * (h - 1));
                    for (let x = 0; x < SIZE; x++) {
                        const srcX = Math.floor((x / SIZE) * (w - 1));
                        const v = data[srcY * w + srcX];
                        const idx = (y * SIZE + x) * 4;
                        if (v === -32768 || v <= 0 || v > 9000) {
                            px[idx + 3] = 0;
                            continue;
                        }
                        const t = (v - minV) / range;
                        const c = scheme.color(t);
                        px[idx] = c[0];
                        px[idx+1] = c[1];
                        px[idx+2] = c[2];
                        px[idx+3] = c[3] !== undefined ? c[3] : 210;
                    }
                }
                ctx.putImageData(img, 0, 0);
                return canvas;
            }

            function getOrCreateHeatmap(tile) {
                const cacheKey = tile.key + '|' + currentSchemeKey;
                if (heatmapCache.has(cacheKey)) return heatmapCache.get(cacheKey);
                const canvas = buildHeatmapCanvasForTile(tile);
                const stats = computeTileStats(tile);
                const entry = { canvas, min: stats.min, max: stats.max };
                heatmapCache.set(cacheKey, entry);
                return entry;
            }

            function buildTerrainOverlayLayers(tile) {
                const key = tile.key;
                const sw = parseKey(key);
                const tileBounds = [[sw.lat, sw.lng], [sw.lat + 1, sw.lng + 1]];

                const heat = getOrCreateHeatmap(tile);
                const dataURL = heat.canvas.toDataURL('image/png');

                const overlay = L.imageOverlay(dataURL, tileBounds, {
                    opacity: 0.85,
                    interactive: false,
                    className: 'hgt-heat-canvas',
                    zIndex: 400
                });

                const rect = L.rectangle(tileBounds, {
                    color: '#4d7c0f', weight: 2, fill: false,
                    dashArray: '5,4', interactive: true
                });
                rect.bindTooltip(
                    `<b>${escapeHtml(key)}</b><br>Elev: ${heat.min}–${heat.max} m`,
                    { sticky: true, direction: 'top' }
                );

                return [overlay, rect];
            }

            // ==================== GEOLOCATION ====================
            function locateMe() {
                if (!navigator.geolocation) { showToast('Geolocation not supported', 'fa-info-circle'); return; }
                showToast('Locating…', 'fa-location-dot');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude, accuracy } = pos.coords;
                        map.flyTo([latitude, longitude], 13, { duration: 1.5 });
                        L.circleMarker([latitude, longitude], { radius: 8, color: '#4d7c0f', fillColor: '#65a30d', fillOpacity: 0.9, weight: 2 })
                            .addTo(map).bindPopup(`You are here<br>±${Math.round(accuracy)} m`).openPopup();
                        showToast('Located', 'fa-location-dot');
                    },
                    () => showToast('Location error', 'fa-exclamation-circle'),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }

            document.addEventListener('keydown', (e) => {
                if ((e.key === 'l' || e.key === 'L') && !e.target.matches('input, textarea')) locateMe();
            });

            // ==================== INITIAL ====================
            renderTree();
            updateTerrainVisibility();
            setTimeout(() => showToast('Telco Earth ready', 'fa-tower-broadcast'), 700);
        })();
    </script>
</body>
</html>
